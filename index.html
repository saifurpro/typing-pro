const T11={"bn":[{"n":"রক্তদান ও মানবসেবা","x":"রক্তদান মানবসেবার সবচেয়ে সহজ ও মহৎ উপায়গুলোর একটি। কৃত্রিমভাবে রক্ত তৈরি করা যায় না, তাই দুর্ঘটনা, অস্ত্রোপচার, সন্তান প্রসব, ক্যানসার ও থ্যালাসেমিয়ার মতো রোগে আক্রান্ত মানুষের প্রাণ বাঁচাতে অন্য মানুষের দেওয়া রক্তই একমাত্র ভরসা। মানুষের রক্ত প্রধানত এ, বি, এবি এবং ও এই চারটি গ্রুপে ভাগ করা হয়, আর এই শ্রেণিবিভাগ আবিষ্কার করেছিলেন বিজ্ঞানী কার্ল ল্যান্ডস্টেইনার। তাঁর জন্মদিন ১৪ জুনকে বিশ্ব রক্তদাতা দিবস হিসেবে পালন করা হয়। সাধারণত আঠারো থেকে ষাট বছর বয়সী সুস্থ ব্যক্তি, যাঁর ওজন অন্তত পঞ্চাশ কেজি, রক্ত দিতে পারেন। রক্ত নেওয়ার আগে দাতার শরীর পরীক্ষা করা হয় এবং সংগৃহীত রক্ত হেপাটাইটিস, এইচআইভি ও ম্যালেরিয়াসহ নানা সংক্রমণের জন্য যাচাই করা হয়, ফলে গ্রহীতার ঝুঁকি থাকে না। এক ব্যাগ রক্ত দিলে দাতার শরীরে কয়েক সপ্তাহের মধ্যেই তা পূরণ হয়ে যায়, তাই কোনো ক্ষতির আশঙ্কা নেই। একজন দাতা সাধারণত তিন থেকে চার মাস পর পর রক্ত দিতে পারেন। বাংলাদেশে অনেক স্বেচ্ছাসেবী সংগঠন নিয়মিত রক্তদান কর্মসূচি চালায়, আর ঢাকা মেডিকেল কলেজের শিক্ষার্থীদের উদ্যোগে গড়ে ওঠা সন্ধানী তাদের মধ্যে অন্যতম। অনেকের মনে ভুল ধারণা আছে যে রক্ত দিলে মানুষ দুর্বল হয়ে পড়ে, অথচ বিজ্ঞান তা সমর্থন করে না। যিনি রক্ত দেন, তিনি শুধু একটি জীবন নয়, একটি পরিবারের স্বপ্নও বাঁচিয়ে তোলেন। রক্তদানের আগে পর্যাপ্ত ঘুম ও পানি পান করা এবং খালি পেটে না থাকা ভালো। তাই সুস্থ থাকলে স্বেচ্ছায় রক্ত দিতে এগিয়ে আসা আমাদের সবার উচিত।"},{"n":"ডেঙ্গু ও মশাবাহিত রোগ প্রতিরোধ","x":"ডেঙ্গু একটি ভাইরাসজনিত রোগ, যা এডিস জাতের মশার কামড়ে ছড়ায়। এই মশা সাধারণত দিনের বেলায় কামড়ায়, বিশেষ করে ভোরে ও বিকেলে। এরা জমে থাকা পরিষ্কার পানিতে ডিম পাড়ে, তাই ফুলের টব, পুরোনো টায়ার, ডাবের খোসা, ছাদে জমে থাকা পানি ও বালতি মশার প্রজননের প্রিয় স্থান। ডেঙ্গুতে আক্রান্ত হলে হঠাৎ উচ্চ জ্বর, তীব্র মাথাব্যথা, চোখের পেছনে ব্যথা, গায়ে ও গিঁটে ব্যথা এবং শরীরে লালচে দানা দেখা দিতে পারে। এই রোগের নির্দিষ্ট কোনো ওষুধ নেই, তবে পর্যাপ্ত বিশ্রাম, প্রচুর তরল খাবার ও চিকিৎসকের পরামর্শে ব্যথানাশক গ্রহণ করলে অধিকাংশ রোগী সেরে ওঠেন। জ্বরের সঙ্গে প্রচণ্ড পেটব্যথা, বারবার বমি, নাক বা মাড়ি থেকে রক্তপাত কিংবা অতিরিক্ত দুর্বলতা দেখা দিলে দেরি না করে হাসপাতালে যেতে হয়, কারণ তখন রক্তের প্লাটিলেট কমে গিয়ে অবস্থা গুরুতর হতে পারে। বাংলাদেশে বর্ষা মৌসুমে ডেঙ্গুর প্রকোপ বেশি দেখা যায়, আর শহরের ঘনবসতিপূর্ণ এলাকায় এর ঝুঁকিও বেশি। প্রতিরোধের সবচেয়ে কার্যকর উপায় হলো বাড়ির আশপাশে পানি জমতে না দেওয়া এবং সপ্তাহে অন্তত একবার পাত্র ও টব খালি করা। ঘুমানোর সময় মশারি ব্যবহার, জানালায় জাল লাগানো এবং ফুল হাতার জামা পরাও উপকারী। ব্যবহার না করা পাত্র উপুড় করে রাখা এবং নালা নর্দমা পরিষ্কার রাখাও মশার বংশবৃদ্ধি ঠেকাতে সাহায্য করে। এলাকায় কোথাও পানি জমে থাকতে দেখলে স্থানীয় কর্তৃপক্ষকে জানানো প্রত্যেক নাগরিকের দায়িত্ব। সিটি করপোরেশনের উদ্যোগের পাশাপাশি প্রত্যেক নাগরিকের সচেতনতাই পারে এই রোগকে নিয়ন্ত্রণে রাখতে।"},{"n":"প্রবাসী শ্রমিক ও রেমিট্যান্স","x":"বাংলাদেশের অর্থনীতিতে প্রবাসী শ্রমিকদের অবদান অনেক বড়। লক্ষ লক্ষ বাংলাদেশি কাজের সন্ধানে সৌদি আরব, সংযুক্ত আরব আমিরাত, ওমান, কুয়েত, কাতার ও মালয়েশিয়াসহ নানা দেশে গিয়ে বসবাস করছেন। তাঁরা সেখানে নির্মাণ, কারখানা, সেবা ও গৃহকর্মের মতো বিভিন্ন খাতে কাজ করে যে অর্থ দেশে পাঠান, তাকে রেমিট্যান্স বা প্রবাসী আয় বলা হয়। তৈরি পোশাক রপ্তানির পরেই রেমিট্যান্স দেশের বৈদেশিক মুদ্রা আয়ের দ্বিতীয় বৃহত্তম উৎস। এই অর্থ শুধু পরিবারের খরচ মেটায় না, এর একটি বড় অংশ জমি কেনা, ঘরবাড়ি নির্মাণ, সন্তানের লেখাপড়া ও ছোট ব্যবসায় ব্যবহৃত হয়, ফলে গ্রামীণ অর্থনীতিও সচল থাকে। দেশের বৈদেশিক মুদ্রার রিজার্ভ ও আমদানির খরচ মেটাতেও রেমিট্যান্সের ভূমিকা অপরিহার্য। কিন্তু প্রবাসী জীবন সহজ নয়। অনেক শ্রমিককে দালালের প্রতারণা, অতিরিক্ত অভিবাসন খরচ, কম মজুরি ও কঠিন কাজের পরিবেশের মুখোমুখি হতে হয়। তাই বিদেশ যাওয়ার আগে বৈধ পথে যাচাই করে যাওয়া এবং সরকার অনুমোদিত প্রশিক্ষণ নেওয়া খুব জরুরি। দক্ষ কর্মী বেশি আয় করতে পারেন এবং সম্মানজনক কাজও পান। অর্থ পাঠানোর সময় ব্যাংক ও অনুমোদিত মোবাইল আর্থিক সেবার মতো বৈধ মাধ্যম ব্যবহার করা উচিত, যাতে দেশের অর্থনীতি লাভবান হয়। প্রবাস থেকে ফিরে আসা শ্রমিকদের অভিজ্ঞতা কাজে লাগিয়ে দেশে নতুন উদ্যোগ গড়ার সুযোগ করে দিলে সেই দক্ষতা দেশের উন্নয়নে আরও বড় ভূমিকা রাখতে পারে। প্রবাসীরা দেশের গর্ব, তাই তাঁদের অধিকার ও নিরাপত্তা নিশ্চিত করা আমাদের সবার দায়িত্ব।"},{"n":"ফ্রিল্যান্সিং ও আউটসোর্সিং","x":"ফ্রিল্যান্সিং হলো এমন এক ধরনের পেশা, যেখানে কেউ কোনো প্রতিষ্ঠানের স্থায়ী কর্মচারী না হয়ে নিজের দক্ষতা ব্যবহার করে বিভিন্ন গ্রাহকের কাজ করে দেন এবং কাজের বিনিময়ে পারিশ্রমিক পান। আর যখন কোনো দেশের প্রতিষ্ঠান নিজের কাজের একটি অংশ অন্য দেশের দক্ষ কর্মীদের দিয়ে করিয়ে নেয়, তখন তাকে আউটসোর্সিং বলা হয়। ইন্টারনেট ও অনলাইন মার্কেটপ্লেসের কল্যাণে এখন ঘরে বসেই বিশ্বের যেকোনো প্রান্তের গ্রাহকের জন্য কাজ করা যায়। বাংলাদেশের তরুণেরা গ্রাফিক ডিজাইন, ওয়েবসাইট তৈরি, ডিজিটাল মার্কেটিং, অনুবাদ, কনটেন্ট লেখা ও তথ্য সংগ্রহের মতো নানা কাজে দক্ষতা দেখিয়ে সুনাম অর্জন করেছেন। বিশ্বের অন্যতম বৃহৎ ফ্রিল্যান্সার সমাজের মধ্যে বাংলাদেশ এখন উল্লেখযোগ্য অবস্থানে রয়েছে। এ পেশায় সফল হতে হলে প্রথমে একটি নির্দিষ্ট বিষয়ে ভালো দক্ষতা অর্জন করতে হয়। এরপর নিজের কাজের নমুনা নিয়ে একটি পোর্টফোলিও তৈরি করা এবং গ্রাহকের সঙ্গে স্পষ্ট ও ভদ্রভাবে যোগাযোগ রাখা প্রয়োজন। ইংরেজিতে লেখা ও কথা বলার সক্ষমতা এখানে বড় সহায়ক। সময়মতো কাজ জমা দেওয়া, সততা বজায় রাখা এবং গ্রাহকের তথ্য গোপন রাখা একজন ফ্রিল্যান্সারের সুনামের ভিত্তি। তবে অনলাইনে অনেক প্রতারক সক্রিয় থাকে, তাই অগ্রিম অর্থ দাবি করে এমন প্রস্তাব থেকে সাবধান থাকা উচিত। নিয়মিত নতুন প্রযুক্তি শেখাও এই পেশায় টিকে থাকার জন্য খুবই জরুরি। সঠিক প্রস্তুতি ও ধৈর্য থাকলে ফ্রিল্যান্সিং বেকারত্ব দূর করে বিদেশি মুদ্রা আয়ের মাধ্যমে দেশের অর্থনীতিকেও এগিয়ে নিতে পারে।"},{"n":"ড্রোন প্রযুক্তি ও এর ব্যবহার","x":"ড্রোন হলো এমন এক ধরনের উড়ন্ত যন্ত্র, যা মানুষ না চড়েই দূর থেকে নিয়ন্ত্রণ করে ওড়ানো যায়। এতে সাধারণত ছোট মোটর, পাখা, ব্যাটারি, ক্যামেরা ও বিভিন্ন সেন্সর থাকে। প্রথমে ড্রোন মূলত সামরিক কাজে ব্যবহৃত হতো, কিন্তু এখন সাধারণ মানুষের কাজেও এর ব্যবহার দ্রুত বাড়ছে। কৃষিক্ষেত্রে ড্রোন দিয়ে জমির ফসলের অবস্থা পর্যবেক্ষণ করা এবং কম সময়ে সার বা কীটনাশক ছিটানো যায়। বন্যা, ঘূর্ণিঝড় বা ভূমিকম্পের পর দুর্গম এলাকায় ক্ষয়ক্ষতির ছবি তুলে উদ্ধারকাজে সহায়তা করতেও ড্রোন কাজে আসে। বিয়ে বা অনুষ্ঠানের ছবি তোলা, নির্মাণ কাজের অগ্রগতি দেখা, ভূমির মানচিত্র তৈরি করা এবং দুর্গম জায়গায় ওষুধ পৌঁছে দেওয়ার মতো কাজেও এর গুরুত্ব বেড়েছে। অনেক দেশে ড্রোনের মাধ্যমে পণ্য পরিবহনেরও পরীক্ষা চলছে। তবে এই প্রযুক্তি ব্যবহারে কিছু বিষয়ে সতর্ক থাকতে হয়। বিমানবন্দর, সামরিক স্থাপনা ও জনবহুল এলাকার কাছাকাছি ড্রোন ওড়ানো বিপজ্জনক এবং অনেক ক্ষেত্রে নিষিদ্ধ। অন্যের ব্যক্তিগত জীবনের ছবি তোলাও আইনত অপরাধ হতে পারে। তাই ড্রোন ওড়ানোর আগে প্রয়োজনীয় অনুমতি নেওয়া এবং নিয়ম মেনে চলা আবশ্যক। ড্রোনের ব্যাটারি অল্প সময় চলে বলে এটি একবারে দীর্ঘ পথ পাড়ি দিতে পারে না, আর খারাপ আবহাওয়ায় ওড়ানোও কঠিন। এসব সীমাবদ্ধতা কাটাতে গবেষণা চলছে। সঠিক ও দায়িত্বশীল ব্যবহার নিশ্চিত করা গেলে ড্রোন প্রযুক্তি কৃষি, দুর্যোগ ব্যবস্থাপনা ও সেবা খাতে বড় পরিবর্তন আনতে পারে এবং প্রশিক্ষিত তরুণদের জন্য নতুন কর্মসংস্থানের পথও খুলে দিতে পারে।"},{"n":"ক্লাউড কম্পিউটিং ও তথ্য সংরক্ষণ","x":"ক্লাউড কম্পিউটিং বলতে ইন্টারনেটের মাধ্যমে দূরবর্তী সার্ভারে তথ্য জমা রাখা এবং সফটওয়্যার ও অন্যান্য সেবা ব্যবহার করার পদ্ধতিকে বোঝায়। আগে কোনো প্রতিষ্ঠানকে নিজের কম্পিউটার ও সার্ভার কিনে সেগুলো রক্ষণাবেক্ষণ করতে হতো, যা ছিল ব্যয়বহুল। এখন সেই সক্ষমতা ইন্টারনেটের মাধ্যমে প্রয়োজন অনুযায়ী ভাড়া নেওয়া যায়, আর ব্যবহার অনুযায়ী খরচ দিতে হয়। এই প্রযুক্তির সবচেয়ে বড় সুবিধা হলো যেকোনো স্থান থেকে, যেকোনো যন্ত্রের সাহায্যে নিজের তথ্য খুলে দেখা যায়। ছবি ও নথি সংরক্ষণ, ইমেইল সেবা, অনলাইন ব্যাংকিং এবং সামাজিক যোগাযোগমাধ্যম সবই কোনো না কোনোভাবে ক্লাউডের ওপর নির্ভর করে। বিশাল ডেটা সেন্টারে হাজার হাজার কম্পিউটার একসঙ্গে কাজ করে এবং তথ্যের একাধিক অনুলিপি রাখে, ফলে কোনো যন্ত্র নষ্ট হলেও তথ্য হারায় না। ব্যবসা বাড়লে সক্ষমতা সহজে বাড়ানো আর কমলে কমিয়ে ফেলাও যায়, যা ক্ষুদ্র উদ্যোক্তাদের জন্য খুবই উপযোগী। তবে ক্লাউডেরও কিছু ঝুঁকি আছে। ইন্টারনেট না থাকলে তথ্যে প্রবেশ করা কঠিন হয়, আর দুর্বল পাসওয়ার্ড ব্যবহার করলে তথ্য চুরির আশঙ্কা থাকে। তাই শক্তিশালী পাসওয়ার্ড, দুই ধাপের যাচাই পদ্ধতি এবং গুরুত্বপূর্ণ নথির আলাদা অনুলিপি রাখা উচিত। অনেক শিক্ষার্থী ও চাকরিজীবী এখন তাঁদের গুরুত্বপূর্ণ ফাইল ক্লাউডে রেখে মোবাইল বা কম্পিউটার যেকোনোটি থেকে খুলে কাজ করেন। এতে কাজের গতি ও সুবিধা দুটোই বাড়ে। সরকারি সেবা ডিজিটাল করার ক্ষেত্রেও নিরাপদ ডেটা সেন্টার ও ক্লাউড প্রযুক্তি দিন দিন গুরুত্বপূর্ণ হয়ে উঠছে।"},{"n":"মুদ্রাস্ফীতি ও নিত্যপণ্যের দাম","x":"মুদ্রাস্ফীতি বলতে কোনো দেশে পণ্য ও সেবার সামগ্রিক দাম ধীরে ধীরে বেড়ে যাওয়াকে বোঝায়। দাম বাড়লে একই পরিমাণ টাকা দিয়ে আগের চেয়ে কম জিনিস কেনা যায়, অর্থাৎ টাকার ক্রয়ক্ষমতা কমে যায়। সাধারণত চাল, ডাল, তেল, চিনি, সবজি ও মাংসের মতো নিত্যপণ্যের দামের পরিবর্তন দেখেই সাধারণ মানুষ মুদ্রাস্ফীতির চাপ টের পান। এর পেছনে একাধিক কারণ কাজ করে। চাহিদার তুলনায় যোগান কম হলে দাম বাড়ে। আমদানি করা পণ্যের দাম বা জ্বালানির খরচ বেড়ে গেলে উৎপাদন ও পরিবহন ব্যয় বাড়ে, আর টাকার মান কমে গেলেও আমদানিনির্ভর পণ্য ব্যয়বহুল হয়ে ওঠে। কখনো কখনো কিছু অসাধু ব্যবসায়ী কৃত্রিম সংকট তৈরি করে অতিরিক্ত দাম আদায় করেন। মুদ্রাস্ফীতির সবচেয়ে বেশি ক্ষতি হয় নির্দিষ্ট আয়ের মানুষ ও নিম্ন আয়ের পরিবারের, কারণ তাদের আয় দামের সঙ্গে তাল মিলিয়ে বাড়ে না। বাংলাদেশ পরিসংখ্যান ব্যুরো ভোক্তামূল্য সূচকের ভিত্তিতে নিয়মিত মুদ্রাস্ফীতির হার প্রকাশ করে। দাম নিয়ন্ত্রণে কেন্দ্রীয় ব্যাংক সুদের হার ও অর্থ সরবরাহ নিয়ন্ত্রণ করে, আর সরকার বাজার তদারকি করে এবং ট্রেডিং কর্পোরেশন অব বাংলাদেশের মাধ্যমে ন্যায্য দামে পণ্য বিক্রি করে। ভোক্তা হিসেবে আমরাও অপ্রয়োজনীয় কেনাকাটা কমিয়ে এবং খাদ্যের অপচয় রোধ করে বাজারের ওপর চাপ কমাতে পারি। অকারণে মজুত করার প্রবণতা দামের অস্থিরতা আরও বাড়িয়ে দেয়। তাই পরিমিত ক্রয় ও সচেতনতা খুবই জরুরি। দেশে উৎপাদন বাড়ানো, সরবরাহ ব্যবস্থা উন্নত করা এবং অপচয় কমানোর মাধ্যমেই এই সমস্যার টেকসই সমাধান সম্ভব।"},{"n":"আবহাওয়া পূর্বাভাস ও আবহাওয়াবিজ্ঞান","x":"আবহাওয়া হলো কোনো স্থানের নির্দিষ্ট সময়ের তাপমাত্রা, বৃষ্টিপাত, বাতাস ও আর্দ্রতার অবস্থা। আবহাওয়াবিজ্ঞানীরা এসব উপাদান পর্যবেক্ষণ করে আগামী দিনগুলোর অবস্থা সম্পর্কে যে আগাম ধারণা দেন, তাকে আবহাওয়া পূর্বাভাস বলে। এই কাজে আবহাওয়া কেন্দ্র, কৃত্রিম উপগ্রহ, রাডার, বেলুন ও সমুদ্রে ভাসমান যন্ত্রের মাধ্যমে প্রতিনিয়ত তথ্য সংগ্রহ করা হয়। এরপর শক্তিশালী কম্পিউটারে গাণিতিক মডেল চালিয়ে ভবিষ্যৎ অবস্থার হিসাব কষা হয়। বাংলাদেশে এই দায়িত্ব পালন করে বাংলাদেশ আবহাওয়া অধিদপ্তর। আমাদের দেশ ঘূর্ণিঝড়, কালবৈশাখী, বন্যা ও অতিবৃষ্টির মতো দুর্যোগপ্রবণ হওয়ায় সঠিক পূর্বাভাসের গুরুত্ব অনেক বেশি। সমুদ্রে ঝড় তৈরি হলে বিপদ সংকেত জারি করা হয়, ফলে জেলেরা সময়মতো নিরাপদ স্থানে ফিরতে পারেন এবং উপকূলের মানুষ আশ্রয়কেন্দ্রে যেতে পারেন। কৃষকেরাও পূর্বাভাস দেখে বীজ বোনা, সেচ দেওয়া বা ফসল কাটার সময় ঠিক করেন। বিমান ও নৌযান চলাচলেও আবহাওয়ার তথ্য ছাড়া চলা সম্ভব নয়। তবে আবহাওয়া ও জলবায়ু এক জিনিস নয়, কারণ আবহাওয়া অল্প সময়ের অবস্থা বোঝায়, আর জলবায়ু বহু বছরের গড় অবস্থাকে বোঝায়। প্রযুক্তির উন্নতির ফলে পূর্বাভাস আগের চেয়ে নির্ভুল হলেও প্রকৃতির খামখেয়ালির কারণে কখনো কখনো তা মেলে না। মোবাইল ফোনের অ্যাপ, রেডিও ও টেলিভিশনের মাধ্যমে এখন সাধারণ মানুষ খুব সহজেই আবহাওয়ার হালনাগাদ খবর পেয়ে যান। বজ্রপাতের সময় খোলা মাঠ ও জলাশয় থেকে দূরে থাকা বিশেষভাবে জরুরি। তাই আবহাওয়ার খবর শুনে সচেতন থাকা আমাদের সবার কর্তব্য।"},{"n":"ডাকঘর ও চিঠিপত্রের ঐতিহ্য","x":"একসময় দূরের মানুষের খবর পাওয়ার প্রধান ভরসা ছিল চিঠি, আর সেই চিঠি পৌঁছে দেওয়ার দায়িত্ব পালন করত ডাকঘর। গ্রামে গ্রামে খাকি পোশাক পরা ডাকপিয়ন ব্যাগ কাঁধে নিয়ে সাইকেলে বা পায়ে হেঁটে চিঠি বিলি করতেন, আর তাঁর আসার অপেক্ষায় অনেক পরিবার উৎসুক হয়ে থাকত। লাল রঙের ডাকবাক্স ছিল শহর ও গ্রামের পরিচিত দৃশ্য। কবিগুরু রবীন্দ্রনাথ ঠাকুরের লেখা ডাকঘর নাটকও সেই সময়ের মানুষের প্রতীক্ষার অনুভূতি ফুটিয়ে তুলেছে। চিঠির পাশাপাশি ডাকঘর মানি অর্ডার, পার্সেল, রেজিস্ট্রি ও সঞ্চয়পত্র বিক্রির মতো নানা সেবা দিয়ে আসছে। ডাকটিকিট সংগ্রহ অনেকের কাছে একটি সুন্দর শখ, কারণ এতে দেশের ইতিহাস, বিখ্যাত ব্যক্তি ও ঐতিহ্যের ছবি থাকে। প্রতি বছর ৯ অক্টোবর বিশ্ব ডাক দিবস পালিত হয়। মোবাইল ফোন, ইমেইল ও সামাজিক যোগাযোগমাধ্যম আসার পর চিঠি লেখার অভ্যাস অনেক কমে গেছে, কিন্তু ডাকঘর তাতে হারিয়ে যায়নি। সময়ের সঙ্গে তাল মিলিয়ে ডাক বিভাগ এখন অনলাইন কেনাকাটার পণ্য পৌঁছে দেয় এবং ডিজিটাল আর্থিক সেবাও দিচ্ছে। তবু হাতে লেখা চিঠির আন্তরিকতা ও আবেগ আর কোনো মাধ্যমে পাওয়া যায় না। চিঠির ঠিকানায় পোস্ট কোড লেখার নিয়ম চালু হওয়ায় চিঠি দ্রুত সঠিক জায়গায় পৌঁছানো সহজ হয়েছে। ঈদ বা নববর্ষের শুভেচ্ছা কার্ড পাঠানোর রেওয়াজও একসময় খুব জনপ্রিয় ছিল। আজকের দ্রুতগতির যুগেও কিছু মানুষ ডাকঘরের এই ধীর অথচ আন্তরিক যোগাযোগের মূল্য ভোলেননি। শিক্ষার্থীদের উচিত মাঝে মাঝে প্রিয়জনকে চিঠি লিখে এই সুন্দর ঐতিহ্যটিকে বাঁচিয়ে রাখা।"},{"n":"পরিবার ও সামাজিক বন্ধন","x":"পরিবার হলো সমাজের সবচেয়ে ছোট ও সবচেয়ে গুরুত্বপূর্ণ একক। মানুষ জন্মের পর প্রথম যে পাঠশালায় পড়ে, তা হলো তার পরিবার। এখানেই সে ভালোবাসা, সহমর্মিতা, শৃঙ্খলা, বড়দের প্রতি শ্রদ্ধা ও ছোটদের প্রতি স্নেহের শিক্ষা পায়। আমাদের দেশে একসময় যৌথ পরিবারের প্রচলন বেশি ছিল, যেখানে দাদা দাদি, বাবা মা, চাচা ফুফু ও ভাইবোন একসঙ্গে বসবাস করতেন। এখন কাজ ও পড়াশোনার কারণে অনেকে শহরে এসে ছোট পরিবারে থাকছেন। ধরন বদলালেও পরিবারের গুরুত্ব বদলায়নি। বিপদে, অসুখে কিংবা আর্থিক সংকটে পরিবারের সদস্যরাই সবার আগে পাশে দাঁড়ান। প্রতিবেশী, আত্মীয় ও বন্ধুদের নিয়ে গড়ে ওঠা সামাজিক বন্ধন মানুষকে একাকিত্ব থেকে রক্ষা করে এবং মানসিক শক্তি জোগায়। কিন্তু বর্তমানে মোবাইল ও ইন্টারনেটের অতিরিক্ত ব্যবহারের কারণে একই ঘরে থেকেও অনেক সদস্য একে অপরের সঙ্গে কথা বলার সময় পান না। এতে সম্পর্কের দূরত্ব ও ভুল বোঝাবুঝি বাড়তে পারে। পরিবারের সবাই মিলে একসঙ্গে খাওয়া, গল্প করা ও ছুটির দিনে বেড়াতে যাওয়ার অভ্যাস সম্পর্ককে মজবুত করে। সবার মতামতকে গুরুত্ব দেওয়া এবং ছোটখাটো মতভেদ ধৈর্য ধরে মিটিয়ে নেওয়াও জরুরি। সুখী ও সুশৃঙ্খল পরিবার থেকেই একটি সুন্দর সমাজ ও আদর্শ জাতি গড়ে ওঠে। পরিবারের বড়দের কাছ থেকে শোনা গল্প, উপদেশ ও জীবনের অভিজ্ঞতা শিশুদের চরিত্র গঠনে বড় ভূমিকা রাখে। বাবা মা নিজেরা সৎ ও ধৈর্যশীল হলে সন্তানেরাও সেই আদর্শ গ্রহণ করে। তাই প্রতিদিন প্রিয়জনদের সময় দেওয়া আমাদের সবার কর্তব্য।"},{"n":"মেধাস্বত্ব ও কপিরাইট","x":"মেধাস্বত্ব হলো মানুষের মেধা ও সৃজনশীলতা থেকে সৃষ্টি হওয়া কোনো কিছুর ওপর তার আইনি মালিকানা। এর মধ্যে রয়েছে কপিরাইট, পেটেন্ট, ট্রেডমার্ক ও নকশার অধিকার। গল্প, কবিতা, গান, ছবি, চলচ্চিত্র ও কম্পিউটার সফটওয়্যারের মতো সৃষ্টিকর্মের ওপর স্রষ্টার যে অধিকার জন্মায়, তাকে কপিরাইট বা কপিস্বত্ব বলে। কোনো নিবন্ধন ছাড়াই সৃষ্টির সঙ্গে সঙ্গে এই অধিকার তৈরি হয়। আর নতুন আবিষ্কারের ওপর অধিকারকে বলা হয় পেটেন্ট, যা আবিষ্কারককে নির্দিষ্ট সময়ের জন্য একচেটিয়া ব্যবহারের সুযোগ দেয়। বাংলাদেশে কপিরাইট আইন ২০০০ এবং পরবর্তী সংশোধনীর মাধ্যমে স্রষ্টাদের অধিকার সুরক্ষিত রাখা হয়েছে। এই আইনে অনুমতি ছাড়া কারও লেখা বা গান নকল করা, কপি করে বিক্রি করা কিংবা পাইরেটেড সফটওয়্যার ব্যবহার করা শাস্তিযোগ্য অপরাধ। প্রতি বছর ২৬ এপ্রিল বিশ্ব মেধাসম্পদ দিবস পালিত হয়। মেধাস্বত্বের সুরক্ষা না থাকলে লেখক, শিল্পী ও গবেষকেরা নতুন কিছু সৃষ্টি করতে উৎসাহ হারাতেন, কারণ তাঁদের পরিশ্রমের ফল অন্যেরা বিনা মূল্যে নিয়ে যেত। শিক্ষার্থীদের বোঝা দরকার যে অন্যের লেখা কপি করে নিজের নামে চালিয়ে দেওয়া চুরির শামিল। কারও কাজ থেকে তথ্য নিলে তার উৎসের উল্লেখ করতে হয়। বর্তমান ডিজিটাল যুগে অনলাইনে ছবি, বই ও গান সহজে কপি করা যায় বলে কপিরাইট লঙ্ঘনের ঘটনাও বেড়েছে। তাই কোনো সৃষ্টিকর্ম ব্যবহার করার আগে অনুমতি আছে কি না, তা যাচাই করা উচিত। সৃজনশীল মানুষের অধিকারকে সম্মান করলেই দেশে মৌলিক চিন্তা ও উদ্ভাবনের পরিবেশ তৈরি হয়।"},{"n":"চিত্রকলা ও চারুশিল্প","x":"চিত্রকলা হলো রং, রেখা ও রূপের মাধ্যমে মনের ভাব প্রকাশ করার শিল্প। বাংলার চিত্রকলার ইতিহাস অনেক প্রাচীন। গ্রামবাংলার পটচিত্র, নকশিকাঁথার নকশা, মাটির সরা ও রিকশার গায়ের রঙিন ছবি আমাদের লোকশিল্পের সমৃদ্ধ ঐতিহ্যকে তুলে ধরে। আধুনিক চিত্রকলায় শিল্পাচার্য জয়নুল আবেদিনের অবদান অবিস্মরণীয়। ১৯৪৩ সালের মন্বন্তরের সময় তিনি যে কালির রেখাচিত্র এঁকেছিলেন, তা আজও দুর্ভিক্ষের করুণ সাক্ষী হয়ে আছে। তাঁর উদ্যোগেই ১৯৪৮ সালে ঢাকায় আর্ট ইনস্টিটিউট প্রতিষ্ঠিত হয়, যা এখন ঢাকা বিশ্ববিদ্যালয়ের চারুকলা অনুষদ নামে পরিচিত। এস এম সুলতান গ্রামের কৃষকদের শক্তিশালী ও পেশিবহুল রূপে এঁকে আলাদা পরিচিতি পেয়েছেন, আর কামরুল হাসানের আঁকা পোস্টার মুক্তিযুদ্ধের সময় মানুষের মনে সাহস জুগিয়েছিল। চিত্রকলা শুধু বিনোদন নয়, এটি সমাজের আয়না। একজন শিল্পী তাঁর ছবির মাধ্যমে দুঃখ, আনন্দ, প্রতিবাদ ও স্বপ্নের কথা মানুষের কাছে পৌঁছে দেন। ছোটদের মধ্যে ছবি আঁকার চর্চা তাদের কল্পনাশক্তি, মনোযোগ ও সৃজনশীলতা বাড়ায়। বাংলাদেশ শিল্পকলা একাডেমিসহ বিভিন্ন প্রতিষ্ঠান নিয়মিত চিত্রপ্রদর্শনী ও শিল্প প্রতিযোগিতার আয়োজন করে। ঢাকা ও দেশের অন্যান্য শহরে এখন অনেক বেসরকারি গ্যালারিও গড়ে উঠেছে, যেখানে তরুণ শিল্পীরা নিজেদের কাজ দর্শকের সামনে তুলে ধরতে পারেন। দেশ ও বিদেশে আমাদের শিল্পীদের কাজ প্রশংসিত হচ্ছে। নতুন প্রজন্মের শিল্পীদের উৎসাহ দিলে এবং গ্যালারিতে গিয়ে ছবি দেখার অভ্যাস গড়ে তুললে আমাদের শিল্পকলা আরও সমৃদ্ধ হবে।"},{"n":"পহেলা বৈশাখ ও বাঙালির লোকউৎসব","x":"পহেলা বৈশাখ বাংলা নতুন বছরের প্রথম দিন এবং বাঙালির সবচেয়ে বড় সার্বজনীন উৎসব। বাংলাদেশে প্রতি বছর ১৪ এপ্রিল এই দিনটি পালিত হয়। বলা হয়, মুঘল সম্রাট আকবরের আমলে খাজনা আদায়ের সুবিধার জন্য বাংলা সন চালু হয়েছিল। পুরোনো দিনে ব্যবসায়ীরা এই দিনে হালখাতা খুলে পুরোনো হিসাব চুকিয়ে নতুন খাতা শুরু করতেন এবং ক্রেতাদের মিষ্টি খাইয়ে আপ্যায়ন করতেন। এই রীতি আজও অনেক জায়গায় টিকে আছে। বৈশাখের সকালে ঢাকার রমনা বটমূলে ছায়ানটের গানে নববর্ষকে স্বাগত জানানো হয়। ঢাকা বিশ্ববিদ্যালয়ের চারুকলা অনুষদ থেকে বের হওয়া মঙ্গল শোভাযাত্রায় বিশাল মুখোশ ও রঙিন প্রতীকের মাধ্যমে অশুভ শক্তির বিরুদ্ধে প্রতিবাদ জানানো হয়। ২০১৬ সালে ইউনেসকো এই শোভাযাত্রাকে মানবজাতির অমূর্ত সাংস্কৃতিক ঐতিহ্যের স্বীকৃতি দিয়েছে। দেশের নানা জায়গায় বৈশাখী মেলা বসে, যেখানে মাটির খেলনা, বাঁশি, নাগরদোলা, যাত্রা ও লোকসংগীতের আসর জমে ওঠে। মানুষ নতুন পোশাক পরে পান্তা ইলিশ, ভর্তা ও নানা দেশীয় খাবার উপভোগ করে। এই উৎসবে ধর্ম, বর্ণ ও শ্রেণির ভেদাভেদ ভুলে সবাই একসঙ্গে মিলিত হয়। গ্রামের বৈশাখী মেলায় কুটিরশিল্পীরা তাঁদের হস্তশিল্পের পসরা সাজিয়ে বসেন, ফলে এই উৎসব তাঁদের জন্য আয়েরও একটি বড় সুযোগ হয়ে আসে। অনেক এলাকায় বৈশাখ উপলক্ষে নৌকাবাইচ, কুস্তি ও লাঠিখেলার মতো ঐতিহ্যবাহী খেলাও অনুষ্ঠিত হয়। শহর থেকে গ্রাম সবখানেই এই দিনে আনন্দের জোয়ার বয়ে যায়। তাই পহেলা বৈশাখ শুধু একটি দিন নয়, এটি আমাদের ঐক্য, সংস্কৃতি ও জাতীয় পরিচয়ের প্রতীক।"},{"n":"নোবেল পুরস্কার ও বাংলার গৌরব","x":"নোবেল পুরস্কার বিশ্বের সবচেয়ে মর্যাদাপূর্ণ আন্তর্জাতিক সম্মানগুলোর একটি। সুইডিশ বিজ্ঞানী ও ডিনামাইটের আবিষ্কারক আলফ্রেড নোবেলের উইল অনুযায়ী ১৯০১ সাল থেকে এই পুরস্কার দেওয়া শুরু হয়। প্রথমে পদার্থবিজ্ঞান, রসায়ন, চিকিৎসাবিজ্ঞান, সাহিত্য ও শান্তি এই পাঁচটি ক্ষেত্রে পুরস্কার দেওয়া হতো, পরে অর্থনীতি যুক্ত হয়। প্রতি বছর ১০ ডিসেম্বর, নোবেলের মৃত্যুবার্ষিকীতে, পুরস্কার প্রদান অনুষ্ঠান হয়। শান্তি পুরস্কার নরওয়ের অসলোতে এবং অন্যান্য পুরস্কার সুইডেনের স্টকহোমে দেওয়া হয়। বাংলা ও বাঙালির জন্য এই পুরস্কার বিশেষ গৌরবের। ১৯১৩ সালে কবি রবীন্দ্রনাথ ঠাকুর গীতাঞ্জলি কাব্যের জন্য সাহিত্যে নোবেল পুরস্কার পান এবং তিনিই এশিয়ার প্রথম নোবেল বিজয়ী। ১৯৯৮ সালে অমর্ত্য সেন কল্যাণ অর্থনীতিতে অবদানের জন্য অর্থনীতিতে এই সম্মান লাভ করেন। ২০০৬ সালে ড. মুহাম্মদ ইউনূস এবং তাঁর প্রতিষ্ঠিত গ্রামীণ ব্যাংক ক্ষুদ্রঋণের মাধ্যমে দারিদ্র্য দূরীকরণের প্রচেষ্টার জন্য যৌথভাবে নোবেল শান্তি পুরস্কার লাভ করেন। এসব অর্জন প্রমাণ করে যে মেধা, অধ্যবসায় ও মানবকল্যাণের চিন্তা থাকলে যেকোনো দেশের মানুষই বিশ্বমঞ্চে সম্মান অর্জন করতে পারে। নোবেল বিজয়ীরা দীর্ঘ বছর অধ্যবসায় ও নিষ্ঠার সঙ্গে কাজ করেই এই সাফল্য অর্জন করেছেন, কেউ রাতারাতি এই সম্মান পাননি। তাঁদের গবেষণা ও চিন্তা বিশ্বের কোটি কোটি মানুষের জীবনকে প্রভাবিত করেছে। নতুন প্রজন্মের শিক্ষার্থীরা এই মনীষীদের জীবন থেকে অনুপ্রেরণা নিয়ে নিজেদের স্বপ্ন পূরণে এগিয়ে যেতে পারে।"},{"n":"মৌমাছি ও পরাগায়ন","x":"মৌমাছি আকারে ছোট হলেও প্রকৃতি ও মানুষের জীবনে এর অবদান অনেক বড়। এরা ফুলে ফুলে ঘুরে মধু ও পরাগ সংগ্রহ করে। এই সময় এক ফুলের পরাগ অন্য ফুলে গিয়ে লাগে, আর এই প্রক্রিয়াকে পরাগায়ন বলা হয়। পরাগায়ন ছাড়া অনেক ফুল ফল বা বীজে পরিণত হতে পারে না। সরিষা, আম, লিচু, কুমড়া ও নানা সবজির ফলন বহুলাংশে মৌমাছির মতো পতঙ্গের ওপর নির্ভর করে। তাই মৌমাছিকে কৃষকের নীরব বন্ধু বলা হয়। একটি মৌচাকে সাধারণত একটি রানি মৌমাছি, অসংখ্য কর্মী মৌমাছি এবং কিছু পুরুষ মৌমাছি থাকে। রানি ডিম পাড়ে, কর্মীরা খাদ্য সংগ্রহ করে, চাক তৈরি করে ও চাক পাহারা দেয়। বাংলাদেশে সুন্দরবনের মৌয়ালরা প্রতি বছর বুনো মধু সংগ্রহ করেন, আর সরিষা ফুলের মৌসুমে অনেক খামারি মৌ বাক্স বসিয়ে মধু উৎপাদন করেন। মধু ও মোম বিক্রি করে মৌচাষ গ্রামের মানুষের বাড়তি আয়ের একটি সুযোগ তৈরি করেছে। কিন্তু বর্তমানে ক্ষতিকর কীটনাশকের অতিরিক্ত ব্যবহার, বনজঙ্গল ধ্বংস ও জলবায়ুর পরিবর্তনে মৌমাছির সংখ্যা কমছে। এটি খাদ্য উৎপাদনের জন্য বড় হুমকি। ২০ মে বিশ্ব মৌমাছি দিবস পালনের উদ্দেশ্য এই বিষয়ে মানুষকে সচেতন করা। মৌমাছির কামড় ব্যথা দিলেও এর তৈরি মধু একটি পুষ্টিকর খাবার এবং ঐতিহ্যবাহী ওষুধের উপাদান হিসেবেও ব্যবহৃত হয়। মোম দিয়ে মোমবাতি ও প্রসাধনীও তৈরি করা যায়। এভাবে মৌমাছি একসঙ্গে প্রকৃতি ও অর্থনীতিকে সহায়তা করে। কৃষকদের উচিত ফসলে ফুল ফোটার সময় কীটনাশক ছিটানো থেকে বিরত থাকা। আমরা কীটনাশক কম ব্যবহার করে এবং বাগানে ফুলের গাছ লাগিয়ে মৌমাছিকে বাঁচাতে সাহায্য করতে পারি।"}],"en":[{"n":"Blood Donation and Saving Lives","x":"Blood donation is one of the simplest and most noble ways of serving humanity. Blood cannot be made in a factory, so patients who suffer from accidents, major operations, childbirth complications, cancer or thalassaemia depend entirely on the generosity of other people. Human blood is divided into four main groups, A, B, AB and O, a classification discovered by the scientist Karl Landsteiner. The fourteenth of June, his birthday, is celebrated every year as World Blood Donor Day. In general, a healthy adult between the ages of eighteen and sixty, who weighs at least fifty kilograms, can give blood. Before the donation, the donor is checked by a trained person, and the collected blood is tested for infections such as hepatitis, HIV and malaria so that the patient receiving it remains safe. The body replaces the donated blood within a few weeks, and a donor can usually give again after three or four months. Many people wrongly believe that giving blood makes a person weak, but science does not support this fear. In Bangladesh, voluntary organisations such as Sandhani, which grew from the efforts of medical college students, arrange regular donation camps and help families find donors in an emergency. A single bag of blood can save more than one life, since it may be separated into red cells, platelets and plasma for different patients. Those who donate regularly give a family hope in its darkest hour. Therefore, every healthy person should come forward and donate blood willingly, and encourage friends and relatives to do the same."},{"n":"Dengue and Prevention of Mosquito Diseases","x":"Dengue is a viral disease spread by the bite of the Aedes mosquito. Unlike many other mosquitoes, this one usually bites during the daytime, especially in the early morning and late afternoon. It lays its eggs in clean, standing water, so flower pots, old tyres, coconut shells, buckets and water collected on rooftops are its favourite breeding places. A person infected with dengue may suffer from a sudden high fever, a severe headache, pain behind the eyes, aching muscles and joints and a red rash on the skin. There is no specific medicine for the disease, but with plenty of rest, a large amount of fluids and painkillers taken on the advice of a doctor, most patients recover completely. However, if the fever is accompanied by severe stomach pain, repeated vomiting, bleeding from the nose or gums, or extreme weakness, the patient must be taken to a hospital without delay, because the number of platelets in the blood may fall dangerously low. In Bangladesh the disease spreads fastest during the rainy season, and crowded urban areas face the greatest danger. The most effective way to prevent dengue is to stop water from collecting around the home and to empty buckets, pots and trays at least once a week. Sleeping under a mosquito net, fixing nets on windows and wearing clothes with long sleeves also give good protection. City corporations clean drains and spray medicine, but these efforts will not succeed without the cooperation of ordinary people. If every family keeps its surroundings clean, the disease can be kept under control."},{"n":"Migrant Workers and Remittances","x":"Migrant workers make a very large contribution to the economy of Bangladesh. Millions of Bangladeshis have travelled abroad in search of work and now live in countries such as Saudi Arabia, the United Arab Emirates, Oman, Kuwait, Qatar and Malaysia. They work in construction, factories, shops and households, and the money they send back to their families is called remittance. After the export of garments, remittance is the second largest source of foreign currency for the country. This money does not merely meet the daily expenses of a family. A large part of it is spent on buying land, building houses, paying for the education of children and starting small businesses, which keeps the rural economy active. Remittance also helps the country to maintain its foreign exchange reserves and to pay for imports. Yet life abroad is never easy. Many workers fall victim to dishonest agents, pay very high migration costs, and then face low wages and difficult working conditions. For this reason, anyone who wishes to work abroad should follow lawful channels, check every offer carefully and receive training approved by the government. A skilled worker earns more and is treated with greater respect in a foreign country. When sending money home, workers should use banks and authorised mobile financial services instead of illegal channels, so that the country may benefit fully from their hard work. Migrant workers are a source of pride for the nation, and it is the duty of all of us to protect their rights, safety and dignity."},{"n":"Freelancing and Outsourcing","x":"Freelancing is a type of work in which a person does not serve as a permanent employee of any organisation but uses his or her own skills to complete tasks for different clients and is paid for each job. When a company in one country hands over a part of its work to skilled people in another country, this is known as outsourcing. Thanks to the internet and online marketplaces, it is now possible to work for a client in any corner of the world while sitting at home. Young people in Bangladesh have earned a good name in graphic design, website development, digital marketing, translation, content writing and data entry, and the country now has one of the largest communities of freelancers in the world. To succeed in this profession, a person must first become really skilled in one particular field. After that, he or she should prepare a portfolio of past work and keep communication with the client clear, polite and regular. A good command of English is a great advantage, because most clients speak that language. Delivering the work on time, remaining honest and keeping the information of the client secret are the foundations of a freelancer's reputation. Unfortunately, many cheats are active online, so it is wise to stay away from any offer that demands money in advance. Freelancing also requires discipline, since there is no manager to watch over the worker. With proper preparation and patience, this profession can reduce unemployment among the youth and bring valuable foreign currency to the country."},{"n":"Drone Technology and Its Uses","x":"A drone is a flying machine that can be controlled from a distance without a human being on board. It usually has small motors, propellers, a battery, a camera and several sensors. In the beginning drones were used mainly by the military, but today ordinary people also use them in many fields. In agriculture, a drone can watch over the condition of crops and spray fertiliser or pesticide over a field in far less time than a worker could. After a flood, a cyclone or an earthquake, drones fly over remote areas and take pictures of the damage, which helps rescue teams to plan their work. They are also used to take photographs at weddings and public events, to inspect the progress of construction, to prepare maps of land and to carry medicine to places that are hard to reach. In several countries, experiments are being carried out to deliver goods by drone. Yet this technology must be handled with care. It is dangerous, and in many places forbidden, to fly a drone near an airport, a military site or a crowded area. Taking pictures of the private life of other people may also be a crime. Therefore, anyone who wishes to fly a drone should take the necessary permission and obey all the rules. However, the battery of a drone lasts only a short time, so it cannot travel very far, and flying in bad weather is difficult. If drones are used in a responsible manner, they can bring great improvement to agriculture, disaster management and many public services, and they can open new opportunities of employment for trained young people."},{"n":"Cloud Computing and Data Storage","x":"Cloud computing means storing information on distant servers through the internet and using software and other services from there instead of keeping everything on a personal computer. In the past, a company had to buy its own computers and servers and spend a great deal of money to maintain them. Now the same power can be rented through the internet according to need, and the user pays only for what is actually used. The greatest advantage of this system is that people can open their own files from any place and on any device. Saving photographs and documents, sending emails, using online banking and watching videos on social media all depend on the cloud in one way or another. Huge data centres hold thousands of computers that work together and keep several copies of the same information, so the data is not lost even if one machine breaks down. A small business can increase its capacity easily when it grows and reduce it when it shrinks, which is very useful for new entrepreneurs. However, the cloud is not free from risk. Without an internet connection it becomes difficult to reach the data, and a weak password may lead to theft of information. For this reason, users should choose strong passwords, turn on two step verification and keep separate copies of important documents. Many students and workers now keep their important files in the cloud and open them from a phone or a laptop. As the government of Bangladesh moves its services online, secure data centres and cloud technology are becoming more important with every passing year."},{"n":"Inflation and the Price of Essentials","x":"Inflation means a general and continuous rise in the prices of goods and services in a country. When prices rise, the same amount of money buys fewer things than before, which means that the purchasing power of money has fallen. Ordinary people usually feel the pressure of inflation through changes in the prices of daily necessities such as rice, lentils, edible oil, sugar, vegetables and meat. Several causes work behind it. When the supply of a product is less than the demand for it, the price goes up. If the price of imported goods or fuel increases, the cost of production and transport also increases, and a fall in the value of the local currency makes imported products still more expensive. Sometimes dishonest traders create an artificial shortage and sell goods at unfair prices. Inflation hurts people with fixed incomes and poor families the most, because their earnings do not rise as fast as prices. The Bangladesh Bureau of Statistics publishes the rate of inflation regularly on the basis of the consumer price index. To keep prices under control, the central bank adjusts interest rates and the supply of money, while the government monitors markets and sells essential goods at fair prices through the Trading Corporation of Bangladesh. Increasing local production, improving the supply chain, stopping wastage and punishing hoarders are also necessary. Consumers can also help by avoiding unnecessary buying and stopping the waste of food. A lasting solution to this problem is possible only when production, supply and honest trade grow together."},{"n":"Weather Forecasting and Meteorology","x":"Weather is the condition of temperature, rainfall, wind and humidity at a certain place and time. Scientists who study these elements are called meteorologists, and the advance information they give about the coming days is known as a weather forecast. To prepare it, data is collected constantly from weather stations, satellites, radars, balloons and instruments floating on the sea. Then powerful computers run mathematical models to calculate what may happen next. In Bangladesh this responsibility is carried out by the Bangladesh Meteorological Department. Since our country is prone to cyclones, nor'westers, floods and heavy rain, an accurate forecast is extremely important here. When a storm builds up over the sea, warning signals are issued, so that fishermen can return to safe harbours in time and people living along the coast can move to cyclone shelters. Farmers also look at the forecast to decide when to sow seeds, irrigate the fields or harvest the crops. Aeroplanes and ships cannot operate safely without weather information. It is important to remember that weather and climate are not the same thing, because weather describes the condition over a short time, while climate describes the average condition over many years. Although better technology has made forecasts more reliable than before, nature is sometimes unpredictable, and a forecast may occasionally turn out to be wrong. Therefore, everyone should listen to weather reports and stay alert whenever a warning is given."},{"n":"The Post Office and the Tradition of Letters","x":"There was a time when a letter was the main hope of anyone waiting for news from a distant place, and the post office was the institution that carried it. In villages, a postman in a khaki uniform used to deliver letters with a bag on his shoulder, travelling by bicycle or on foot, and many families waited eagerly for his arrival. The red letter box was a familiar sight in towns and villages alike. The famous play The Post Office, written by Rabindranath Tagore, beautifully captures the feeling of waiting that people once experienced. Besides letters, the post office has long offered services such as money orders, parcels, registered mail and the sale of savings certificates. Collecting postage stamps is a lovely hobby for many people, because stamps carry pictures of national history, famous persons and heritage. World Post Day is observed every year on the ninth of October. After the arrival of mobile phones, email and social media, the habit of writing letters has declined greatly, but the post office has not disappeared. With the changing times, the postal department now delivers goods bought online and provides digital financial services too. Even so, the warmth and emotion of a handwritten letter cannot be found in any other medium. Students should sometimes write a letter to a loved one and in this way help to keep this beautiful tradition alive. Greeting cards for festivals and the new year were once sent in large numbers by post. A few lines written by hand can give a distant relative more happiness than a hundred quick messages."},{"n":"Family and Social Bonds","x":"The family is the smallest and the most important unit of society. The first school that a human being attends after birth is his or her own family. Here a child learns love, sympathy, discipline, respect for elders and affection for the young. In our country, joint families were once common, where grandparents, parents, uncles, aunts and cousins lived together under one roof. Today, many people move to cities for work or study and live in small families. Although the form has changed, the value of the family has not. In times of danger, illness or financial trouble, family members are always the first to stand beside us. The social bonds formed with neighbours, relatives and friends protect people from loneliness and give them mental strength. Unfortunately, excessive use of mobile phones and the internet has made it difficult for many members of a household to find time to speak to one another, even when they live in the same house. This can create distance and misunderstanding in relationships. Eating together, sharing stories and going out on holidays as a family help to strengthen the bond. It is equally important to respect the opinions of every member and to settle small disagreements with patience. A happy and well disciplined family gives birth to a beautiful society and an ideal nation. Stories and advice from grandparents play a great role in building the character of children, who learn honesty from the example of their parents. Therefore, each of us should spend quality time with our loved ones every day and show them care and gratitude."},{"n":"Intellectual Property and Copyright","x":"Intellectual property is the legal ownership that a person has over something created by his or her mind and creativity. It includes copyright, patents, trademarks and the rights over designs. The right that a creator holds over stories, poems, songs, pictures, films and computer software is called copyright. This right comes into being at the moment of creation, without any registration. A patent, on the other hand, is the right granted over a new invention, and it gives the inventor the sole use of that invention for a fixed period. In Bangladesh, the Copyright Act of 2000 and its later amendment protect the rights of creators. Under this law, it is a punishable offence to copy the writing or song of another person without permission, to sell illegal copies, or to use pirated software. World Intellectual Property Day is observed on the twenty sixth of April each year. Without the protection of these rights, writers, artists and researchers would lose their interest in creating anything new, because others would take the fruits of their labour for nothing. Students should understand that copying the work of someone else and presenting it as their own is a kind of theft. When information is taken from another person's work, the source must always be mentioned. In the digital age, pictures, books and songs can be copied easily, so violations have increased, and permission should always be checked first. By respecting the rights of creative people, we can build an environment in which original thinking and invention are encouraged and rewarded in our country."},{"n":"Painting and Fine Arts","x":"Painting is the art of expressing feelings and ideas through colour, line and form. The history of painting in Bengal is very old. The scroll paintings of the villages, the designs of embroidered quilts, the decorated clay plates and the colourful pictures on rickshaws show the rich heritage of our folk art. In modern painting, the contribution of Shilpacharya Zainul Abedin is unforgettable. The ink sketches that he drew during the famine of 1943 remain a painful witness of that disaster even today. It was through his efforts that an art institute was established in Dhaka in 1948, which is now known as the Faculty of Fine Arts of the University of Dhaka. S M Sultan became famous for painting the village farmers as strong and muscular figures, and the posters drawn by Quamrul Hassan gave courage to the people during the Liberation War. Painting is not only a form of entertainment but also a mirror of society. Through pictures, an artist conveys sorrow, joy, protest and dreams to the viewer. Practising drawing from an early age sharpens a child's imagination, concentration and creativity. The Bangladesh Shilpakala Academy and other institutions arrange art exhibitions and competitions regularly. Many private galleries have also opened in Dhaka and other cities, where young artists can show their work to the public. Some of our painters have won praise in foreign exhibitions as well. If we encourage young artists and visit galleries more often, the art of our country will become richer and will win greater recognition in the world."},{"n":"Pohela Boishakh and Folk Festivals","x":"Pohela Boishakh is the first day of the Bengali new year and the biggest festival that is shared by all Bengalis. In Bangladesh, it is celebrated on the fourteenth of April every year. It is said that the Bengali calendar was introduced during the reign of the Mughal emperor Akbar to make the collection of land tax easier. In earlier times, traders used to open a new account book on this day, settle old debts and treat their customers to sweets, and this custom still survives in many places. On the morning of the festival, the new year is welcomed with songs by the cultural organisation Chhayanaut under the banyan tree at Ramna in Dhaka. The Mangal Shobhajatra, a colourful procession that starts from the Faculty of Fine Arts of the University of Dhaka, carries huge masks and symbols that protest against evil forces. In 2016, UNESCO recognised this procession as an intangible cultural heritage of humanity. All over the country, Boishakhi fairs are held, where clay toys, flutes, giant wheels, folk plays and folk songs fill the air with joy. People wear new clothes and enjoy traditional food, including panta bhat with fried hilsa and various kinds of mashed vegetables. On this day, the differences of religion, caste and class are forgotten and everyone joins in the celebration. In many areas, traditional sports such as boat races and wrestling are also held to mark the occasion, and craftsmen earn extra income by selling their handmade goods at the fairs. Therefore, Pohela Boishakh is not merely a day on the calendar, but a symbol of our unity, culture and national identity."},{"n":"The Nobel Prize and Bengal's Pride","x":"The Nobel Prize is one of the most respected international honours in the world. It was created according to the will of Alfred Nobel, a Swedish scientist and the inventor of dynamite, and the first prizes were given in 1901. At first, awards were given in five fields, which were physics, chemistry, medicine, literature and peace, and economics was added later. The prizes are presented every year on the tenth of December, the anniversary of Nobel's death. The Peace Prize is awarded in Oslo, the capital of Norway, and the other prizes are awarded in Stockholm, the capital of Sweden. For Bengal and Bengalis, this prize carries a special pride. In 1913, the poet Rabindranath Tagore received the Nobel Prize in Literature for his book of poems Gitanjali, and he became the first person from Asia to win the prize. In 1998, Amartya Sen was honoured with the prize in economics for his work on welfare economics. In 2006, Dr Muhammad Yunus and the Grameen Bank, which he founded, jointly received the Nobel Peace Prize for their efforts to reduce poverty through microcredit. These achievements show that people from any country can win respect on the world stage if they have talent, perseverance and a deep concern for the welfare of mankind. The winners of this prize reached their goals through long years of hard work and sincere dedication, and no one received such an honour overnight. Their research and ideas have influenced the lives of millions of people around the world. Young students should draw inspiration from the lives of these great persons and move forward with confidence to fulfil their own dreams."},{"n":"Bees and Pollination","x":"Although the bee is a tiny creature, its contribution to nature and to human life is enormous. Bees travel from flower to flower to collect nectar and pollen. During this visit, the pollen of one flower sticks to another, and this process is called pollination. Without it, many flowers cannot turn into fruits or seeds. The yield of mustard, mango, litchi, pumpkin and many vegetables depends to a large extent on insects like bees, which is why the bee is called a silent friend of the farmer. A beehive usually contains one queen bee, a large number of worker bees and a few male bees. The queen lays the eggs, while the workers gather food, build the honeycomb and guard the hive. In Bangladesh, the honey collectors of the Sundarbans bring wild honey every year, and during the mustard season many farmers place boxes of bees in the fields to produce honey. Selling honey and wax has made beekeeping a useful source of extra income for rural people. Sadly, the number of bees is falling because of the heavy use of harmful pesticides, the destruction of forests and changes in climate. This is a serious threat to the production of food. World Bee Day, which is observed on the twentieth of May, aims to make people aware of this problem. Honey is not only a nutritious food but is also used in traditional medicine, and beeswax is used to make candles and cosmetics. In this way bees support both nature and the economy. Farmers should avoid spraying chemicals when the crops are in flower. We can help to save the bees by using fewer pesticides and by planting flowering trees and shrubs in our gardens and yards."}]};

const T12E=[{"n":"Libraries and the Habit of Reading","x":"Books are the most faithful friends of human beings. A good book tells a person something new, widens the world of thought and creates a fresh way of looking at life. But nowadays, because of mobile phones and social media, many people are drifting away from the habit of reading. Yet regular reading enriches vocabulary, improves concentration and develops imagination. A library plays an important part in this matter. A library holds thousands of books on different subjects, and they are open to everyone. Even those who cannot afford to buy books get the chance to gain knowledge through a library. In villages and cities of Bangladesh, many small libraries have grown up through voluntary efforts, and they are turning young people towards books. The habit of reading should be built in children from an early age. For this, parents should put storybooks into the hands of their children and set an example by reading themselves. Schools can also hold reading circles and book fairs regularly. If a person keeps aside at least half an hour every day for reading, it becomes a habit within a short time. The nation that reads more becomes wiser and more enlightened. Today, books can be read easily through e books and online libraries, but the joy and feeling of a printed book cannot be found in anything else. Reading increases patience, keeps the mind calm and reduces stress. Exchanging books with friends on holidays makes the interest in reading grow even more. Therefore, everyone should build a small collection of his or her own."},{"n":"Forest and Wildlife Conservation","x":"The forest is a priceless treasure of nature. The trees of a forest absorb carbon dioxide from the air and release oxygen, so the environment stays fresh. Forests help to bring rainfall, prevent soil erosion and keep the flow of river water steady. The Sundarbans, located in the south western region of Bangladesh, is the largest mangrove forest in the world. It is the home of the Royal Bengal Tiger, spotted deer, crocodiles and many kinds of birds. During cyclones and tidal surges, this forest protects the people of the coast like a natural shield. But because of illegal tree cutting, hunting and settlement, the forest land of the country is shrinking day by day. As a result, many wild animals are moving towards extinction. When wildlife disappears, the food chain of nature breaks down, and the bad effect finally falls on human beings themselves. For this reason, the government has declared sanctuaries and national parks and has made laws banning hunting. However, laws alone cannot do this work. It is necessary to make ordinary people aware and to create alternative jobs for those who depend on the forest. Everyone should plant trees regularly and take care of the forest. From the forest we get timber, honey, wax and medicinal plants, which are the source of livelihood for thousands of people. When forests are destroyed, the risk of floods and droughts also increases. So, if we wish to leave a beautiful and safe world for the next generation, we must save our forests today. Love for nature is the greatest means of doing so."},{"n":"Road Safety","x":"We hear news of road accidents in Bangladesh almost every day. Thousands of people lose their lives in these accidents every year, and many others become disabled for the rest of their lives. Many families become helpless after losing their only earning member. Among the main causes of road accidents are reckless driving, excessive speed, unskilled drivers, faulty vehicles and the tendency not to obey traffic laws. Often pedestrians also cross the road anywhere they like without using zebra crossings or overbridges, which invites great danger. To ensure safety on the road, it must first be made compulsory for drivers to have proper training and a valid licence. Motorcyclists should wear helmets, and passengers of cars should use seat belts. It is also necessary to repair broken roads, to install enough traffic signals and to test the fitness of vehicles regularly. Strict action should be taken against those who break traffic laws. But the most important thing is awareness. If all of us follow the rules and value the lives of others as we value our own, safe travel on the road is possible. It is never right to talk on a mobile phone while driving or crossing the road. Sometimes, to save a little time, we drive on the wrong side or overtake carelessly and bring danger upon ourselves. If students are taught about traffic laws in schools and colleges, it will be easier to build safe roads in the future. Only the conscious steps of everyone can free our roads from becoming death traps."},{"n":"Cottage Industries and Small Enterprises","x":"A cottage industry means the work of producing handmade goods at home with a small amount of capital and simple materials. The tradition of this industry in Bangladesh is very old. The Dhaka muslin once earned a reputation all over the world. Besides this, the sitalpati mat, embroidered quilts, articles of bamboo and cane, clay pots, handloom saris and wooden crafts are remarkable examples of our rural industries. Since this industry does not need huge machines, village women and unemployed young men can easily join it. As a result, it plays a big role in creating jobs and removing poverty. Nowadays small entrepreneurs are getting the chance to sell their products at home and abroad through the internet. However, a lack of capital, a lack of modern training and problems of marketing are still big obstacles for this sector. To solve these problems, it is necessary to provide loans on easy terms, training for skill development and help for improving the quality of products. If the government and private organisations work together, cottage industries can again become a strong foundation of our economy. We should help this industry to move forward by using products made by our own handicrafts. Many women entrepreneurs of our country have become self reliant by making handicrafts, sewing and food products at home, and they have brought financial comfort to their families. Because cottage industries use local raw materials, dependence on imports also decreases. The more investment and support this sector receives, the more dynamic the rural economy will become."},{"n":"The Six Seasons and the Nature of Bengal","x":"Bangladesh is a country of six seasons. Summer, the rainy season, autumn, late autumn, winter and spring come one after another and decorate our nature in many colours. In summer, the fierce heat dries up everything around, but it is also the time when sweet fruits such as mangoes, jackfruit and litchi ripen. In the rainy season, clouds gather across the sky, and the fields and paths are filled by the pouring rain. The rivers and canals become full to the brim. The autumn sky is blue and free of clouds, white kash flowers sway on the river banks and the air is filled with the smell of shiuli flowers. In late autumn, golden rice ripens and brings the joy of the harvest festival to the fields. In winter, a sheet of fog covers the villages in the morning, and date palm juice and various kinds of pitha add to the festive mood. At the end of winter, spring arrives and fills the trees with new leaves and flowers. The call of the cuckoo fills the heart with joy. Every season has its own beauty, and these seasons deeply influence our agriculture, food habits, clothing and culture. However, because of climate change, the natural cycle of the seasons is now becoming somewhat disturbed, which is truly a matter of concern. Our festivals also change with the seasons. The first day of Falgun in spring, boat races in the rainy season and the Nabanna festival in late autumn are the festivals of the heart for Bengalis. Poets of every age have written countless poems and songs about the variety of seasons in Bengal. It is the sacred duty of all of us to protect this lovely nature. The close bond between the seasons and the people and soil of Bengal has kept our lives rhythmic for ages."},{"n":"Honesty and Morality","x":"Honesty is one of the greatest qualities of a human being. An honest person always speaks the truth, does not violate the rights of others and performs his or her duties with sincerity. Everyone in society trusts and respects an honest person. Morality means the ability to understand the difference between good and bad and to walk on the right path. This quality grows from childhood through the teaching of the family and the school. Students should not cheat in examinations, should not tell lies and should respect their elders. Honesty is also immensely important in working life. If a government employee works honestly without taking bribes, ordinary people get services easily and their trust in the state increases. On the other hand, corruption is the biggest obstacle on the way to the development of a country. Because of corruption, resources are wasted, poor people are deprived and discontent spreads in society. To remove corruption, along with the strict enforcement of the law, moral values must be awakened in the mind of every person. We must remember that a happy, beautiful and developed nation is built with honest and principled people. If honesty is practised in small matters, it gradually becomes a part of character. Returning a lost thing that one has found, keeping a promise and having the courage to admit one's own mistake are signs of true honesty. An honest person never feels small before his conscience, so his mind always remains calm and free of burden. The path of honesty may seem difficult, but its result is always good and honourable, so from today we should take a pledge to walk on this path."},{"n":"Science and Modern Life","x":"Thanks to the contribution of science, human life has become much easier and more comfortable today. In the past, people had to cover long distances on foot or in bullock carts, but now they can reach faraway places in a short time by train, aeroplane and car. With the discovery of electricity, the darkness of night has been removed, and factories, homes and hospitals have been lit up. Because of progress in medical science, many difficult diseases can now be treated, and many deadly diseases are being prevented through vaccines. Mobile phones and the internet have turned the world into a small village, where anyone can contact anyone else within a moment. In agriculture, too, the use of improved seeds, fertiliser and machinery has increased the yield several times. But the misuse of science can also cause great harm to us. The making of atomic bombs and deadly weapons, environmental pollution and dependence on machines are creating threats to mankind. Therefore, science should always be used for the welfare of people. If we can increase scientific thinking and an interest in research among our young people, the country will move forward faster on the path of progress. New fields such as space research, artificial intelligence and robotics have opened doors of endless possibility before humanity. Now people can study, shop and get medical advice while sitting at home. It is the responsibility of all of us to guide this march of science in the right direction. By learning science, people learn to judge with reason and can be freed from the darkness of superstition. So it is necessary to bring science education to everyone."},{"n":"Safe Water and Sanitation","x":"Life cannot be imagined without water. But not all water is fit for drinking. Drinking polluted water spreads various diseases such as diarrhoea, cholera, typhoid and dysentery. Children in particular are affected most by these diseases. In Bangladesh, the work of supplying safe water through tube wells has advanced a long way, but the presence of arsenic in the underground water of some areas is still a big problem. In the coastal region, people suffer from a lack of pure water because of salinity. In these areas, steps are being taken to preserve rainwater and to purify the water of ponds. Along with water, the use of sanitation, or hygienic latrines, is equally important. If people defecate in the open, the sources of water become polluted and the germs of disease spread quickly. For this reason, every house should have a hygienic latrine, and people should build the habit of washing their hands with soap before eating and after using the toilet. Boiling water before drinking protects us from many diseases. If safe water and better sanitation can be ensured for everyone, it is possible to build a healthy and hardworking nation. When schools have separate and clean toilets, the attendance of girl students increases and the dropout rate falls. Preventing the waste of water is also our moral duty, because the level of underground water is slowly going down. So everyone must be careful and avoid using more water than necessary. When safe water and cleanliness are ensured, medical costs fall and the working capacity of people rises, which is beneficial for the economy of the whole country."},{"n":"Senior Citizens and Social Responsibility","x":"A person gives labour and talent for his family, society and country in youth, and in old age he has the right to receive something in return. Senior citizens are the storehouse of experience in our society. The lessons of their lives, their patience and their wisdom can make the journey of the new generation easier. But sadly, because of the breaking up of joint families and the busy lives of working people, many elderly persons are now becoming victims of loneliness and neglect. Some do not receive the necessary care and respect from their children and break down mentally. In old age, bearing the cost of healthcare also becomes difficult for many. In this situation, our responsibility towards the elderly is very great. Children should spend time with their parents, look after them and arrange their treatment. The state can also stand beside them through old age allowances, pensions and free healthcare. Besides, everyone in society should behave respectfully with the elderly. The society that honours its elders is truly considered civilised and humane. Many senior citizens tell stories to children in their free time, take part in social work and help the young with their advice. This contribution of theirs should be recognised. If day care centres and facilities for entertainment are arranged for the elderly, their lives will become more joyful. Those who are old today, we too will become like them one day. The smile on the face of the elderly is the true sign of the health of our society."},{"n":"Consumer Rights and Food Safety","x":"Every person is a consumer in some way, because we all buy goods and receive services every day. The right of a consumer means the right to get goods and services of good quality at a fair price. But in the market we often see irregularities such as giving less weight, selling expired products, charging extra prices and selling adulterated goods. Harmful chemicals used to ripen fruits and formalin mixed with fish and milk are a serious threat to public health. By eating such adulterated food, people can suffer from serious diseases such as kidney and liver problems and cancer. To protect the rights of consumers, the government has made the Consumer Rights Protection Act, and the Directorate of National Consumer Rights Protection conducts drives in the market and fines dishonest traders. But buyers also need to be aware. While buying goods, they should check the expiry date, quality and price on the package and should ask for a receipt. If any irregularity is seen, a complaint must be made. Ensuring safe food is not only the duty of the government but also the joint responsibility of traders and consumers. There is also a risk of fraud in online shopping, so it is safe to buy from trusted organisations and to pay after receiving and checking the goods. When consumers unite and protest against injustice, transparency returns to the market. Through the conscious role of everyone, a fair market free of adulteration can be built. We should always remember that getting the right product at a fair price is a basic right of every citizen."},{"n":"Digital Safety and Cyber Awareness","x":"The internet is now an inseparable part of our lives. Study, business, shopping, banking and communication, almost everything can now be done online. But along with this convenience, the risk of cyber crime has also increased. Many cheats set traps with fake websites, false messages and tempting offers and steal the personal information and money of people. Hackers enter the accounts of others illegally, steal information and sometimes harass people by leaking private pictures or data. We also often see rumours and false news being spread on social media, creating unrest in society. To protect ourselves from these dangers, we must first use strong passwords and never share them with anyone. We should avoid clicking on unknown links or downloading files from unknown sources. It is never safe to tell anyone the OTP or the PIN number of a bank account. It is also wrong to share any news without checking it. Although Bangladesh has a law on cyber security, the greatest defence is the awareness of the user. It is the duty of parents and teachers to teach children and teenagers how to stay safe online. If all of us remain alert, the digital world will become a safer and more trusted place. Updating software regularly, using reliable antivirus programs and keeping two step security turned on are effective ways of protecting accounts. If we face any problem, we should inform the concerned authority without delay. The more secure our information remains, the more fearlessly people will be able to enjoy the benefits of technology."},{"n":"Games, Sports and the Sporting World","x":"Sports are not merely a source of joy but also an effective way of keeping the body and mind healthy. If a person plays regularly, the body becomes strong, resistance to disease increases and the mind stays fresh. On the playground, children and young people learn to work as a team, to follow rules, to accept victory and defeat equally and to respect one another. Cricket and football are the most popular games in Bangladesh. The national cricket team has made the nation proud by achieving success after success in international tournaments. Women athletes have also won praise from everyone by showing wonderful skill in football, cricket and other games. Traditional games of rural Bengal such as hadudu, gollachut, boat racing and stick play are a part of our culture. But nowadays children are moving away from the field because of mobile and computer games. As a result, problems such as obesity and mental stress are increasing. To overcome this situation, every school must have a playground and enough equipment. If talented players are discovered and given training and financial help, our country will move towards greater achievements. Sports also play a big role in keeping young people away from drugs and crime. To become a successful player, hard work, discipline and patience are needed, and these qualities bring success in other areas of life as well. So, along with studies, keeping some time for sports every day is beneficial for everyone. There is no substitute for sports in building a healthy body and a beautiful mind."},{"n":"Patriotism and Civic Duty","x":"Patriotism means loving one's own country. It is a natural feeling of every person to have deep affection and respect for the soil on which he was born and the light and air in which he grew up. Our forefathers gave us this independent country at the cost of great sacrifice and blood. Therefore, it is the sacred duty of all of us to take the country forward and to protect its honour. Patriotism should not remain limited to words but must be shown through action. A student serves the country by studying with attention, a farmer by growing crops and a doctor by caring for patients. Paying taxes regularly, protecting public property, obeying the law and using the right to vote properly are important duties of a conscious citizen. Keeping the environment clean and showing sympathy to others are also parts of patriotism. Speaking out against corruption, injustice and violence is the moral duty of every citizen. If each of us performs our duty honestly from our own place, the country will surely reach the peak of progress, and our national flag will fly high in the assembly of the world. Observing national days with due dignity and remembering the martyrs awaken patriotism in the minds of the new generation. Knowing our own language, culture and history and feeling proud of them is also a part of it. The wish to do something for the country is what makes a person a true patriot. Fulfilling our duties to the country with honesty and care is the surest way to repay the debt that we owe to it. Love for the country should be the main inspiration behind all our good deeds."},{"n":"Rights and Inclusion of Persons with Disabilities","x":"Persons with disabilities are also respected members of our society. Even if they have physical, visual, hearing or intellectual limitations, extraordinary talent and potential lie hidden within them. But because of neglect, superstition and a lack of opportunity in society, many of them fall behind. Many families consider a disabled child a burden and keep the child shut inside the house, which is completely wrong and inhuman. Every person has an equal right to education, treatment, employment and free movement. The government of Bangladesh has made a law for the rights and protection of persons with disabilities and has arranged allowances, scholarships and special schools for them. But in reality many government buildings, vehicles and roads are still not friendly to wheelchairs, so they face many problems in moving about. With the help of technology, even visually impaired people can now use computers and mobile phones. It is necessary to ensure a fixed quota and a suitable environment for them in the workplace. Instead of showing pity, we should keep an attitude of equal respect and cooperation towards them. Moving forward with everyone is the mark of a truly developed society. Many disabled people of the world have become famous as writers, scientists, artists and athletes. If they get proper opportunity and encouragement, the disabled people of our country will also be able to prove their abilities in the same way. For this, changing the mindset of everyone in society is the most important thing. To protect their rights is the human duty of all of us."},{"n":"Savings and Thrift","x":"Saving means keeping aside a part of one's income for future needs. Thrift is the habit of spending wisely within a limited income. These two qualities give a person security in times of financial crisis. In troubles such as illness, accidents or a sudden loss of a job, saved money becomes the greatest support. The habit of saving should be built in children from an early age. For this, initiatives such as the clay piggy bank or school banking are very effective. Even if a little is saved every day, after some time it grows into a large amount. Nowadays money can be saved easily through banks, post offices, savings certificates and mobile banking. If people waste money on unnecessary luxury, excessive shopping and showy ceremonies, they gradually get trapped in debt. So before spending, it is important to understand the difference between need and want. Making a budget at the beginning of the month and following it keeps financial discipline. The savings of individuals also increase the total savings of the country, which provide capital for investment in industry and development. So saving is not only personal but also an important foundation of national development. Many rural families in our country save together through societies or cooperatives and help one another in times of need. This habit of social saving has made the rural economy stronger. In this way, thrift and saving together help a family to face the future with confidence and peace of mind. A person who is thrifty today can live a worry free life tomorrow."}];
