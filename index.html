const T6={"bn":[{"n": "পাঠাগার ও বই পড়ার অভ্যাস", "x": "বই মানুষের সবচেয়ে বিশ্বস্ত বন্ধু। একটি ভালো বই মানুষকে নতুন কিছু জানায়, চিন্তার জগৎ প্রসারিত করে এবং জীবনকে দেখার নতুন দৃষ্টিভঙ্গি তৈরি করে। কিন্তু বর্তমান সময়ে মোবাইল ও সামাজিক যোগাযোগমাধ্যমের কারণে অনেকেই বই পড়ার অভ্যাস থেকে দূরে সরে যাচ্ছে। অথচ নিয়মিত বই পড়লে শব্দভান্ডার সমৃদ্ধ হয়, মনোযোগ বাড়ে এবং কল্পনাশক্তির বিকাশ ঘটে। এ ক্ষেত্রে পাঠাগার একটি গুরুত্বপূর্ণ ভূমিকা পালন করে। একটি পাঠাগারে বিভিন্ন বিষয়ের হাজার হাজার বই থাকে, যা সবার জন্য উন্মুক্ত। যাদের বই কেনার সামর্থ্য নেই, তারাও পাঠাগারের মাধ্যমে জ্ঞান অর্জনের সুযোগ পায়। বাংলাদেশের গ্রামে ও শহরে অনেক স্বেচ্ছাসেবী উদ্যোগে ছোট ছোট পাঠাগার গড়ে উঠেছে, যা তরুণদের বইমুখী করছে। শিশুদের মধ্যে ছোটবেলা থেকেই পড়ার অভ্যাস গড়ে তোলা উচিত। এজন্য অভিভাবকদের উচিত সন্তানদের হাতে গল্পের বই তুলে দেওয়া এবং নিজেরাও বই পড়ে দৃষ্টান্ত স্থাপন করা। বিদ্যালয়েও নিয়মিত পাঠচক্র ও বইমেলার আয়োজন করা যেতে পারে। প্রতিদিন অন্তত আধা ঘণ্টা বই পড়ার জন্য সময় রাখলে কিছুদিনের মধ্যেই তা অভ্যাসে পরিণত হয়। যে জাতি যত বেশি বই পড়ে, সেই জাতি তত বেশি জ্ঞানী ও আলোকিত হয়ে ওঠে। বর্তমানে ই-বুক ও অনলাইন পাঠাগারের মাধ্যমেও খুব সহজে বই পড়া যায়, তবে ছাপা বইয়ের আনন্দ ও আবেগ অন্য কিছুতেই পাওয়া যায় না। বই পড়লে মানুষের ধৈর্য বাড়ে, মন শান্ত থাকে এবং চাপ কমে। ছুটির দিনে বন্ধুদের সাথে বই বিনিময় করলে পড়ার আগ্রহ আরও বেড়ে যায়। তাই প্রত্যেকের উচিত নিজের একটি ছোট সংগ্রহ গড়ে তোলা।"}, {"n": "বন ও বন্যপ্রাণী সংরক্ষণ", "x": "বন প্রকৃতির এক অমূল্য সম্পদ। বনের গাছপালা বাতাস থেকে কার্বন ডাই-অক্সাইড শোষণ করে অক্সিজেন ছাড়ে, ফলে পরিবেশ সতেজ থাকে। বন বৃষ্টিপাত ঘটাতে সাহায্য করে, মাটির ক্ষয় রোধ করে এবং নদীর পানির প্রবাহ ঠিক রাখে। বাংলাদেশের দক্ষিণ-পশ্চিম অঞ্চলে অবস্থিত সুন্দরবন পৃথিবীর সবচেয়ে বড় ম্যানগ্রোভ বন। এখানে রয়্যাল বেঙ্গল টাইগার, চিত্রা হরিণ, কুমির ও নানা প্রজাতির পাখির বাস। এই বন ঘূর্ণিঝড় ও জলোচ্ছ্বাসের সময় উপকূলের মানুষকে প্রাকৃতিক ঢাল হিসেবে রক্ষা করে। কিন্তু অবৈধভাবে গাছ কাটা, শিকার ও বসতি স্থাপনের কারণে দেশের বনভূমি দিন দিন কমে যাচ্ছে। এর ফলে অনেক বন্যপ্রাণী বিলুপ্তির পথে এগিয়ে চলেছে। বন্যপ্রাণী হারিয়ে গেলে প্রকৃতির খাদ্যশৃঙ্খল ভেঙে পড়ে এবং এর খারাপ প্রভাব শেষ পর্যন্ত মানুষের ওপরই পড়ে। তাই বন ও বন্যপ্রাণী রক্ষায় সরকার অভয়ারণ্য ও জাতীয় উদ্যান ঘোষণা করেছে এবং শিকার নিষিদ্ধ করার আইন প্রণয়ন করেছে। তবে শুধু আইন দিয়ে এ কাজ সম্ভব নয়। এজন্য সাধারণ মানুষকে সচেতন করা এবং বনের ওপর নির্ভরশীল মানুষের জন্য বিকল্প কর্মসংস্থান তৈরি করা প্রয়োজন। প্রত্যেকের উচিত নিয়মিত গাছ লাগানো এবং বনের প্রতি যত্নশীল হওয়া। বনের গাছ থেকে আমরা কাঠ, মধু, মোম ও ঔষধি উদ্ভিদ পাই, যা হাজার হাজার মানুষের জীবিকার উৎস। বন ধ্বংস হলে বন্যা ও খরার ঝুঁকিও বাড়ে। তাই আগামী প্রজন্মের জন্য একটি সুন্দর ও নিরাপদ পৃথিবী রেখে যেতে হলে আজই আমাদের বনকে বাঁচাতে হবে। প্রকৃতিকে ভালোবাসাই এর সবচেয়ে বড় উপায়।"}, {"n": "সড়ক নিরাপত্তা", "x": "বাংলাদেশে প্রতিদিনই সড়ক দুর্ঘটনার খবর আমরা শুনতে পাই। এসব দুর্ঘটনায় প্রতি বছর হাজার হাজার মানুষ প্রাণ হারায় এবং আরও অনেকে চিরদিনের জন্য পঙ্গু হয়ে যায়। অনেক পরিবার তাদের একমাত্র উপার্জনকারী সদস্যকে হারিয়ে অসহায় হয়ে পড়ে। সড়ক দুর্ঘটনার প্রধান কারণগুলোর মধ্যে রয়েছে বেপরোয়া গাড়ি চালানো, অতিরিক্ত গতি, অদক্ষ চালক, ত্রুটিপূর্ণ যানবাহন এবং ট্রাফিক আইন না মানার প্রবণতা। অনেক সময় পথচারীরাও জেব্রা ক্রসিং বা ওভারব্রিজ ব্যবহার না করে যেখানে সেখানে রাস্তা পার হন, যা বড় ধরনের বিপদ ডেকে আনে। সড়কে নিরাপত্তা নিশ্চিত করতে হলে প্রথমেই চালকদের যথাযথ প্রশিক্ষণ ও বৈধ লাইসেন্স থাকা বাধ্যতামূলক করতে হবে। মোটরসাইকেল চালকদের হেলমেট এবং গাড়ির যাত্রীদের সিটবেল্ট ব্যবহার করা উচিত। এছাড়া ভাঙা রাস্তা মেরামত করা, পর্যাপ্ত সংকেতবাতি স্থাপন এবং নিয়মিত যানবাহনের ফিটনেস পরীক্ষা করা জরুরি। ট্রাফিক আইন ভঙ্গকারীদের বিরুদ্ধে কঠোর ব্যবস্থা নেওয়া দরকার। তবে সবচেয়ে বড় বিষয় হলো সচেতনতা। আমরা সবাই যদি নিয়ম মেনে চলি এবং অন্যের জীবনকেও নিজের জীবনের মতো মূল্য দিই, তাহলে সড়কে নিরাপদ ভ্রমণ সম্ভব। মোবাইল ফোনে কথা বলতে বলতে গাড়ি চালানো বা রাস্তা পার হওয়া একেবারেই উচিত নয়। অনেক সময় অল্প সময় বাঁচানোর জন্য আমরা ভুল পথে গাড়ি চালিয়ে বা ওভারটেক করে বিপদ ডেকে আনি। স্কুল ও কলেজে শিক্ষার্থীদের ট্রাফিক আইন সম্পর্কে শিক্ষা দিলে ভবিষ্যতে নিরাপদ সড়ক গড়ে তোলা সহজ হবে। সবার সচেতন পদক্ য়া উচিত।"}, {"n": "বিজ্ঞান ও আধুনিক জীবন", "x": "বিজ্ঞানের অবদানে মানুষের জীবন আজ অনেক সহজ ও আরামদায়ক হয়েছে। আগের দিনে মানুষকে দূরের পথ পায়ে হেঁটে বা গরুর গাড়িতে পাড়ি দিতে হতো, আর এখন ট্রেন, বিমান ও গাড়ির সাহায্যে অল্প সময়েই বহু দূরে পৌঁছানো যায়। বিদ্যুৎ আবিষ্কারের ফলে রাতের অন্ধকার দূর হয়েছে এবং কলকারখানা, ঘরবাড়ি ও হাসপাতাল আলোকিত হয়েছে। চিকিৎসাবিজ্ঞানের উন্নতিতে অনেক কঠিন রোগের চিকিৎসা সম্ভব হয়েছে এবং টিকার মাধ্যমে বহু মারাত্মক রোগ প্রতিরোধ করা যাচ্ছে। মোবাইল ফোন ও ইন্টারনেট পৃথিবীকে একটি ছোট গ্রামে পরিণত করেছে, যেখানে মুহূর্তের মধ্যে যে কেউ যে কারও সাথে যোগাযোগ করতে পারে। কৃষিক্ষেত্রেও উন্নত বীজ, সার ও যন্ত্রপাতির ব্যবহারে ফলন কয়েক গুণ বেড়েছে। তবে বিজ্ঞানের অপব্যবহারও আমাদের জন্য বড় ক্ষতির কারণ হতে পারে। পারমাণবিক বোমা ও মারণাস্ত্র তৈরি, পরিবেশ দূষণ এবং যন্ত্রনির্ভরতা মানুষের জন্য হুমকি সৃষ্টি করছে। তাই বিজ্ঞানকে সবসময় মানুষের কল্যাণে ব্যবহার করা উচিত। আমাদের তরুণদের মধ্যে বিজ্ঞানমনস্কতা ও গবেষণার আগ্রহ বাড়াতে পারলে দেশ উন্নতির পথে আরও দ্রুত এগিয়ে যাবে। মহাকাশ গবেষণা, কৃত্রিম বুদ্ধিমত্তা ও রোবটিক্সের মতো নতুন নতুন ক্ষেত্র মানুষের সামনে অসীম সম্ভাবনার দরজা খুলে দিয়েছে। এখন ঘরে বসেই মানুষ পড়াশোনা, কেনাকাটা ও চিকিৎসা পরামর্শ নিতে পারে। বিজ্ঞানের এই অগ্রযাত্রাকে সঠিক পথে পরিচালিত করার দায়িত্ব আমাদের সবার। বিজ্ঞান শেখার মাধ্যমে মানুষ যুক্তি দিয়ে বিচার করতে শেখে এবং কুসংস্কারের অন্ধকার থেকে মুক্ত হতে পারে। তাই বিজ্ঞান শিক্ষাকে সবার কাছে পৌঁছে দেওয়া জরুরি।"}, {"n": "বিশুদ্ধ পানি ও স্যানিটেশন", "x": "পানি ছাড়া জীবন কল্পনা করা যায় না। কিন্তু সব পানি পানের উপযোগী নয়। দূষিত পানি পান করলে ডায়রিয়া, কলেরা, টাইফয়েড ও আমাশয়ের মতো নানা রোগ ছড়িয়ে পড়ে। বিশেষ করে শিশুরা এসব রোগে সবচেয়ে বেশি আক্রান্ত হয়। বাংলাদেশে নলকূপের মাধ্যমে নিরাপদ পানি সরবরাহের কাজ অনেক দূর এগিয়েছে, তবে কিছু এলাকায় ভূগর্ভস্থ পানিতে আর্সেনিকের উপস্থিতি এখনও একটি বড় সমস্যা। উপকূলীয় অঞ্চলে লবণাক্ততার কারণে মানুষ বিশুদ্ধ পানির অভাবে ভোগে। এসব এলাকায় বৃষ্টির পানি সংরক্ষণ ও পুকুরের পানি পরিশোধনের ব্যবস্থা নেওয়া হচ্ছে। পানির পাশাপাশি স্যানিটেশন বা স্বাস্থ্যসম্মত পায়খানার ব্যবহারও সমান গুরুত্বপূর্ণ। খোলা জায়গায় মলত্যাগ করলে পানির উৎস দূষিত হয় এবং রোগের জীবাণু দ্রুত ছড়ায়। তাই প্রতিটি বাড়িতে স্বাস্থ্যসম্মত ল্যাট্রিন থাকা এবং খাবারের আগে ও টয়লেট ব্যবহারের পর সাবান দিয়ে হাত ধোয়ার অভ্যাস করা জরুরি। পানি ফুটিয়ে পান করলে অনেক রোগ থেকে রক্ষা পাওয়া যায়। সবার জন্য নিরাপদ পানি ও উন্নত স্যানিটেশন নিশ্চিত করতে পারলে একটি সুস্থ ও কর্মঠ জাতি গড়ে তোলা সম্ভব। স্কুলে আলাদা ও পরিচ্ছন্ন শৌচাগার থাকলে মেয়ে শিক্ষার্থীদের উপস্থিতি বাড়ে এবং ঝরে পড়ার হার কমে। পানির অপচয় রোধ করাও আমাদের নৈতিক দায়িত্ব, কারণ ভূগর্ভস্থ পানির স্তর ধীরে ধীরে নিচে নেমে যাচ্ছে। তাই প্রয়োজনের অতিরিক্ত পানি খরচ না করে সবাইকে সংযমী হতে হবে। নিরাপদ পানি ও পরিচ্ছন্নতা নিশ্চিত হলে চিকিৎসা খরচ কমে এবং মানুষের কর্মক্ষমতা বাড়ে, যা পুরো দেশের অর্থনীতির জন্যই উপকারী।"}, {"n": "প্রবীণ নাগরিক ও সামাজিক দায়িত্ব", "x": "একজন মানুষ তার তরুণ বয়সে পরিবার, সমাজ ও দেশের জন্য যে শ্রম ও মেধা দেন, বার্ধক্যে এসে তার প্রতিদান পাওয়ার অধিকার তাঁর আছে। প্রবীণেরা আমাদের সমাজের অভিজ্ঞতার ভান্ডার। তাঁদের জীবনের শিক্ষা, ধৈর্য ও বিচক্ষণতা নতুন প্রজন্মের পথচলাকে সহজ করে দিতে পারে। কিন্তু দুঃখজনক বিষয় হলো, যৌথ পরিবার ভেঙে যাওয়া এবং কর্মব্যস্ততার কারণে এখন অনেক প্রবীণ মানুষ একাকিত্ব ও অবহেলার শিকার হচ্ছেন। কেউ কেউ সন্তানদের কাছ থেকে প্রয়োজনীয় যত্ন ও সম্মান পান না, ফলে মানসিকভাবে ভেঙে পড়েন। বার্ধক্যে স্বাস্থ্যসেবার খরচ বহন করাও অনেকের জন্য কঠিন হয়ে ওঠে। এই অবস্থায় প্রবীণদের প্রতি আমাদের দায়িত্ব অনেক বেশি। সন্তানদের উচিত বাবা-মায়ের সাথে সময় কাটানো, তাঁদের খোঁজখবর নেওয়া এবং চিকিৎসার ব্যবস্থা করা। রাষ্ট্রও বয়স্ক ভাতা, পেনশন ও বিনামূল্যে স্বাস্থ্যসেবার মাধ্যমে তাঁদের পাশে দাঁড়াতে পারে। এছাড়া সমাজের সবার উচিত প্রবীণদের সাথে সম্মানজনক আচরণ করা। যে সমাজ তার বয়োজ্যেষ্ঠদের সম্মান করে, সেই সমাজই প্রকৃত অর্থে সভ্য ও মানবিক বলে বিবেচিত হয়। অনেক প্রবীণ মানুষ অবসর সময়ে শিশুদের গল্প শোনান, সমাজসেবায় অংশ নেন এবং বিভিন্ন পরামর্শ দিয়ে তরুণদের সাহায্য করেন। তাঁদের এই অবদানকে স্বীকৃতি দেওয়া উচিত। প্রবীণদের জন্য দিবাযত্ন কেন্দ্র ও বিনোদনের ব্যবস্থা করলে তাঁদের জীবন আরও আনন্দময় হবে। আজ যাঁরা প্রবীণ, আ ি প্রাথমিক চিকিৎসার বাক্স রাখা উচিত, যাতে ব্যান্ডেজ, তুলা, জীবাণুনাশক ও কাঁচি থাকে। রেড ক্রিসেন্ট ও বিভিন্ন সংগঠন প্রাথমিক চিকিৎসার প্রশিক্ষণ দেয়, যেখানে সবাই অংশ নিতে পারেন। আহত ব্যক্তিকে ঘিরে ভিড় না করে তাকে খোলা বাতাস পেতে দেওয়াও দরকার। একজন প্রশিক্ষিত সাধারণ মানুষ কখনো কখনো অন্যের জীবন বাঁচাতে পারেন।"}, {"n": "মানসিক স্বাস্থ্য ও মানসিক সুস্থতা", "x": "শরীর সুস্থ থাকলেই মানুষ পুরোপুরি সুস্থ, এ কথা ঠিক নয়, কারণ মনের সুস্থতা সমান গুরুত্বপূর্ণ। মানসিক স্বাস্থ্য বলতে আমাদের চিন্তা, অনুভূতি ও আচরণের ভারসাম্যকে বোঝায়। যার মন সুস্থ, সে নিজের আবেগ সামলাতে পারে, চাপের মধ্যেও কাজ চালিয়ে যেতে পারে এবং অন্যের সাথে ভালো সম্পর্ক রাখতে পারে। পড়াশোনার চাপ, চাকরির দুশ্চিন্তা, পারিবারিক সমস্যা কিংবা প্রিয়জনকে হারানোর কষ্ট যে কারও মনকে ভারী করে তুলতে পারে। দীর্ঘদিন ধরে অকারণে মন খারাপ থাকা, ঘুম বা খাওয়ার অভ্যাস বদলে যাওয়া এবং কোনো কাজে আনন্দ না পাওয়া মানসিক সমস্যার লক্ষণ হতে পারে। আমাদের সমাজে অনেকে এসব বিষয়ে কথা বলতে লজ্জা পান বা একে দুর্বলতা মনে করেন, ফলে সময়মতো চিকিৎসা নেওয়া হয় না। অথচ শারীরিক রোগের মতোই মানসিক সমস্যারও চিকিৎসা আছে এবং বেশির ভাগ মানুষ সঠিক সহায়তায় ভালো হয়ে ওঠেন। মন ভালো রাখতে নিয়মিত ঘুম, হাঁটা বা ব্যায়াম, সুষম খাবার এবং পছন্দের কাজের জন্য সময় রাখা সহায়ক। বন্ধু বা পরিবারের কারও সাথে মনের কথা খুলে বলাও অনেক চাপ কমিয়ে দেয়। সমস্যা বেশি হলে মনোরোগ বিশেষজ্ঞ বা কাউন্সেলরের পরামর্শ নেওয়া উচিত। ঢাকায় জাতীয় মানসিক স্বাস্থ্য ইনস্টিটিউট এ বিষয়ে সেবা দিয়ে থাকে। প্রতিবছর ১০ই অক্টোবর বিশ্ব মানসিক স্বাস্থ্য দিবস পালিত হয়। কেউ কষ্টে থাকলে তাকে দোষ না দিয়ে মন দিয়ে শোনা এবং পাশে থাকাই সবচেয়ে বড় সাহায্য।"}, {"n": "বাংলার ঐতিহ্যবাহী খাবার ও পিঠা", "x": "খাবার শুধু পেট ভরানোর বিষয় নয়, এটি একটি জাতির সংস্কৃতি ও আতিথেয়তার পরিচয়ও বহন করে। বাঙালির প্রধান খাবার ভাত ও মাছ, আর তার সাথে ডাল, সবজি ও ভর্তা থাকলে দুপুরের খাবার একেবারে পরিপূর্ণ হয়। ইলিশ মাছ আমাদের জাতীয় মাছ হিসেবে খুব প্রিয়, আর সর্ষে ইলিশ, ইলিশ ভাজা ও ইলিশ পোলাওয়ের স্বাদ ভোলার নয়। পহেলা বৈশাখে পান্তা ভাত, ইলিশ ভাজা ও ভর্তা খাওয়ার রীতি বহু দিনের। উৎসব ও অতিথি আপ্যায়নে পোলাও, কোর্মা, কাচ্চি বিরিয়ানি ও পায়েসের চল আছে। বগুড়ার দই, নাটোরের কাঁচাগোল্লা ও শ্রীমঙ্গলের সাত রঙের চা দেশজুড়ে বিখ্যাত। শীতকালে গ্রামে গ্রামে নতুন চালের গুঁড়া ও খেজুরের গুড় দিয়ে নানা রকম পিঠা তৈরি হয়। ভাপা পিঠা, চিতই পিঠা, পুলি পিঠা, পাটিসাপটা ও নকশি পিঠা তাদের মধ্যে বিশেষ জনপ্রিয়। নবান্ন উৎসবে নতুন ধান ঘরে তোলার আনন্দে পরিবার ও প্রতিবেশীরা একসাথে পিঠা খেয়ে আনন্দ করে। আজকাল ব্যস্ত জীবনে অনেকে দ্রুত তৈরি ও বাইরের খাবারে ঝুঁকছেন, ফলে এই ঐতিহ্যবাহী খাবারগুলো ধীরে ধীরে হারিয়ে যাওয়ার ঝুঁকিতে পড়ছে। অথচ ঘরে তৈরি দেশি খাবার বেশি স্বাস্থ্যকর ও সাশ্রয়ী। বড়দের কাছ থেকে রেসিপি শিখে নেওয়া এবং ছোটদের তা শেখানো আমাদের দায়িত্ব। সুষম খাদ্যের সাথে ঐতিহ্যের স্বাদ মিলিয়ে চলাই বুদ্ধিমানের কাজ।"}]};

const T8E=[{"n": "Artificial Intelligence and the Future", "x": "Artificial intelligence means computer technology that can learn, understand and make decisions in a way that is similar to human beings. The idea began many decades ago, but in recent years huge amounts of data and powerful computers have made its progress incredibly fast. Today we see it in voice assistants on mobile phones, language translation, picture recognition and the suggestion of videos that we like. In medicine it helps doctors to find diseases by studying X-rays and test results. In agriculture it is used to forecast the weather and to spot crop diseases, and in banks it helps to detect fraud. Students can also use digital helpers to learn at their own speed. However, the technology brings some challenges as well. When machines take over many repeated tasks, the nature of some jobs may change, so learning new skills is more important than ever. We must also be careful about the protection of personal data, the spread of false information and the risk of unfair decisions made by machines. We should never accept what an artificial intelligence says without checking it, because machines can also make mistakes. No machine can replace human creativity, kindness and moral judgement. Our aim should be to use this technology as a helper for the good of people. For young people, the study of programming, data analysis and logical thinking can open the door to the future. With wise rules, good education and responsible use, Bangladesh can also enjoy the benefits of this technology."}, {"n": "Jute and the Golden Fibre", "x": "Jute is called the golden fibre because Bangladesh once earned a great amount of foreign currency by selling it. At the start of the rainy season the farmer sows the seeds in the field, and within four to five months the plants grow very tall. After the plants are cut, the bundles are kept under the water of a pond or a canal to soften them, which is known as retting. After a few days the fibre is peeled off by hand and dried in the sun. This fibre is used to make rope, sacks, carpets and many kinds of attractive goods. The dry sticks are used as fuel and for fences. Jute is a friendly crop for the environment, because it takes in a large amount of carbon dioxide from the air and mixes easily with the soil after use. For this reason jute bags are attracting interest all over the world as a substitute for plastic bags. Many jute mills in the country have been running at a loss for a long time, and competition from synthetic goods once reduced the demand for jute. Now scientists are working on improved seeds and modern machines for extracting the fibre, so that the cost to the farmer falls and the harvest grows. Handbags, shoes, home decorations and paper made from jute sell at good prices in foreign markets. If farmers get a fair price and new markets open for jute products, this golden fibre can again become a pride of our economy. If all of us use jute bags instead of plastic, the farmer, the environment and the country will all benefit."}, {"n": "Haor and Wetlands", "x": "The wide low lands in the north eastern part of Bangladesh are called haors. This region spreads across the districts of Sunamganj, Sylhet, Habiganj, Moulvibazar, Netrokona, Kishoreganj and Brahmanbaria. In the rainy season the water spreads in every direction, and from a distance it looks like an ocean. The villages stand like small islands, and people travel from one village to another by boat. When the water goes down at the beginning of winter, boro rice is grown on the same land, and it is the main crop of the people of this region. The waters of the haor hold a great many kinds of fish, and in winter thousands of migratory birds come from distant countries to rest here. The Tanguar Haor in Sunamganj is recognised as a wetland of international importance. Yet life in the haor is not easy. If an early flash flood from the hills comes just before the rice ripens, the farmer's whole crop can be lost, and families fall into great hardship. For much of the year communication is also difficult. Embankments, early warnings and timely harvesting help to reduce this loss. In many places the filling of wetlands and too much fishing are destroying the natural balance. So it is important to declare protected areas, to create fish sanctuaries and to make local people aware. The people of the haor love this nature in their songs and stories, and their way of life is a priceless part of our culture. If the haor survives, fish, rice, birds and people will all survive."}, {"n": "Waste Management and Recycling", "x": "Every day we produce a great deal of waste in our homes, shops, offices and factories. In Dhaka alone thousands of tons of rubbish are collected every day, and a large part of it is not properly gathered or treated. Garbage lying beside the road spreads a bad smell, breeds mosquitoes and flies and causes many diseases. When plastic and polythene block the drains, even a little rain can flood the city streets. The first rule of waste management is to separate it at the source, that is, to keep rotting and non rotting rubbish in different bins. Vegetable peels and leftover food from the kitchen can easily be turned into natural compost, which is very useful for gardens and crops. Paper, glass, metal and plastic can be processed again and reused, and in this way both natural resources and electricity are saved. Experts advise us to follow three rules, which are to reduce, to reuse and to recycle. Collecting and selling old bottles and tins is also a living for many people. Dangerous items such as hospital waste and used batteries must be kept apart and disposed of with great care. The duty of the city corporation is to collect rubbish regularly, and the duty of the citizen is to throw it only in the proper place. If schools run cleaning campaigns, children also learn this habit from an early age. A clean city is not only beautiful but also healthy."}, {"n": "E-commerce and Online Business", "x": "E-commerce means buying and selling goods and services through the internet. Now a person can choose a favourite item on a mobile phone at home, compare the prices and receive it within a few days. In Bangladesh online shopping has become much more popular in the last few years, especially after the spread of mobile financial services and digital payment. Clothes, books, electronics, groceries and food can all be found online today. Small traders and women entrepreneurs are opening pages on social media and starting a business with very little money. As a result, new kinds of work have also appeared, such as delivery workers, packaging and graphic designers. However, there are some risks in this sector. Sometimes the goods shown in an advertisement do not match what the customer receives, and some fake companies take advance money and disappear. So before shopping, a buyer should check the reputation of the shop, the opinions of other customers and the rules for returning goods. The PIN of a card or a mobile wallet must never be shared with anyone, and unknown links should not be clicked. Sellers should also give correct information, send goods on time and listen to customer complaints seriously. Village entrepreneurs can now send their handicrafts and farm products to buyers in cities and abroad, which could not be imagined before. Online business built on honesty and trust can bring new energy to the economy of the country."}, {"n": "Museums and Archaeology", "x": "A museum is an institution where the memories, works of art and historic objects of the past are carefully preserved. When we visit one, we learn how our ancestors lived, what kind of things they used and how civilisation moved forward. The National Museum at Shahbag in Dhaka is the largest museum of the country, and it holds a huge collection of ancient coins, sculpture, paintings, manuscripts and folk art. The Liberation War Museum shows us the photographs, letters and belongings of our struggle for independence. Archaeology is the science of digging up old remains buried under the earth and learning the history of the past from them. Mahasthangarh in Bogura and Mainamati in Cumilla are among the ancient archaeological sites of our country, where the ruins of buildings more than a thousand years old have been found. These remains are witnesses of our glorious past. But neglect, illegal occupation and theft are destroying many valuable treasures. It is never right to write on the walls of a historic place, to take away bricks or to throw rubbish there. Preserving such objects needs experts, modern equipment and enough money. If students are taken to museums regularly, they can understand history more easily than by reading books alone. Today the collections of many museums can also be seen online from home. A nation that does not know its own history cannot find the road to its future, so it is the duty of all of us to protect this wealth."}, {"n": "Social Media and the Young Generation", "x": "Social media has become a big part of the life of young people today. Through it they can talk to distant friends and relatives in a moment, share photographs and videos and meet new people. Many students form study groups here, watch educational videos and get the chance to express their opinions. Small traders can also advertise their goods through these platforms at no cost. But excessive use has some harmful sides. Looking at a phone screen for hours may cause eye problems, disturbed sleep and loss of attention in studies. Some people feel small or unhappy when they see the carefully arranged lives of others. Harassing, mocking or spreading rumours about others online is a serious offence, and the person who is hurt may carry the pain for a long time. So before sharing any news or picture, it is everyone's duty to check whether it is true. It is not safe to show personal information, addresses and family photographs to strangers. It is a good habit to decide in advance how long we will use it each day and to spend face to face time with the family. Parents should also stand beside their children like friends instead of only scolding them, and teach them how to use it properly. Technology exists for our benefit, so we can enjoy its real fruits only when we keep it under control and use it for good work."}, {"n": "First Aid and Emergency Services", "x": "First aid is the temporary help that is given to a person who has suddenly met with an accident or fallen ill, before a doctor can be reached. If it is given at the right time, it can often save a life. The first thing to do is to stay calm and to check that the place is safe. Then, if necessary, one should quickly call 999 to ask for help. If a person is cut and bleeding, the wound should be pressed with a clean cloth. For a small burn, cool running water should be poured on it at once, and it is a mistake to apply ice or toothpaste. If a bone is thought to be broken, the injured part should not be moved but kept steady with a stick or something firm. If a person has drowned, he should be taken out of the water, checked for breathing and given CPR if needed, but it is best to get training in advance. If someone is bitten by a snake, the person should be kept calm and taken quickly to a hospital, and wasting time with a traditional healer is dangerous. Every home, school and workplace should keep a first aid box with bandages, cotton, antiseptic and scissors. The Red Crescent and other organisations give first aid training in which everyone can take part. We should also not crowd around an injured person but let him have fresh air. A trained ordinary person can sometimes save the life of another."}, {"n": "Mental Health and Well-being", "x": "It is not true that a person is fully healthy just because the body is well, because the health of the mind is equally important. Mental health means the balance of our thoughts, feelings and behaviour. A person with a healthy mind can manage his emotions, keep working under pressure and maintain good relations with others. The pressure of studies, worry about a job, family problems or the pain of losing a loved one can make anyone's mind heavy. A low mood that lasts a long time without reason, changes in sleeping or eating habits and a loss of joy in any work can be signs of a mental problem. In our society many people feel shy to talk about such things or think of them as a weakness, and so they do not seek treatment in time. But just like physical illness, mental problems can be treated, and most people recover with the right help. To keep the mind well it helps to sleep regularly, walk or exercise, eat balanced food and keep time for activities we enjoy. Speaking openly with a friend or a member of the family also takes away a lot of pressure. If the problem is serious, one should consult a psychiatrist or a counsellor. The National Institute of Mental Health in Dhaka provides services in this field. World Mental Health Day is observed on 10 October every year. When someone is in distress, the greatest help is to listen carefully without blaming and to stay beside that person."}, {"n": "Traditional Bengali Food and Pitha", "x": "Food is not only a matter of filling the stomach, because it also shows the culture and hospitality of a nation. The main food of the Bengali is rice and fish, and when it is served with lentils, vegetables and mashed dishes, the midday meal becomes complete. The hilsa is dearly loved as our national fish, and the taste of hilsa cooked with mustard, fried hilsa and hilsa pulao is hard to forget. On Pohela Boishakh it has long been the custom to eat panta bhat with fried hilsa and mashed dishes. At festivals and when guests are entertained, pulao, korma, kacchi biryani and payesh are common. The yoghurt of Bogura, the kanchagolla of Natore and the seven colour tea of Srimangal are famous throughout the country. In winter, village homes make many kinds of pitha with fresh rice flour and date palm molasses. Bhapa pitha, chitoi pitha, puli pitha, patishapta and nakshi pitha are especially popular among them. At the Nabanna festival, families and neighbours enjoy pitha together in the joy of bringing the new rice home. These days many people in busy lives turn to quick and outside food, so these traditional dishes are slowly in danger of being lost. Yet home made local food is healthier and cheaper. It is our duty to learn the recipes from our elders and to teach them to the young. It is wise to combine the taste of tradition with balanced meals."}];

const T10={"bn": [{"n": "হরমুজ প্রণালী ও বিশ্ব জ্বালানি পথ", "x": "হরমুজ প্রণালী পারস্য উপসাগরকে ওমান উপসাগরের সাথে যুক্ত করেছে, আর এর ওপারেই রয়েছে আরব সাগর। এর উত্তরে ইরান এবং দক্ষিণে ওমানের মুসান্দাম উপদ্বীপ অবস্থিত। প্রণালীটির সবচেয়ে সংকীর্ণ অংশ প্রায় ৩৩ কিলোমিটার চওড়া, আর জাহাজ চলাচলের জন্য নির্ধারিত দুটি পথের প্রতিটি মাত্র কয়েক কিলোমিটার প্রশস্ত। সৌদি আরব, ইরাক, কুয়েত, কাতার, বাহরাইন ও সংযুক্ত আরব আমিরাতের মতো দেশগুলোর তেল ও গ্যাস এই পথ দিয়েই বিশ্ববাজারে পৌঁছায়। বিশেষ করে কুয়েতের সমুদ্রে যাওয়ার একমাত্র পথ এই প্রণালীর ভেতর দিয়েই গেছে। সাম্প্রতিক সংঘাতের আগে বিশ্বের অপরিশোধিত তেল ও তরল প্রাকৃতিক গ্যাসের প্রায় এক-পঞ্চমাংশ এখান দিয়ে পরিবহন করা হতো, তাই একে বিশ্বের সবচেয়ে গুরুত্বপূর্ণ জ্বালানি পথগুলোর একটি বলা হয়। ২০২৬ সালে এই অঞ্চলের সংঘাতের কারণে জাহাজ চলাচল ব্যাহত হয়েছে এবং ঝুঁকি এড়াতে অনেক জাহাজ মালিক এ পথ এড়িয়ে চলছেন। এর প্রভাবে জ্বালানির দাম ও পরিবহন খরচ বেড়েছে এবং বহু দেশের সরবরাহ ব্যবস্থায় চাপ পড়েছে। বাংলাদেশও এর বাইরে নয়, কারণ আমরা জ্বালানি তেল ও তরল প্রাকৃতিক গ্যাসের একটি অংশ এই অঞ্চল থেকে আমদানি করি। জ্বালানির দাম বাড়লে বিদ্যুৎ উৎপাদন, কলকারখানা, কৃষি ও পরিবহন সব খাতেই এর প্রভাব পড়ে। এ কারণে অনেক দেশ বিকল্প পাইপলাইন, নানা উৎস থেকে আমদানি এবং নবায়নযোগ্য জ্বালানির দিকে গুরুত্ব দিচ্ছে। সব দেশের স্বার্থেই প্রণালীতে নিরাপদ ও বাধাহীন চলাচল নিশ্চিত থাকা জরুরি। আলোচনা ও কূটনীতির মাধ্যমে শান্তি ফিরলেই এই গুরুত্বপূর্ণ জলপথ আবার স্বাভাবিক হতে পারে।"}], "en": [{"n": "The Strait of Hormuz and World Energy Routes", "x": "The Strait of Hormuz joins the Persian Gulf with the Gulf of Oman, and beyond it lies the Arabian Sea. Iran lies to its north, and the Musandam Peninsula of Oman lies to its south. The narrowest part of the strait is about 33 kilometres wide, and each of the two lanes set aside for ships is only a few kilometres across. The oil and gas of countries such as Saudi Arabia, Iraq, Kuwait, Qatar, Bahrain and the United Arab Emirates reach the world market through this route. Kuwait in particular has no other way to the open sea except through this strait. Before the recent conflict, about one fifth of the world's crude oil and liquefied natural gas was carried through it, which is why it is called one of the most important energy routes in the world. In 2026 the conflict in the region has disrupted shipping, and many ship owners have been avoiding the route to escape the danger. As a result, fuel prices and transport costs have risen, and the supply systems of many countries have come under pressure. Bangladesh is not outside this effect, because we import a part of our fuel oil and liquefied natural gas from this region. When the price of energy goes up, it affects power generation, factories, farming and transport alike. For this reason many countries are giving more importance to alternative pipelines, imports from many sources and renewable energy. It is in the interest of every nation that safe and free passage through the strait is ensured. When peace returns through talks and diplomacy, this important waterway can become normal again."}]};

const T9={"bn": [{"n": "টিকাদান ও রোগ প্রতিরোধ", "x": "রোগ হওয়ার পর চিকিৎসা করার চেয়ে রোগ যেন না হয় সেই ব্যবস্থা নেওয়া অনেক ভালো, আর টিকা এই কাজেই সবচেয়ে কার্যকর অস্ত্র। টিকা শরীরকে আগে থেকেই কোনো রোগের জীবাণু চিনতে শেখায়, ফলে পরে সেই জীবাণু আক্রমণ করলে শরীর সহজেই তাকে রুখে দিতে পারে। অষ্টাদশ শতাব্দীর শেষ দিকে বিজ্ঞানী এডওয়ার্ড জেনার গুটিবসন্তের টিকা আবিষ্কার করেন, আর পরবর্তীকালে সারা বিশ্বে এই রোগ নির্মূল হয়েছে। বাংলাদেশে ১৯৭৯ সালে সম্প্রসারিত টিকাদান কর্মসূচি শুরু হয়, যার মাধ্যমে শিশুদের যক্ষ্মা, ডিপথেরিয়া, হুপিং কাশি, ধনুষ্টংকার, পোলিও ও হাম প্রতিরোধের টিকা দেওয়া হয়। এই কর্মসূচির সাফল্যে দেশে শিশুমৃত্যুর হার উল্লেখযোগ্যভাবে কমেছে। স্বাস্থ্যকর্মীরা ঘরে ঘরে ও কেন্দ্রে গিয়ে নির্দিষ্ট সময় অন্তর শিশুদের টিকা দেন। অভিভাবকদের উচিত টিকার কার্ড যত্ন করে রাখা এবং কোনো ডোজ বাদ না দেওয়া। গর্ভবতী মায়েদের টিকাও মা ও নবজাতক দুজনকেই সুরক্ষা দেয়। কখনো কখনো টিকা নিয়ে গুজব ছড়িয়ে পড়ে এবং কিছু মানুষ ভুল ধারণার কারণে সন্তানকে টিকা দিতে চান না, অথচ এতে পুরো এলাকার ঝুঁকি বাড়ে। টিকার সামান্য জ্বর বা ব্যথা সাধারণত দু-এক দিনেই সেরে যায়, তাই এতে ভয় পাওয়ার কিছু নেই। যখন অধিকাংশ মানুষ টিকা নেন, তখন যাঁরা কোনো কারণে টিকা নিতে পারেন না তাঁরাও পরোক্ষভাবে রক্ষা পান। পরিচ্ছন্নতা, নিরাপদ পানি ও সুষম খাদ্যের সাথে টিকা মিলিয়েই একটি সুস্থ জাতি গড়ে ওঠে। তাই স্বাস্থ্য বিভাগের নির্দেশনা মেনে সময়মতো টিকা নেওয়া আমাদের সবার দায়িত্ব।"}, {"n": "মৎস্য চাষ ও প্রাণিসম্পদ", "x": "মাছ ও মাংসে ভরপুর আমিষ আমাদের খাদ্যতালিকার গুরুত্বপূর্ণ অংশ, আর মৎস্য ও প্রাণিসম্পদ খাত সেই চাহিদা পূরণে বড় ভূমিকা রাখছে। বাংলাদেশের পুকুর, দিঘি, হাওর ও নদীতে প্রচুর মাছ পাওয়া যায়, আবার আধুনিক পদ্ধতিতে পুকুরে রুই, কাতলা, তেলাপিয়া ও পাঙ্গাস চাষ করে কৃষকেরা ভালো আয় করছেন। খুলনা ও কক্সবাজার অঞ্চলে চিংড়ি চাষ করে বিদেশে রপ্তানি করা হয়, যা বৈদেশিক মুদ্রা আয়ের একটি উৎস। মাছ চাষে ভালো ফলনের জন্য পুকুর প্রস্তুত করা, মানসম্পন্ন পোনা ছাড়া এবং সময়মতো খাবার দেওয়া দরকার। গরু, ছাগল, হাঁস ও মুরগি পালন গ্রামীণ পরিবারের আয়ের আরেকটি বড় পথ। ব্ল্যাক বেঙ্গল ছাগল তার সুস্বাদু মাংস ও উন্নত চামড়ার জন্য সুপরিচিত। দুধ ও ডিমের উৎপাদন বেড়ে যাওয়ায় দেশ এ দুই ক্ষেত্রে অনেকটাই স্বয়ংসম্পূর্ণতার দিকে এগিয়েছে। গ্রামের নারীরা হাঁস মুরগি ও গবাদিপশু পালনের মাধ্যমে পরিবারের সচ্ছলতা বাড়াচ্ছেন। তবে রোগবালাই, খাদ্যের উচ্চ দাম ও বাজারজাতকরণের সমস্যা এই খাতের বড় বাধা। পশুর নিয়মিত টিকা, সুষম খাদ্য এবং পরিচ্ছন্ন খামার রোগ প্রতিরোধে সহায়ক। জলাশয় দূষণ ও অতিরিক্ত রাসায়নিক ব্যবহার মাছের জন্য ক্ষতিকর, তাই পরিবেশের দিকে নজর রাখা জরুরি। সরকারি প্রশিক্ষণ, সহজ ঋণ ও আধুনিক প্রযুক্তি পেলে এই খাত আরও এগিয়ে যেতে পারে। এভাবে মাছ ও প্রাণিসম্পদ আমাদের পুষ্টি, কর্মসংস্থান ও অর্থনীতিকে একসাথে শক্তিশালী করছে।"}, {"n": "ডিজিটাল বাংলাদেশ ও ই-সেবা", "x": "ডিজিটাল বাংলাদেশ বলতে প্রযুক্তির ব্যবহার বাড়িয়ে নাগরিক সেবা সহজ, দ্রুত ও স্বচ্ছ করার উদ্যোগকে বোঝায়। আগে একটি সনদ বা নথি পেতে মানুষকে বারবার অফিসে ঘুরতে হতো, কিন্তু এখন অনেক সেবা অনলাইনে বা মোবাইল ফোনেই পাওয়া যায়। জন্মনিবন্ধন, পাসপোর্টের আবেদন, বিদ্যুৎ ও গ্যাসের বিল পরিশোধ এবং পরীক্ষার ফল জানার কাজ এখন ঘরে বসেই করা সম্ভব। জাতীয় পরিচয়পত্র নাগরিকের পরিচয় যাচাইয়ের একটি গুরুত্বপূর্ণ মাধ্যম হয়ে উঠেছে। সরকারি কেনাকাটায় অনলাইন দরপত্র ব্যবস্থা চালু হওয়ায় অনিয়ম ও দুর্নীতির সুযোগ কমেছে। গ্রামের মানুষদের জন্য ডিজিটাল সেন্টার স্থাপন করা হয়েছে, যেখানে অল্প খরচে ইন্টারনেট, ফটোকপি, ফরম পূরণ ও নানা সেবা পাওয়া যায়। ৩৩৩ নম্বরে ফোন করে সরকারি সেবা সম্পর্কে তথ্য জানার সুবিধাও রয়েছে। শিক্ষাক্ষেত্রে ডিজিটাল ক্লাসরুম ও অনলাইন পাঠদান শিক্ষার্থীদের শেখার নতুন পথ খুলে দিয়েছে। তবে সবার কাছে ইন্টারনেট ও ডিভাইস পৌঁছানো, দক্ষ জনবল তৈরি এবং ব্যক্তিগত তথ্যের নিরাপত্তা নিশ্চিত করা এখনো বড় চ্যালেঞ্জ। বয়স্ক ও কম শিক্ষিত মানুষদের জন্য প্রযুক্তি ব্যবহার শেখানোর বিশেষ ব্যবস্থা দরকার। তরুণদের কম্পিউটার ও টাইপিংয়ে দক্ষ করে তুললে এই রূপান্তর আরও দ্রুত হবে। প্রযুক্তি তখনই সার্থক, যখন তা সবার কাছে সমানভাবে পৌঁছায় এবং মানুষের জীবনকে সত্যিই সহজ করে।"}, {"n": "ক্ষুদ্র নৃগোষ্ঠী ও সাংস্কৃতিক বৈচিত্র্য", "x": "বাংলাদেশ মূলত বাঙালির দেশ হলেও এখানে চাকমা, মারমা, ত্রিপুরা, গারো, সাঁওতাল, মণিপুরীসহ অনেক ক্ষুদ্র নৃগোষ্ঠীর মানুষ যুগ যুগ ধরে বসবাস করছেন। রাঙামাটি, বান্দরবান ও খাগড়াছড়ির পাহাড়ি এলাকা এবং ময়মনসিংহ, সিলেট ও উত্তরবঙ্গের বিভিন্ন অঞ্চলে তাঁদের বসতি রয়েছে। প্রতিটি জনগোষ্ঠীর নিজস্ব ভাষা, পোশাক, গান, নাচ ও উৎসব আছে। পাহাড়ি জনগোষ্ঠীর বৈসাবি উৎসব এবং গারোদের ওয়ানগালা উৎসব খুবই আনন্দমুখর ও রঙিন। তাঁদের হাতে বোনা কাপড়ের নকশা ও বাঁশ বেতের শিল্প সবার প্রশংসা কুড়ায়। অনেক জনগোষ্ঠীর জীবন প্রকৃতির সাথে নিবিড়ভাবে জড়িত, তাই তাঁরা বন ও পাহাড়কে যত্নের সাথে রক্ষা করেন। তবে ভূমি নিয়ে সমস্যা, মাতৃভাষায় শিক্ষার সীমিত সুযোগ এবং স্বাস্থ্যসেবার অভাব তাঁদের অনেককে পিছিয়ে রেখেছে। সব নাগরিকের সমান অধিকার ও মর্যাদা নিশ্চিত করা রাষ্ট্র ও সমাজের দায়িত্ব। বিভিন্ন জনগোষ্ঠীর শিশুরা যেন নিজের ভাষায় প্রাথমিক শিক্ষা পায়, সেজন্য কিছু উদ্যোগ নেওয়া হয়েছে। আমাদের উচিত তাঁদের সংস্কৃতিকে সম্মান করা এবং ঠাট্টা বা বৈষম্যের মনোভাব ত্যাগ করা। একে অপরের উৎসবে অংশ নিলে বন্ধুত্ব ও সৌহার্দ্য আরও গভীর হয়। প্রতিবছর ৯ই আগস্ট বিশ্ব আদিবাসী দিবস পালিত হয়। বৈচিত্র্য আমাদের দুর্বলতা নয়, বরং শক্তি, আর সব মানুষের সম্মিলিত অংশগ্রহণেই একটি সুন্দর ও শান্তিপূর্ণ দেশ গড়ে ওঠে।"}, {"n": "অধ্যবসায় ও সাফল্য", "x": "অধ্যবসায় মানে কোনো কাজে লেগে থাকা, বাধা এলেও হাল না ছাড়া এবং বারবার চেষ্টা করে লক্ষ্যে পৌঁছানো। পৃথিবীর বেশির ভাগ সফল মানুষ প্রথম চেষ্টাতেই সফল হননি, বরং বহুবার ব্যর্থ হয়ে শেষ পর্যন্ত নিজের পথ খুঁজে পেয়েছেন। বিজ্ঞানীরা একটি আবিষ্কারের পেছনে বছরের পর বছর পরীক্ষা চালান, আর খেলোয়াড়েরা প্রতিদিন ঘাম ঝরিয়ে অনুশীলন করেন। এই সত্য আমাদের শেখায় যে প্রতিভার চেয়ে নিয়মিত পরিশ্রমের মূল্য অনেক বেশি। একজন শিক্ষার্থী যদি প্রথমবার পরীক্ষায় খারাপ করে হতাশ হয়ে পড়ে, তাহলে সে আর এগোতে পারে না, কিন্তু ভুল থেকে শিখে আবার চেষ্টা করলে সাফল্য আসবেই। টাইপিং শেখার ক্ষেত্রেও একই কথা প্রযোজ্য, কারণ প্রথমে গতি কম ও ভুল বেশি হলেও প্রতিদিনের অনুশীলনে ধীরে ধীরে উন্নতি দেখা যায়। ব্যর্থতাকে শেষ মনে না করে একটি পাঠ হিসেবে নিতে হয়। লক্ষ্য ছোট ছোট ধাপে ভাগ করে নিলে পথ সহজ হয় এবং প্রতিটি ধাপ পেরোনোর আনন্দ আবার নতুন উদ্যম জোগায়। ধৈর্যহীন মানুষ সহজে ক্লান্ত হয়ে পড়ে, আর শর্টকাটের পেছনে ছুটে সময় নষ্ট করে। অন্যের সাথে নিজের তুলনা না করে গতকালের নিজের চেয়ে আজ একটু ভালো হওয়ার চেষ্টাই প্রকৃত অগ্রগতি। পরিবার ও শিক্ষকদের উৎসাহও এই পথে বড় শক্তি জোগায়। যে মানুষ হার না মেনে এগিয়ে যেতে জানে, সাফল্য একদিন তার দরজায় কড়া নাড়বেই।"}], "en": [{"n": "Vaccination and Disease Prevention", "x": "It is far better to prevent a disease than to treat it after it has appeared, and vaccines are one of the most powerful tools for doing so. A vaccine teaches the body to recognise a germ in advance, so that when the real germ attacks, the body can defeat it quickly. At the end of the eighteenth century the scientist Edward Jenner developed a vaccine against smallpox, and in later years that terrible disease was wiped out across the world. Bangladesh started its Expanded Programme on Immunisation in 1979, which gives children vaccines against tuberculosis, diphtheria, whooping cough, tetanus, polio and measles. Thanks to this programme the number of child deaths in the country has fallen greatly. Health workers visit homes and vaccination centres to give children their doses at the proper times. Parents should keep the vaccination card safely and should never miss a dose. Vaccines given to pregnant women protect both the mother and the newborn baby. Sometimes rumours spread and a few families refuse to vaccinate their children because of wrong beliefs, which increases the risk for the whole neighbourhood. A mild fever or a sore arm after a vaccine usually passes in a day or two, so there is no reason to be afraid. When most people in a community are vaccinated, those who cannot take a vaccine are also protected indirectly. Clean water, good hygiene and balanced food work together with vaccines to build a healthy nation. It is therefore the duty of everyone to follow the advice of the health department and to take every vaccine on time."}, {"n": "Fisheries and Livestock", "x": "Protein from fish and meat is an important part of our daily food, and the fisheries and livestock sector plays a big role in meeting this need. The ponds, lakes, wetlands and rivers of Bangladesh hold a great number of fish, and farmers also earn a good income by raising carp, tilapia and pangas in ponds with modern methods. In the Khulna and Cox's Bazar regions, shrimp are farmed and exported abroad, which brings in foreign currency. For a good harvest, a farmer must prepare the pond properly, release healthy fingerlings and feed the fish on time. Keeping cattle, goats, ducks and hens is another major source of income for rural families. The Black Bengal goat is well known for its tasty meat and fine leather. With rising production of milk and eggs, the country has moved a long way toward self sufficiency in these two products. Village women have improved the comfort of their families by rearing poultry and livestock. However, disease, the high price of feed and difficulties in marketing remain serious obstacles for the sector. Regular vaccination of animals, balanced feed and clean farms help to prevent disease. Pollution of water and the excessive use of chemicals harm fish, so care for the environment is also necessary. With government training, easy loans and modern technology the sector can grow even more. In this way fish and livestock are strengthening our nutrition, our employment and our economy at the same time."}, {"n": "Digital Bangladesh and e-Services", "x": "Digital Bangladesh means using technology to make public services easier, faster and more transparent for citizens. In the past a person had to visit an office again and again to get a certificate or a document, but today many services are available online or on a mobile phone. Birth registration, passport applications, payment of electricity and gas bills and the checking of examination results can now be done from home. The national identity card has become an important means of verifying the identity of a citizen. The introduction of online tendering in government purchases has reduced the chances of irregularity and corruption. Digital centres have been set up for people in villages, where they can use the internet, photocopying, form filling and many other services at a low cost. Citizens can also call 333 to get information about government services. In education, digital classrooms and online lessons have opened a new path of learning for students. Yet bringing the internet and devices to everyone, training skilled workers and protecting personal data are still big challenges. Older and less educated people need special help to learn how to use technology. If young people become skilled in computers and typing, the change will move even faster. Technology is truly successful when it reaches everyone equally and makes life simpler for ordinary people."}, {"n": "Ethnic Diversity and Cultural Harmony", "x": "Although Bangladesh is mainly a land of Bengalis, many small ethnic communities such as the Chakma, Marma, Tripura, Garo, Santal and Manipuri have lived here for generations. They live in the hill districts of Rangamati, Bandarban and Khagrachhari and in parts of Mymensingh, Sylhet and northern Bangladesh. Every community has its own language, dress, songs, dances and festivals. The Boisabi festival of the hill peoples and the Wangala festival of the Garos are cheerful and full of colour. The patterns of their hand woven cloth and their bamboo and cane crafts are admired by everyone. The lives of many communities are closely tied to nature, so they protect forests and hills with great care. However, problems over land, limited chances to study in the mother tongue and a lack of health services have kept many of them behind. It is the duty of the state and of society to ensure equal rights and dignity for every citizen. Some steps have been taken so that children of different communities can receive primary education in their own language. We should respect their cultures and give up any habit of mockery or discrimination. When people join in one another's festivals, friendship and goodwill grow deeper. The International Day of the World's Indigenous Peoples is observed on 9 August every year. Diversity is not our weakness but our strength, and a peaceful country is built by the shared effort of all its people."}, {"n": "Perseverance and Success", "x": "Perseverance means sticking to a task, refusing to give up when obstacles appear and trying again and again until the goal is reached. Most successful people in the world did not succeed on the first attempt, but failed many times before they finally found their way. Scientists spend years in experiments behind a single discovery, and athletes sweat in practice every day. This truth teaches us that regular hard work is worth far more than talent alone. If a student becomes hopeless after doing badly in an examination once, he cannot move forward, but if he learns from the mistakes and tries again, success will surely come. The same is true of learning to type, because even if the speed is low and the mistakes are many at the start, daily practice slowly brings improvement. Failure should be treated as a lesson and not as the end of the road. Dividing a goal into small steps makes the path easier, and the joy of finishing each step gives fresh energy. An impatient person gets tired quickly and wastes time running after shortcuts. Instead of comparing ourselves with others, we should try to be a little better today than we were yesterday, and that is real progress. The encouragement of family and teachers is also a great strength on this road. A person who knows how to keep going without accepting defeat will find that success one day knocks at his door."}]};
