html,body,button,input,select,textarea{font-family:"Kalpurush",system-ui,sans-serif}
:root{--bg:#f4f6f8;--cd:#fff;--tx:#1b1f24;--mu:#5b6570;--ac:#0b6e4f;--bd:#d5dbe1;--ok:#d9f2e3;--er:#fbd9d9;--cu:#ffe9a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#13161a;--cd:#1d2227;--tx:#e8ebee;--mu:#9aa5b0;--ac:#3ec28f;--bd:#333b43;--ok:#1d4a35;--er:#5a2424;--cu:#5c4a12}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#13161a;--cd:#1d2227;--tx:#e8ebee;--mu:#9aa5b0;--ac:#3ec28f;--bd:#333b43;--ok:#1d4a35;--er:#5a2424;--cu:#5c4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Kalpurush",system-ui,sans-serif}
main{}
h1{font-size:1.3rem;margin:0 0 10px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
label{display:flex;flex-direction:column;font-size:1rem;color:var(--mu);flex:1 1 140px}
select,button,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;padding:8px 16px}
#bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;flex-wrap:wrap;gap:6px}
/* প্যাসেজ ও টাইপিং বক্স: একই মাপ, একই ফন্ট, একই লাইন-উচ্চতা */
:root{--rows:7;--lh:2.25rem}@media(max-width:0px){:root{--rows:4}}
#pass,#tv{box-sizing:border-box;position:relative;height:calc(var(--rows)*var(--lh) + 2px);overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable;font-size:1.25rem;line-height:var(--lh);padding:0 8px;border:1px solid var(--bd);border-radius:8px}
#pass{user-select:none;-webkit-user-select:none}
#tw{position:relative;margin-top:10px}
#tv{cursor:text}
#tv .tyw{transform-origin:left center;position:absolute;white-space:pre;padding:0 3px;height:var(--lh);line-height:var(--lh)}
#tv .tyx{color:#e53935}
#sp{position:absolute;left:0;top:0;width:1px;visibility:hidden}
#cr{position:absolute;width:2px;height:26px;background:var(--ac);display:none;animation:blk 1s steps(1) infinite}
@keyframes blk{50%{opacity:0}}
#tw:not(.bk) #ta{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none;font-size:16px}
#tw.bk #tv{display:none}
#pass span{padding:1px 3px;border-radius:4px}
.w{background:#e53935;color:#fff}.u{background:var(--cu)}
textarea{width:100%;box-sizing:border-box;height:130px;font-size:1.2rem;margin-top:0;resize:none}
#res{display:none}#res b{font-size:1.1rem}
table{border-collapse:collapse;width:100%}td{padding:4px 8px;border-bottom:1px solid var(--bd)}
.big{font-size:1.5rem;font-weight:600}
.pass{color:var(--ac)}.fail{color:#c62828}.why ul{margin:6px 0 0;padding-left:22px}.why b{font-weight:600}
details{font-size:.85rem}.kg{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.kg i{font-style:normal;border:1px solid var(--bd);border-radius:6px;padding:2px 6px}

const PB={bn:[{t:"তথ্যপ্রযুক্তি",x:"তথ্যপ্রযুক্তি আজকের পৃথিবীর অন্যতম গুরুত্বপূর্ণ শক্তি। বাংলাদেশেও গত কয়েক বছরে তথ্যপ্রযুক্তির ব্যবহার অনেক বেড়েছে। আগে যে কাজ করতে দিনের পর দিন সময় লাগত, এখন কম্পিউটার ও ইন্টারনেটের সাহায্যে তা অল্প সময়ে সম্পন্ন করা যায়। সরকারি অফিস, ব্যাংক, হাসপাতাল ও শিক্ষাপ্রতিষ্ঠানে কম্পিউটারের ব্যবহার এখন খুবই সাধারণ বিষয়। ফলে দক্ষ কম্পিউটার অপারেটরের চাহিদাও দিন দিন বাড়ছে। একজন ভালো অপারেটরের জন্য দ্রুত ও নির্ভুলভাবে টাইপ করার ক্ষমতা অত্যন্ত জরুরি। কারণ অফিসের অধিকাংশ কাজ চিঠিপত্র, প্রতিবেদন, তালিকা ও নথি তৈরির সাথে জড়িত। এসব কাজে যিনি যত দ্রুত ও সঠিকভাবে লিখতে পারেন, তিনি তত বেশি সফল হন। টাইপিংয়ে দক্ষতা অর্জনের জন্য প্রয়োজন নিয়মিত অনুশীলন। প্রথমে কিবোর্ডের প্রতিটি অক্ষরের অবস্থান ভালো করে চিনে নিতে হয়। এরপর পর্দার দিকে তাকিয়ে, হাতের দিকে না দেখে, ধীরে ধীরে টাইপ করার অভ্যাস করতে হয়। শুরুতে গতি কম হলেও ভয় পাওয়ার কিছু নেই, কারণ প্রতিদিনের চর্চায় গতি আপনা থেকেই বাড়তে থাকে। তবে গতির চেয়ে নির্ভুলতা বেশি গুরুত্বপূর্ণ, কেননা ভুল শব্দ থাকলে পুরো লেখার মান নষ্ট হয়ে যায়। তাই প্রতিটি শব্দ মনোযোগ দিয়ে দেখে টাইপ করা উচিত। সরকারি চাকরির ব্যবহারিক পরীক্ষায় নির্দিষ্ট সময়ের মধ্যে একটি অনুচ্ছেদ টাইপ করতে দেওয়া হয়, যেখানে নির্ধারিত গতি এবং সীমিত ভুলের শর্ত পূরণ করতে হয়। যারা আগে থেকেই পরীক্ষার মতো পরিবেশে অনুশীলন করেন, তারা পরীক্ষার হলে অনেক বেশি আত্মবিশ্বাসী থাকেন। সঠিক বসার ভঙ্গি, চোখের বিশ্রাম এবং ধৈর্যও একজন টাইপিস্টের সাফল্যের গুরুত্বপূর্ণ অংশ। মনে রাখতে হবে, নিয়মিত পরিশ্রম ও ধৈর্য ছাড়া কোনো দক্ষতাই অর্জন করা সম্ভব নয়।"}],en:[{t:"Computer Skills",x:"Computer skills have become essential for almost every office job in the modern world. Letters, reports, lists and records that were once written by hand are now prepared on a computer, and the person who can type quickly and accurately saves a great deal of time for the whole organization. For this reason, government offices, banks and private companies often test the typing speed of candidates before they are appointed. A practical typing test is usually held in a computer laboratory under the supervision of an examiner. Each candidate is given a printed or on-screen passage and a fixed period of time, and must type the passage as closely as possible to the original. The speed is calculated by counting five strokes as one word, and the number of mistakes is compared with the total number of words typed. If the mistakes exceed the permitted limit, the candidate fails even when the speed is high. This is why accuracy is just as important as speed. To improve both, a learner should begin by memorizing the position of every key and keeping the fingers on the home row. The eyes should stay on the text, not on the keyboard, because looking down breaks the rhythm and causes errors. Short practice sessions every day are far better than one long session once a week. A comfortable chair, a straight back and relaxed shoulders also help a typist work for a long time without becoming tired. Finally, candidates should reach the examination hall early, listen carefully to the instructions, and stay calm. Confidence comes from regular practice, and regular practice is the surest path to success in any typing examination."}]};

 এবং বাতাসে থাকা ক্ষতিকর কার্বন ডাই অক্সাইড শুষে নিয়ে বায়ুকে পরিষ্কার রাখে।", "নির্বিচারে বন কেটে ফেলার কারণে অনেক পশুপাখির আবাসস্থল নষ্ট হচ্ছে এবং কিছু প্রজাতি পৃথিবী থেকে চিরতরে হারিয়ে যাচ্ছে।", "কলকারখানা ও যানবাহনের ধোঁয়া বাতাসকে এমনভাবে দূষিত করছে যে বড় শহরগুলোতে নিশ্বাস নেওয়াও অনেক সময় কষ্টকর হয়ে পড়ে।", "পৃথিবীর তাপমাত্রা ধীরে ধীরে বাড়ছে, ফলে মেরু অঞ্চলের বরফ গলছে এবং সমুদ্রের পানির উচ্চতা বেড়ে উপকূলীয় এলাকাগুলো ঝুঁকিতে পড়ছে।", "বাংলাদেশ জলবায়ু পরিবর্তনের ঝুঁকিতে থাকা দেশগুলোর একটি, তাই ঘূর্ণিঝড়, বন্যা ও লবণাক্ততার সমস্যা আমাদের জন্য বড় চ্যালেঞ্জ।", "প্লাস্টিকের ব্যাগ ও বোতল মাটিতে মিশে যেতে শত শত বছর লাগে, তাই এগুলোর ব্যবহার কমিয়ে পাটের ব্যাগ ব্যবহার করা উচিত।", "প্রত্যেকে যদি বছরে অন্তত একটি করে গাছ লাগায় এবং তার যত্ন নেয়, তাহলে কয়েক বছরের মধ্যেই দেশ আরও সবুজ হয়ে উঠবে।", "বিদ্যুৎ ও পানির অপচয় রোধ করা, আবর্জনা নির্দিষ্ট স্থানে ফেলা এবং সৌরশক্তির ব্যবহার বাড়ানো পরিবেশ রক্ষার সহজ উপায়।", "বিদ্যালয় ও সংবাদমাধ্যমে পরিবেশ বিষয়ক সচেতনতা বাড়ানো গেলে নতুন প্রজন্ম প্রকৃতির প্রতি আরও যত্নবান ও দায়িত্বশীল হয়ে বেড়ে উঠবে।", "উন্নত দেশগুলোর উচিত তাদের কার্বন নিঃসরণ কমানো এবং ক্ষতিগ্রস্ত দেশগুলোকে প্রয়োজনীয় আর্থিক ও প্রযুক্তিগত সহায়তা দেওয়া।", "এই পৃথিবী আমাদের পূর্বপুরুষদের কাছ থেকে পাওয়া উপহার নয়, বরং আমাদের সন্তানদের কাছ থেকে ধার করা সম্পদ, তাই একে রক্ষা করা আমাদের দায়িত্ব।"]}], "en": [{"n": "Rivers and Nature", "s": ["Bangladesh is often called a land of rivers because hundreds of streams and channels wind their way through its green and fertile countryside.", "The Padma, the Meghna and the Jamuna are the three great rivers that carry silt from the mountains and spread it across the farmland every year.", "During the monsoon season the water rises and covers whole villages, but after it retreats the fields turn bright green with fresh crops.", "A wooden boat with a patched sail drifting slowly across the water is one of the most familiar and peaceful sights of rural life.", "Boatmen work from early morning until dusk to carry passengers, rice, jute and vegetables from one landing place to another along the river.", "The rivers are also home to many kinds of fish, which provide an important source of food and income for millions of ordinary families.", "Standing on the bank at dawn, a visitor can feel the cool breeze, hear the birds singing and watch the mist slowly lift from the water.", "Sadly, waste from factories and household garbage has made the water in many rivers so dirty that fish and other living things are dying.", "Illegal grabbing and filling of riverbeds is another serious problem, because a river that loses its space also loses its life and its beauty.", "Strict laws, regular cleaning and honest cooperation between the government and local people are needed to bring our rivers back to health.", "A nation that loves its rivers, its soil and its forests is a nation that will always find food, water and happiness for its children.", "Let us promise ourselves that we will leave behind clean, flowing and living rivers for every generation that comes after us in this country."]}, {"n": "Education and Learning", "s": ["Education removes the darkness of ignorance from the mind and teaches a person to tell truth from falsehood, which is why it is called the backbone of a nation.", "An educated citizen can contribute far more to the family, the community and the country than a person who has never had the chance to learn.", "Teachers are the guides of our lives, and through their patient and selfless effort we learn to read, to count, and to dream of a better future.", "A classroom does not only deliver the knowledge found in textbooks, it also teaches discipline, punctuality and respect for other people.", "A library is a treasure house where the experience and thoughts of thousands of years are carefully arranged on the pages of countless books.", "The habit of reading every day sharpens the mind, enriches the vocabulary and helps a person remain calm and steady even in difficult times.", "Today the internet allows us to learn from any corner of the world while sitting at home, but choosing reliable information is also a skill.", "To achieve good results in an examination, memorizing alone is never enough, because understanding the subject and practising regularly is far more effective.", "The proper use of time is the key to success for every student, since a moment that has passed can never be brought back again.", "Learning does not stop when school ends, and a person who is eager to learn something new every day will always stay ahead of changing times.", "It is our shared duty to make sure that every child in the country gets a fair chance to go to school and to complete a decent education.", "Only a nation lit by the light of knowledge can build its own future with its own hands and stand tall among the nations of the world."]}, {"n": "Health and Fitness", "s": ["Good health is the greatest wealth a person can have, because without a healthy body no work feels pleasant and no happiness feels complete.", "Walking or doing light exercise for half an hour every morning keeps the body active and greatly reduces the risk of many common diseases.", "Green vegetables, seasonal fruits, lentils and fish should be a regular part of our daily meals, since they provide the nutrients the body needs.", "Eating too much oil, sugar and fried food for a long time can lead to weight gain and illnesses such as diabetes and high blood pressure.", "Drinking clean water and washing the hands before meals protects us from a large number of stomach infections in a simple and cheap way.", "Adults need at least seven or eight hours of sleep each night, because without enough rest both the body and the mind become weak and tired.", "People who work at a computer for long hours should take short breaks to rest their eyes and should always sit with a straight back.", "To reduce stress it helps to spend time with family and friends, to do the things one enjoys, and to speak openly when something is troubling the mind.", "Smoking and drugs slowly destroy health, money and reputation together, so staying far away from them is always the wisest choice a person can make.", "When a person falls ill, he should not take medicine on his own but should consult a qualified doctor and follow the instructions carefully.", "Regular medical checkups help to find many diseases at an early stage, which makes treatment easier and also costs much less for the family.", "A healthy body, a calm mind and a balanced way of living together form the most reliable foundation for a long and happy life."]}, {"n": "Agriculture and Village Life", "s": ["A large part of the economy still depends on agriculture, and millions of farmers work in the fields every day to put food on our tables.", "Rice is the main crop of the country, and in every season the fields turn golden as the heavy heads of grain bend in the warm wind.", "Before the sun rises, the farmer walks to the field with his oxen and plough, although in many places tractors and machines now do the same work.", "Besides rice, farmers grow jute, wheat, maize, potatoes and many kinds of vegetables to support their families and to meet the needs of the nation.", "If the rain does not come on time the crops suffer, and if floods arrive too early all the standing crops can be lost in a single night.", "Improved seeds, the right amount of fertilizer and a reliable supply of water can raise the yield from the same piece of land by a great deal.", "Village people lead simple and honest lives, and in times of trouble neighbours stand beside one another with sincere warmth and kindness.", "In the afternoon the village market fills with farmers who bring vegetables, fruits and fish to sell and cheerfully bargain with the customers.", "Village fairs, folk songs, traditional plays and festivals of homemade cakes have kept our culture of a thousand years alive until today.", "When good roads, electricity, internet and health centres reach the villages, the pressure on the cities will fall and rural life will improve.", "If farmers are guaranteed a fair price for their crops, they will farm with greater enthusiasm and the country will never face a food crisis.", "Respecting farmers and their work is the duty of every citizen, because it is their labour that fills our plates three times every day."]}, {"n": "Environment and Climate", "s": ["Trees, water, air and soil together make up the environment around us, and no human being can survive for long without protecting it.", "Trees give us oxygen, shade and fruit, and they also absorb harmful carbon dioxide from the air and help to keep the atmosphere clean.", "The careless cutting of forests is destroying the homes of many animals and birds, and some species are disappearing from the earth forever.", "Smoke from factories and vehicles pollutes the air so badly that in big cities even breathing sometimes becomes difficult for children and the elderly.", "The temperature of the earth is slowly rising, ice at the poles is melting and the sea level is climbing, which puts coastal areas at serious risk.", "This country is among those most exposed to climate change, so cyclones, floods and rising salinity remain a major challenge for the people.", "Plastic bags and bottles take hundreds of years to break down in the soil, so we should use cloth or jute bags whenever it is possible.", "If every person planted at least one tree every year and took good care of it, the whole country would become much greener within a few years.", "Saving water and electricity, throwing rubbish only in proper bins and using more solar power are easy ways in which anyone can help the environment.", "Teaching children about nature in schools and through the media helps the next generation grow up more careful and more responsible toward the earth.", "Rich countries should reduce their own emissions and give financial and technical help to the countries that suffer most from the changing climate.", "This planet is not a gift from our ancestors but a loan from our children, and protecting it is therefore a responsibility that belongs to all of us."]}]};
for(const l of["bn","en"])TH[l].forEach(t=>PB[l].push({t:t.n,x:t.s.join(" ")}));
const T2={"bn": [{"n": "জাতিসংঘ ও বিশ্বশান্তি", "s": ["দ্বিতীয় বিশ্বযুদ্ধের ভয়াবহ ধ্বংসযজ্ঞের পর পৃথিবীতে শান্তি রক্ষার উদ্দেশ্যে ১৯৪৫ সালে জাতিসংঘ নামের আন্তর্জাতিক সংস্থাটি প্রতিষ্ঠিত হয়।", "এই সংস্থার সদর দপ্তর যুক্তরাষ্ট্রের নিউইয়র্ক শহরে অবস্থিত, আর বর্তমানে পৃথিবীর প্রায় সব স্বীকৃত দেশই এর সদস্য হিসেবে যুক্ত রয়েছে।", "জাতিসংঘের প্রধান উদ্দেশ্য হলো বিভিন্ন দেশের মধ্যে বন্ধুত্বপূর্ণ সম্পর্ক গড়ে তোলা এবং যুদ্ধ ও সংঘাত এড়িয়ে আলোচনার মাধ্যমে সমস্যার সমাধান করা।", "নিরাপত্তা পরিষদ এই সংস্থার একটি গুরুত্বপূর্ণ অঙ্গ, যার পাঁচটি স্থায়ী সদস্য রয়েছে এবং বিশ্বের নিরাপত্তা সংক্রান্ত বড় সিদ্ধান্ত এখানেই নেওয়া হয়।", "সাধারণ পরিষদে প্রতিটি সদস্য দেশ একটি করে ভোটের অধিকার পায়, ফলে ছোট বড় সব দেশ নিজেদের মতামত বিশ্বসভায় তুলে ধরার সুযোগ পায়।", "যেসব এলাকায় যুদ্ধ বা গৃহবিবাদ চলছে, সেখানে জাতিসংঘের শান্তিরক্ষী বাহিনী পাঠিয়ে সাধারণ মানুষের জীবন ও নিরাপত্তা রক্ষার চেষ্টা করা হয়।", "বাংলাদেশ বহু বছর ধরে এই শান্তিরক্ষা মিশনে সবচেয়ে বেশি সৈন্য ও পুলিশ সদস্য পাঠানো দেশগুলোর মধ্যে নিজের জায়গা ধরে রেখেছে।", "ইউনিসেফ শিশুদের কল্যাণে, বিশ্ব স্বাস্থ্য সংস্থা রোগ প্রতিরোধে এবং ইউনেস্কো শিক্ষা ও সংস্কৃতির উন্নয়নে জাতিসংঘের ছায়াতলে কাজ করে চলেছে।", "১৯৪৮ সালে গৃহীত মানবাধিকারের সার্বজনীন ঘোষণায় বলা হয়েছে যে প্রতিটি মানুষ সমান মর্যাদা ও অধিকার নিয়ে জন্মগ্রহণ করে।", "আন্তর্জাতিক মাতৃভাষা দিবস হিসেবে একুশে ফেব্রুয়ারিকে স্বীকৃতি দিয়ে ইউনেস্কো বাঙালির ভাষা আন্দোলনের আত্মত্যাগকে সারা বিশ্বের কাছে তুলে ধরেছে।", "জাতিসংঘ দারিদ্র্য দূর করা, সবার জন্য শিক্ষা ও স্বাস্থ্য নিশ্চিত করা এবং পরিবেশ রক্ষার লক্ষ্যে সতেরোটি টেকসই উন্নয়ন লক্ষ্যমাত্রা ঠিক করেছে।", "তবে সংস্থাটির সাফল্য নির্ভর করে সদস্য দেশগুলোর সদিচ্ছা ও সহযোগিতার ওপর, কারণ শান্তি শুধু কথায় নয়, কাজের মাধ্যমে প্রতিষ্ঠা করতে হয়।"]}, {"n": "বিশ্ব অর্থনীতি ও বাণিজ্য", "s": ["আজকের পৃথিবীতে কোনো দেশই একা চলতে পারে না, কারণ প্রতিটি দেশ নিজের প্রয়োজনীয় অনেক জিনিস অন্য দেশ থেকে কিনে এবং নিজের পণ্য অন্য দেশে বিক্রি করে।", "এভাবে এক দেশের সাথে অন্য দেশের পণ্য ও সেবা কেনাবেচার ব্যবস্থাকে আন্তর্জাতিক বাণিজ্য বলা হয়, যা বিশ্ব অর্থনীতির প্রাণশক্তি হিসেবে বিবেচিত।", "সমুদ্রপথে বিশাল কনটেইনার জাহাজ প্রতিদিন হাজার হাজার টন পণ্য এক মহাদেশ থেকে অন্য মহাদেশে পৌঁছে দেয়, আর বিশ্ববাণিজ্যের বড় অংশ এই পথেই চলে।", "বাংলাদেশের রপ্তানি আয়ের সবচেয়ে বড় অংশ আসে তৈরি পোশাক শিল্প থেকে, যেখানে লক্ষ লক্ষ নারী ও পুরুষ শ্রমিক কাজ করে দেশের অর্থনীতিকে এগিয়ে নিচ্ছেন।", "প্রবাসী বাংলাদেশিরা বিদেশে কঠোর পরিশ্রম করে যে অর্থ দেশে পাঠান, তা আমাদের পরিবার ও জাতীয় অর্থনীতি দুই জায়গাতেই বড় ভূমিকা রাখে।", "বিশ্ব বাণিজ্য সংস্থা বিভিন্ন দেশের মধ্যে বাণিজ্যের নিয়ম ঠিক করে এবং কোনো বিরোধ দেখা দিলে তা মীমাংসা করার চেষ্টা করে।", "বিশ্বব্যাংক ও আন্তর্জাতিক মুদ্রা তহবিলের মতো প্রতিষ্ঠান উন্নয়নশীল দেশগুলোকে ঋণ ও পরামর্শ দিয়ে অর্থনৈতিক উন্নয়নে সহায়তা করে থাকে।", "বিভিন্ন দেশের মুদ্রার মূল্য প্রতিদিন কিছু না কিছু ওঠানামা করে, যাকে বিনিময় হার বলা হয়, আর এর প্রভাব আমদানি ও রপ্তানির ওপর সরাসরি পড়ে।", "কোনো একটি বড় দেশে অর্থনৈতিক মন্দা দেখা দিলে তার প্রভাব খুব দ্রুত অন্যান্য দেশেও ছড়িয়ে পড়ে, কারণ সব দেশের অর্থনীতি এখন একে অপরের সাথে জড়িত।", "প্রযুক্তির কল্যাণে এখন ঘরে বসেই অনলাইনে অন্য দেশের পণ্য কেনা যায়, ফলে ছোট ব্যবসায়ীরাও নিজেদের পণ্য সারা বিশ্বের ক্রেতার কাছে পৌঁছে দিতে পারছেন।", "উন্নয়নশীল দেশগুলোকে ন্যায্য বাণিজ্য সুবিধা না দিলে ধনী ও গরিব দেশের মধ্যে ব্যবধান আরও বেড়ে যাবে, তাই সবার জন্য সমান সুযোগ থাকা প্রয়োজন।", "সততা, গুণগত মান ও সময়মতো সরবরাহ নিশ্চিত করতে পারলে যেকোনো দেশ বিশ্ববাজারে নিজের একটি বিশ্বস্ত ও মর্যাদাপূর্ণ জায়গা তৈরি করে নিতে পারে।"]}, {"n": "মহাকাশ গবেষণা", "s": ["মানুষ যুগ যুগ ধরে রাতের আকাশের তারা, চাঁদ আর গ্রহের দিকে তাকিয়ে বিস্ময় অনুভব করেছে এবং জানতে চেয়েছে এই মহাবিশ্বের শুরু ও শেষ কোথায়।", "১৯৫৭ সালে সোভিয়েত ইউনিয়ন স্পুটনিক নামের কৃত্রিম উপগ্রহ মহাকাশে পাঠিয়ে মহাকাশ যুগের সূচনা করে, যা পুরো পৃথিবীকে চমকে দিয়েছিল।", "১৯৬১ সালে ইউরি গ্যাগারিন প্রথম মানুষ হিসেবে পৃথিবীর কক্ষপথ ঘুরে আসেন, আর এর আট বছর পর ১৯৬৯ সালে নীল আর্মস্ট্রং চাঁদের মাটিতে প্রথম পা রাখেন।", "আন্তর্জাতিক মহাকাশ স্টেশন পৃথিবী থেকে প্রায় চারশো কিলোমিটার ওপরে ঘুরছে, আর বিভিন্ন দেশের বিজ্ঞানীরা সেখানে একসাথে পর খেলা হয় এমন প্রতিযোগিতা হয়।", "শারীরিক প্রতিবন্ধকতা থাকা সত্ত্বেও যাঁরা অসাধারণ সাহস ও দক্ষতা দেখান, সেই খেলোয়াড়দের জন্য প্যারালিম্পিক গেমসের আয়োজন করা হয়।", "ফুটবল বিশ্বকাপ প্রতি চার বছরে একবার হয় এবং কোটি কোটি দর্শক টেলিভিশনের সামনে বসে নিজেদের প্রিয় দলের খেলা দেখার জন্য অধীর আগ্রহে অপেক্ষা করেন।", "ক্রিকেট বাংলাদেশের মানুষের কাছে একটি আবেগের নাম, আর আন্তর্জাতিক টুর্নামেন্টে আমাদের খেলোয়াড়দের জয়ে সারা দেশ আনন্দে উৎসবমুখর হয়ে ওঠে।", "একজন খেলোয়াড়কে সফল হতে হলে বছরের পর বছর কঠোর অনুশীলন, নিয়মিত খাদ্যাভ্যাস, শৃঙ্খলা এবং পরাজয় মেনে নেওয়ার মানসিক শক্তি অর্জন করতে হয়।", "খেলার মাঠে প্রতিদ্বন্দ্বী হলেও খেলা শেষে হাত মিলিয়ে একে অপরকে অভিনন্দন জানানোই হলো প্রকৃত ক্রীড়াসুলভ মনোভাব, যা আমাদের সবার শেখা উচিত।", "তরুণদের মধ্যে খেলাধুলার প্রতি আগ্রহ বাড়ালে তারা নেশা ও অপরাধ থেকে দূরে থাকে এবং সুস্থ ও সবল হয়ে দেশের গর্ব হয়ে উঠতে পারে।"]}], "en": [{"n": "United Nations and World Peace", "s": ["After the terrible destruction of the Second World War, the United Nations was founded in 1945 with the aim of protecting peace among the nations of the world.", "Its headquarters stand in New York, and today almost every recognized country in the world has joined the organization as a member state.", "The main purpose of the United Nations is to build friendly relations between countries and to settle disputes through talks instead of war and violence.", "The Security Council is an important part of the organization, with five permanent members, and the major decisions about international security are taken there.", "In the General Assembly every member country has one vote, so both small and large nations get a chance to place their opinions before the world.", "In places where war or civil conflict is going on, the United Nations sends peacekeeping forces to protect the lives and safety of ordinary people.", "For many years Bangladesh has remained among the countries that send the largest numbers of soldiers and police officers to these peacekeeping missions.", "UNICEF works for the welfare of children, the World Health Organization works to prevent disease, and UNESCO works for education and culture.", "The Universal Declaration of Human Rights, adopted in 1948, states that every human being is born with equal dignity and equal rights.", "By recognizing the twenty-first of February as International Mother Language Day, UNESCO has shown the world the sacrifice made in our language movement.", "To remove poverty, to ensure education and health for all and to protect nature, the United Nations has set seventeen sustainable development goals.", "The success of the organization depends on the goodwill and cooperation of its members, because peace is built not by words alone but by honest action."]}, {"n": "Global Economy and Trade", "s": ["In the world today no country can live entirely alone, because every nation buys many of the things it needs from others and sells its own products abroad.", "This exchange of goods and services between countries is called international trade, and it is regarded as the life force of the global economy.", "Giant container ships carry thousands of tons of goods across the oceans every day, and a large share of world trade moves along these sea routes.", "The largest part of the export income of Bangladesh comes from the ready-made garment industry, where millions of workers help to move the economy forward.", "The money that Bangladeshis living abroad send home after hard work plays an important role both for their own families and for the national economy.", "The World Trade Organization sets the rules of trade between countries and tries to settle any dispute that may arise between them.", "Institutions such as the World Bank and the International Monetary Fund help developing countries with loans and advice for their economic progress.", "The value of the currencies of different countries rises and falls from day to day, and this exchange rate directly affects both imports and exports.", "When a recession begins in one large country, its effects spread very quickly to others, because the economies of all nations are now tied together.", "Thanks to technology, people can now buy goods from other countries online while sitting at home, and small traders can reach customers around the world.", "If developing countries are not given fair trading opportunities, the gap between rich and poor nations will grow wider, so equal chances are necessary for all.", "A country that ensures honesty, good quality and delivery on time can build a reliable and respected place for itself in the global market."]}, {"n": "Space Exploration", "s": ["For thousands of years people have looked at the stars, the moon and the planets with wonder and have wanted to know where the universe began and where it ends.", "In 1957 the Soviet Union launched the artificial satellite Sputnik into orbit, which began the space age and surprised the whole world.", "In 1961 Yuri Gagarin became the first human being to circle the earth, and in 1969 Neil Armstrong became the first person to step on the surface of the moon.", "The International Space Station orbits about four hundred kilometres above the earth, and scientists from many countries live and carry out research there together.", "Because everything floats in the weightless environment of the station, even the rules for eating and sleeping are completely different from those on the earth.", "Weather forecasts, television broadcasts, mobile networks and navigation devices all work for us today with the help of artificial satellites in space.", "In 2018 Bangladesh launched the Bangabandhu Satellite and entered the list of countries that own a communications satellite of their own.", "Robotic vehicles sent to Mars are testing the soil and rocks of that planet to find out whether life may have existed there at some time in the past.", "The Hubble and James Webb space telescopes have sent back pictures of distant stars and galaxies that can never be seen from the earth with the naked eye.", "Space research costs a great deal of money and time, but it has also given us many useful technologies in medicine, communication and the making of new materials.", "In the future human beings may build permanent bases on the moon or on Mars, and scientists from different countries will need to work together on that task.", "Space teaches us that the earth is a small and precious planet in a vast universe, and that protecting it is the responsibility of all humankind."]}, {"n": "Olympics and International Sports", "s": ["Sport is not only a source of joy and entertainment, it is also a powerful way to bind people of different nations together in friendship and goodwill.", "Thousands of years ago the first Olympic Games were held in the ancient Greek city of Olympia, where athletes from many city states came to compete.", "The modern Olympic Games began again in 1896 in the Greek capital Athens, and since then this great event has been held once every four years.", "The Olympic flag carries five interlocking rings, which are used as a symbol of the coming together of people from five continents and of mutual respect.", "Lighting the Olympic flame is a special moment of the opening ceremony, and the flame travels from Olympia in Greece through many hands to the host city.", "The summer Games include athletics, swimming, gymnastics and many other sports, while the winter Games include contests that are played on ice and snow.", "The Paralympic Games are organized for athletes who show extraordinary courage and skill in spite of physical disabilities, and they inspire millions of people.", "The football World Cup takes place once every four years, and hundreds of millions of viewers wait eagerly in front of their televisions to watch their favourite teams.", "Cricket is a matter of deep emotion for the people of Bangladesh, and the whole country celebrates with joy whenever our players win in an international tourname  বিদ্যুৎ উৎপাদন করে, তবে ফার্নেস অয়েল, কয়লা, জলবিদ্যুৎ ও প্রতিবেশী দেশ থেকে আমদানি করা বিদ্যুৎও ব্যবহৃত হয়। গত দুই দশকে বিদ্যুৎ খাত ব্যাপকভাবে সম্প্রসারিত হয়েছে এবং দেশের প্রায় সব ঘরেই এখন বিদ্যুৎ সংযোগ রয়েছে। নির্ভরযোগ্য সরবরাহের জন্য জ্বালানির ধারাবাহিক জোগান প্রয়োজন, কিন্তু আমদানি ব্যয় বেড়ে গেলে আর্থিক চাপ সৃষ্টি হয়। ভবিষ্যতের চাহিদা টেকসইভাবে মেটাতে দেশে সূর্যের আলো ও বাতাসের শক্তির মতো নবায়নযোগ্য জ্বালানিকে উৎসাহিত করা হচ্ছে। প্রত্যন্ত গ্রামের লক্ষ লক্ষ পরিবার সোলার হোম সিস্টেম বসিয়েছে, যা জাতীয় গ্রিডের সংযোগ ছাড়াই আলো, পাখা ও মোবাইল চার্জের সুবিধা দেয়। ছাদের ওপর, সেচ পাম্পে এবং কারখানায়ও সোলার প্যানেল বসানো হচ্ছে। জ্বালানি সাশ্রয়ও সমান গুরুত্বপূর্ণ। অপ্রয়োজনীয় বাতি বন্ধ রাখা, এলইডি বাল্ব ব্যবহার, কম বিদ্যুৎ খরচের যন্ত্র বাছাই এবং ব্যস্ত সময়ে অপচয় এড়ানো বিলের খরচ ও দূষণ কমাতে পারে। বিদ্যুতের অপচয় রোধে ঘর থেকেই সচেতনতা শুরু করা যায়, যেমন ফ্রিজের দরজা অকারণে খোলা না রাখা এবং এসির তাপমাত্রা ২৫ ডিগ্রির ওপরে রাখা। ভবিষ্যতে বর্জ্য থেকে বিদ্যুৎ ও জৈব গ্যাসের মতো উদ্ভাবনী পদ্ধতিও জ্বালানি সংকট মোকাবিলায় সহায়ক হতে পারে। সুচিন্তিত পরিকল্পনা, আধুনিক প্রযুক্তি ও জনসচেতনতা আগামী ৫০ বছরের জন্য পরিষ্কার, সাশ্রয়ী ও নির্ভরযোগ্য বিদ্যুৎ নিশ্চিত করতে সহায়তা করবে।"}, {"n": "নারীর ক্ষমতায়ন", "x": "নারীর ক্ষমতায়ন বলতে নারীকে জ্ঞান, আত্মবিশ্বাস ও সুযোগ দেওয়া বোঝায়, যাতে সে নিজের জীবনের সিদ্ধান্ত নিতে পারে এবং সমাজের সব কাজে পূর্ণ অংশগ্রহণ করতে পারে। অতীতে দক্ষিণ এশিয়ার বহু মেয়ে শিক্ষা থেকে বঞ্চিত হতো এবং খুব অল্প বয়সে তাদের বিয়ে দেওয়া হতো। বেগম রোকেয়া ও সুফিয়া কামালের মতো অগ্রদূতেরা এই বৈষম্যের বিরুদ্ধে লড়াই করেছেন এবং মেয়েদের পড়াশোনায় উৎসাহিত করেছেন। সাম্প্রতিক কয়েক দশকে বাংলাদেশ উল্লেখযোগ্য অগ্রগতি অর্জন করেছে। উপবৃত্তি কর্মসূচি মেয়েদের স্কুলে ধরে রাখতে সাহায্য করেছে, আর মাধ্যমিক পর্যায়ে ছাত্রীর সংখ্যা এখন ছাত্রের চেয়ে বেশি। লক্ষ লক্ষ নারী তৈরি পোশাক শিল্পে কাজ করছেন, এবং আরও অনেকে শিক্ষক, চিকিৎসক, ইঞ্জিনিয়ার, পুলিশ কর্মকর্তা, পাইলট ও উদ্যোক্তা হয়ে উঠেছেন। ক্ষুদ্রঋণ ও ছোট ব্যবসার ঋণ গ্রামের নারীদের হাঁস-মুরগির খামার, দর্জির দোকান ও হস্তশিল্পের উদ্যোগ গড়তে সহায়তা করেছে। নারীরা স্থানীয় সরকার ও জাতীয় সংসদেও দায়িত্ব পালন করছেন, এবং দেশে নারী প্রধানমন্ত্রীর নেতৃত্বও দেখা গেছে। তবু বাল্যবিবাহ, সহিংসতা, মজুরির বৈষম্য এবং রাস্তাঘাটে সীমিত নিরাপত্তার মতো চ্যালেঞ্জ এখনও রয়ে গেছে। শিক্ষা, স্বাস্থ্য ও আয়ের সুযোগ বাড়লে শুধু নারী নয়, পুরো পরিবার ও সমাজ উপকৃত হয়। পরিবার ও সমাজের মানসিকতার পরিবর্তনও এই যাত্রায় সমান জরুরি, কারণ আইন ও নীতির পাশাপাশি দৃষ্টিভঙ্গির পরিবর্তন ছাড়া স্থায়ী উন্নয়ন সম্ভব নয়। প্রতি বছর ৮ই মার্চ আন্তর্জাতিক নারী দিবস আমাদের মনে করিয়ে দেয় যে নারী ও পুরুষ সমান মর্যাদায় পাশাপাশি হাঁটলেই একটি ন্যায্য সমাজ গড়ে ওঠে।"}, {"n": "পর্যটন ও ঐতিহ্য", "x": "পর্যটন একটি দেশকে বৈদেশিক মুদ্রা আয়, নতুন কর্মসংস্থান ও বিশ্বের কাছে নিজের সংস্কৃতি তুলে ধরার সুযোগ দেয়। বাংলাদেশে দর্শনার্থীদের জন্য রয়েছে দীর্ঘ বালুকাময় সৈকত থেকে শুরু করে সবুজ পাহাড় ও প্রাচীন প্রত্নতাত্ত্বিক নিদর্শন। কক্সবাজারের সমুদ্রসৈকত প্রায় ১২০ কিলোমিটার দীর্ঘ এবং এটিকে বিশ্বের দীর্ঘতম প্রাকৃতিক সৈকতগুলোর একটি হিসেবে গণ্য করা হয়। সুন্দরবন পৃথিবীর বৃহত্তম ম্যানগ্রোভ বন, যা ১৯৯৭ সালে ইউনেস্কোর বিশ্ব ঐতিহ্যের তালিকায় স্থান পায় এবং রয়েল বেঙ্গল টাইগারের আবাসস্থল। বাগেরহাটের ষাটগম্বুজ মসজিদ ও পাহাড়পুরের সোমপুর মহাবিহার ১৯৮৫ সালে বিশ্ব ঐতিহ্যের মর্যাদা পায়। সেন্টমার্টিন দ্বীপ দেশের একমাত্র প্রবালদ্বীপ, আর সিলেট ও শ্রীমঙ্গলের চা বাগান, রাঙামাটির কাপ্তাই হ্রদ এবং ঢাকার লালবাগ কেল্লা পর্যটকদের কাছে বিশেষ আকর্ষণীয়। দায়িত্বশীল পর্যটনের জন্য আমাদের কিছু নিয়ম মেনে চলা জরুরি, যেমন প্লাস্টিক বর্জন, স্থানীয় মানুষের প্রতি শ্রদ্ধা এবং প্রাকৃতিক ও ঐতিহাসিক স্থানের সংরক্ষণ। শীতকালে অতিথি পাখির আগমন, বর্ষায় হাওরের অপরূপ জলরাশি এবং শরতের কাশফুল গ্রামবাংলার নিজস্ব রূপকে আরও বাড়িয়ে তোলে। পর্যটকদের জন্য নিরাপদ আবাসন, ভালো রাস্তা, সঠিক তথ্য ও পরিচ্ছন্ন পরিবেশ নিশ্চিত করা গেলে দেশের পর্যটন খাত আরও এগিয়ে যাবে। স্থানীয় হস্তশিল্প, লোকজ খাবার ও কুটিরশিল্প পর্যটকদের কাছে তুলে ধরলে গ্রামীণ মানুষের আয়ও বাড়ে। এভাবে আজকের ভ্রমণ আগামী প্রজন্মের জন্যও এই সম্পদগুলো টিকিয়ে রাখবে।"}], "en": [{"n": "Language Movement and Mother Tongue", "x": "After the partition of British India in 1947, the rulers of Pakistan proposed Urdu as the only state language of the new country, even though most of its citizens spoke Bengali. People in East Bengal strongly objected, and students, teachers, writers and cultural workers began to organise meetings and processions in support of their mother tongue. On 21 February 1952, a large crowd of students gathered near the University of Dhaka to defy a ban on public assemblies. The police opened fire, and Rafiq, Salam, Barkat, Jabbar and several others lost their lives. Such a sacrifice for the sake of a language is rare in world history. The movement continued, and in 1956 Bengali received recognition as a state language of Pakistan. The Central Shaheed Minar in Dhaka was built to honour the martyrs, and every year thousands of people walk there barefoot at dawn to lay flowers. On 17 November 1999, UNESCO declared 21 February as International Mother Language Day, and since 2000 the day has been observed in many countries around the world. This recognition reminds everyone that every language carries a unique culture, a shared memory and a sense of identity. Of the roughly 7000 languages spoken today, many are in danger of disappearing. The Shaheed Minar has since become a symbol of resistance and cultural pride for Bengali speakers everywhere, and in February the whole nation remembers the martyrs with songs, poems and book fairs. Learning to speak, read and write our own language correctly is therefore a duty as well as a joy, because a language survives only when each new generation uses it with confidence and care. Protecting linguistic diversity helps communities preserve their traditions, and it encourages mutual respect among people who speak different languages."}, {"n": "Liberation War and Independence", "x": "The Liberation War of Bangladesh began in the final days of March 1971, and the independence of the country was declared on 26 March. Over the next nine months, people from every walk of life took part in the struggle, including farmers, workers, students, teachers and professionals. Members of the Mukti Bahini fought bravely with limited weapons and used guerrilla tactics to challenge a much better equipped army. Nearly ten million people crossed the border and took shelter as refugees in neighbouring India, where they depended on relief from local communities and international organisations. Many families suffered terrible losses, and countless homes, schools and villages were destroyed. Women also played an important part, caring for the wounded, sheltering fighters and supporting the movement in many courageous ways. Friends abroad, including journalists, artists and ordinary citizens, helped to build international opinion in favour of Bangladesh. The war ended on 16 December 1971, when the Pakistani forces surrendered in Dhaka and a new, sovereign nation was born. Every year, 26 March is celebrated as Independence Day and 16 December as Victory Day, with parades, wreath laying and cultural programmes. Memorials, museums and libraries preserve the stories of those years, and veterans often visit schools to share their memories with children. Young people should study this history with an open mind, because a clear understanding of the sacrifices of 1971 teaches responsibility, courage and respect for the freedom that the country now enjoys. The spirit of the war, which values justice, equality and human dignity, continues to guide the nation as it builds its future and remembers its past with gratitude."}, {"n": "Democracy and Good Governance", "x": "Democracy is a system of government in which the people are the source of power. Citizens choose their representatives through free and fair elections, and those representatives make laws and decisions on behalf of the public. Freedom of expression, the rule of law and an independent judiciary are essential parts of a healthy democracy. Good governance goes hand in hand with democracy, and its main features are transparency, accountability, participation and fairness. When public officials explain their decisions openly and answer for their actions, citizens develop trust in institutions. The Constitution of Bangladesh was adopted on 4 November 1972 and came into effect on 16 December of that year. It guarantees rights such as equality before the law, freedom of religion and protection of life and liberty. A strong parliament, an honest administration and a responsible press help to prevent the misuse of power and corruption. Citizens also have duties, including voting wisely, paying taxes, obeying the law and respecting the opinions of others. Many countries around the world face difficult questions about how to protect democratic values, so open information, local participation and inclusive decision making are more important than ever. Local government bodies such as union councils and municipalities bring decision making closer to ordinary people, while digital services and right to information laws make it easier to check how public money is spent. When citizens, the media and civil society organisations work together, public offices tend to become more efficient, more honest and more responsive to genuine needs. A democratic culture grows slowly through education, tolerance and the patient practice of dialogue, and it needs the continuous care of every generation."}, {"n": "Disaster Management", "x": "Bangladesh lies on the delta of three great rivers and faces the Bay of Bengal, so it is one of the most disaster prone countries in the world. Floods, cyclones, storm surges, riverbank erosion, droughts and earthquakes threaten the lives and livelihoods of millions of people. The Bhola cyclone of 1970 caused terrible losses, and later storms such as the cyclone of 1991 and Cyclone Sidr in 2007 also brought heavy destruction. Over the years the country has learned many lessons and built an effective system of preparedness. Meteorologists issue warning signals in advance, and trained volunteers of the Cyclone Preparedness Programme spread the message to coastal villages by using megaphones, flags and mobile phones. Thousands of cyclone shelters, embankments and raised tube wells now protect people and their cattle. Because of these steps, the number of deaths from major cyclones has fallen sharply. During a flood, families should move to higher ground, drink only boiled or purified water and keep emergency medicine and dry food ready. Disaster management has four stages, namely prevention, preparedness, response and recovery. Communities, local governments, schools and volunteer organisations all play a part. Schools also teach children how to react during emergencies, and regular drills show students how to reach a safe place quickly. Early warning by text message, radio and television now reaches many remote areas within minutes. A warning is useful only when people understand it and trust it, so clear language and local volunteers are essential. Climate change is increasing the intensity of extreme weather, so continuous research, early warning and community training remain extremely important for a safe future."}, {"n": "Banking and Financial Services", "x": "Banks play a vital role in the economy of every country because they collect savings from people and lend that money to those who want to start or expand a business. Bangladesh Bank, established in 1972, is the central bank of the country and supervises all other banks. It controls the money supply, manages foreign exchange reserves and works to keep prices stable. In recent years, financial services have changed rapidly with the spread of technology. Mobile financial services, which began in 2011 with bKash, now allow millions of people to send money, pay bills, buy goods and receive salaries through a simple phone. Agent banking brings basic services to remote villages where there is no branch, and internet banking lets customers check their accounts and transfer funds at any hour. Along with these conveniences come new risks, such as fraud and cyber crime. Customers should never share their PIN, password or one time code, which is usually 6 digits long, with anyone. They should also check every message carefully before clicking a link. Before taking a loan, a borrower should understand the instalment, the duration and the rate of interest, because late payment can bring extra charges. Businesses, too, rely on a sound banking system, because trade finance, salary payments and international transfers all pass through banks. Digital wallets, QR code payments and online shopping have increased the speed of daily transactions, but each user must keep the phone locked, update the apps regularly and report any suspicious activity to the bank immediately. Saving regularly, borrowing wisely and understanding interest rates are habits that help families to build a secure financial future."}, {"n": "Transport and Communication", "x": "A modern transport network connects people, markets and ideas, and it supports the economic growth of a nation. In Bangladesh, roads, railways, rivers and airways each carry an important share of passengers and goods. The Padma Multipurpose Bridge, opened to traffic on 25 June 2022, is about 6.15 kilometres long and links the south western region with the capital by road. The Dhaka Metro Rail began its journey in December 2022 and has started to ease the heavy traffic of the city. The Bangabandhu Tunnel beneath the Karnaphuli River, opened in October 2023, is the first underwater road tunnel in South Asia. The country also has a long railway network, many inland river ports and busy seaports at Chattogram and Mongla. Hazrat Shahjalal International Airport in Dhaka serves millions of travellers each year. However, road accidents, traffic congestion and unplanned construction remain serious problems. Wearing helmets and seat belts, obeying speed limits and avoiding phone calls while driving can save many lives. Strict traffic rules, public transport, safe footpaths and careful planning can reduce these difficulties. Rivers have carried goods in Bengal for centuries, and launches and cargo vessels still move millions of tonnes every year at low cost. Railways offer comfortable and safe travel at a modest fare, so more investment in new tracks, modern coaches and signals would bring great benefit to passengers and traders alike. Good communication is also supported by broadband internet and mobile networks, which allow people in distant places to remain in contact with each other every day."}, {"n": "Literature and Culture", "x": "Bengali literature has a long and rich history that stretches back more than a thousand years. The Charyapada, a collection of mystic songs composed between the tenth and twelfth centuries, is regarded as the earliest example of the Bengali language. Medieval poets wrote devotional verses, and later writers developed prose, novels and drama. Rabindranath Tagore became the first Asian to receive the Nobel Prize in Literature in 1913. Kazi Nazrul Islam, known as the rebel poet, filled his poems and songs with courage and a love of humanity, and he is honoured as the national poet of Bangladesh. Begum Rokeya wrote a pioneering story in 1905 that imagined a society led by women, and she spoke up for the education of girls. Jibanananda Das described the gentle beauty of rural Bengal with unforgettable images. Our culture is also expressed in folk songs, baul music, jatra, pottery and the delicate weaving of jamdani cloth. UNESCO has recognised baul songs and jamdani weaving as part of the intangible cultural heritage of humanity. Pohela Boishakh, the first day of the Bengali year, is celebrated with colourful processions, fairs and traditional food. The annual book fair held in Dhaka every February is another beloved festival, where millions of readers meet writers and publishers. Reading habits formed in childhood can last for a lifetime, so parents and teachers should encourage children to borrow books from libraries and to write stories, poems and diaries of their own. These treasures give us a sense of identity, and each generation has a responsibility to study, enjoy and pass them on with care."}, {"n": "Energy and Electricity", "x": "Energy is the lifeblood of modern society, because homes, factories, hospitals, schools and farms all depend on it. Bangladesh produces electricity mainly from natural gas, but it also uses furnace oil, coal, hydropower and imported electricity from neighbouring countries. Over the past two decades, the power sector has expanded greatly, and almost every home in the country now has an electricity connection. Reliable supply, however, depends on a steady flow of fuel, and rising import costs create financial pressure. To meet future demand in a sustainable way, the country is promoting renewable energy such as solar and wind power. Millions of households in remote villages have installed solar home systems, which provide light, fan power and mobile phone charging without any link to the national grid. Solar panels are also being fixed on rooftops, irrigation pumps and factories. Saving energy is equally important. Switching off unnecessary lights, using LED bulbs, choosing efficient appliances and keeping the air conditioner at 25 degrees or higher can lower bills and reduce pollution. New ideas such as producing power from waste and biogas may also help to ease fuel shortages. Industry consumes a large share of the energy produced, so factories that install efficient boilers, motors and lighting can cut their costs and also protect the environment. In the long run, regional cooperation in power trading and the use of cleaner fuels may help the country to build a secure and balanced energy system for everyone. Careful planning, modern technology and public awareness will help the nation to produce clean, affordable and dependable power for the next 50 years."}, {"n": "Women's Empowerment", "x": "Women's empowerment means giving women the knowledge, confidence and opportunity to take decisions about their own lives and to participate fully in society. In the past, many girls in South Asia were denied schooling and married very young. Pioneers such as Begum Rokeya and Sufia Kamal fought against such discrimination and encouraged girls to study. In recent decades, Bangladesh has made remarkable progress. Stipend programmes have helped girls to remain in school, and the number of girls in secondary education is now higher than that of boys. Millions of women work in the garment industry, and many others have become teachers, doctors, engineers, police officers, pilots and entrepreneurs. Microcredit and small business loans have helped rural women to start poultry farms, tailoring shops and handicraft enterprises. Women also serve in local government and in parliament, and the country has had women prime ministers. Still, challenges such as early marriage, violence, unequal pay and limited safety on the streets remain. When women gain access to education, healthcare and income, the whole family and society benefit. Changes in law and policy are important, but attitudes in families and communities must change as well. Fathers, brothers, teachers and community leaders can help by supporting girls to continue their studies and by sharing household responsibilities fairly. Real progress happens when respect for women becomes a natural habit of daily life. Every year on 8 March, the world observes International Women's Day, which reminds us that a fair society grows when men and women walk side by side with equal respect."}, {"n": "Tourism and Heritage", "x": "Tourism helps a country to earn foreign currency, create jobs and introduce its culture to the world. Bangladesh has many attractions for visitors, from long sandy beaches to green hills and ancient ruins. The sea beach at Cox's Bazar stretches for about 120 kilometres and is considered one of the longest natural beaches in the world. The Sundarbans, the largest mangrove forest on Earth, was listed as a UNESCO World Heritage Site in 1997, and it is the home of the Royal Bengal tiger. The Sixty Dome Mosque in Bagerhat and the Somapura Mahavihara at Paharpur were both given the same honour in 1985. Saint Martin's Island is the only coral island of the country, while the tea gardens of Sylhet and Srimangal, the Kaptai Lake in Rangamati and the Lalbagh Fort in Dhaka attract thousands of travellers. In winter, migratory birds arrive in the wetlands, in the monsoon the haor region turns into a vast sheet of water, and in autumn white kash flowers decorate the countryside. Responsible tourism requires some simple habits, such as avoiding plastic, respecting local people and protecting natural and historic places. Local handicrafts, traditional foods and cottage industries offer visitors a taste of village life, and they bring extra income to rural families. Tour guides, boat operators, hotel workers and small shopkeepers all gain when travellers return home with happy memories and recommend the country to their friends. With safe accommodation, good roads and accurate information, the tourism sector can grow and help future generations to enjoy the same treasures."}]};

 যার একটি বড় অংশ সাগর ও নদীর মোহনা থেকে আহরিত হয়, আর লক্ষ লক্ষ জেলে এই পেশার ওপর নির্ভর করে জীবিকা নির্বাহ করেন। চট্টগ্রাম, মোংলা ও পায়রা বন্দর দিয়ে দেশের আমদানি ও রপ্তানির বিপুল পণ্য আসা যাওয়া করে। কক্সবাজারের উপকূলে লবণ চাষ ও শুঁটকি তৈরি হাজারো মানুষকে কর্মসংস্থান দিয়েছে। তবে অতিরিক্ত মাছ ধরা, প্লাস্টিক বর্জ্য, তেল দূষণ ও জলবায়ু পরিবর্তনের কারণে সাগরের জীববৈচিত্র্য হুমকির মুখে পড়ছে। তাই প্রজননকালে মাছ ধরা বন্ধ রাখা, জালের আকার নিয়ন্ত্রণ করা এবং সাগরে বর্জ্য ফেলা বন্ধ করার মতো নিয়ম কঠোরভাবে মানা জরুরি। উপকূলের ম্যানগ্রোভ বন সাগরের জোয়ার ও ঝড়ের আঘাত থেকে মানুষকে রক্ষা করে এবং মাছের প্রজননক্ষেত্র হিসেবেও কাজ করে, তাই এই বন রক্ষা করা সমান জরুরি। সমুদ্রের সম্পদ নিয়ে গবেষণার জন্য দক্ষ জনশক্তি, আধুনিক জাহাজ ও নতুন প্রযুক্তিও দরকার। যদি আমরা পরিকল্পিতভাবে এগোই, তবে নীল অর্থনীতি আগামী দিনে দেশের উন্নয়নের নতুন দরজা খুলে দিতে পারে।"}, {"n": "সময়ানুবর্তিতা ও শৃঙ্খলা", "x": "সময় এমন এক সম্পদ, যা একবার চলে গেলে আর কখনো ফিরে আসে না। তাই যিনি সময়ের মূল্য বোঝেন, তিনিই জীবনে সবচেয়ে বেশি সফল হন। সময়ানুবর্তিতা মানে প্রতিটি কাজ নির্দিষ্ট সময়ে শুরু করা এবং নির্দিষ্ট সময়ের মধ্যে শেষ করা। একজন শিক্ষার্থী যদি প্রতিদিন নিয়ম করে ঘুম থেকে ওঠে, সময়মতো বিদ্যালয়ে যায় এবং পড়ার জন্য নির্দিষ্ট সময় রাখে, তবে পরীক্ষার আগে তাকে বাড়তি দুশ্চিন্তা করতে হয় না। অফিসের ক্ষেত্রেও একই কথা প্রযোজ্য, কারণ দেরিতে আসা কর্মচারী নিজের কাজের পাশাপাশি সহকর্মীদের কাজেও বাধা সৃষ্টি করে। শৃঙ্খলা বলতে বোঝায় নিয়ম মেনে চলা, নিজের আচরণ নিয়ন্ত্রণে রাখা এবং অন্যের অধিকারকে সম্মান করা। যে সমাজে মানুষ লাইন ধরে দাঁড়ায়, রাস্তার নিয়ম মানে এবং প্রতিশ্রুতি রক্ষা করে, সেখানে অনেক ঝামেলা আপনা থেকেই কমে যায়। সময়ের সঠিক ব্যবহারের জন্য প্রতিদিন সকালে দিনের কাজের একটি তালিকা তৈরি করা এবং জরুরি কাজগুলো আগে সম্পন্ন করা একটি ভালো অভ্যাস। অযথা মোবাইল ফোনে সময় নষ্ট করা, কাজ ফেলে রাখা এবং শেষ মুহূর্তের জন্য অপেক্ষা করা সাফল্যের বড় শত্রু। পরীক্ষার হলে দেখা যায়, যিনি অনুশীলনের সময় ঘড়ি ধরে কাজ করেছেন, তিনি নির্দিষ্ট সময়ের মধ্যে কাজ শেষ করতে অনেক বেশি স্বচ্ছন্দ বোধ করেন। তাই টাইপিংয়ের অনুশীলনেও সময় ধরে চর্চা করা বিশেষ উপকারী। সময়ের কাজ সময়ে না করলে পরে তা দ্বিগুণ কষ্টের কারণ হয়ে দাঁড়ায়। ছোটবেলা থেকেই পরিবার ও বিদ্যালয়ে এই গুণগুলো শেখানো উচিত, কারণ শৈশবে গড়ে ওঠা অভ্যাস সাধারণত সারা জীবন থেকে যায়। যারা নিয়মিত ও সময়নিষ্ঠ হয়, তারাই ভবিষ্যতে দায়িত্বশীল নাগরিক হয়ে দেশের উন্নয়নে অবদান রাখতে পারে।"}, {"n": "স্বেচ্ছাসেবা ও সমাজসেবা", "x": "অন্যের বিপদে এগিয়ে আসা এবং কোনো বিনিময়ের আশা না করে মানুষের উপকার করাই হলো স্বেচ্ছাসেবা। আমাদের সমাজে এর ঐতিহ্য অনেক পুরোনো, কারণ আগে গ্রামে কারও ঘর পুড়ে গেলে বা বন্যায় ক্ষতি হলে প্রতিবেশীরা নিজেরাই সাহায্য নিয়ে এগিয়ে আসত। আজকের দিনেও এই চেতনা সমানভাবে বেঁচে আছে। বন্যা, ঘূর্ণিঝড় বা আগুনের মতো দুর্যোগে তরুণ স্বেচ্ছাসেবকেরা খাবার, কাপড় ও ওষুধ নিয়ে ছুটে যায়। রেড ক্রিসেন্ট সোসাইটি, বিভিন্ন ছাত্র সংগঠন ও স্থানীয় ক্লাব রক্তদান শিবির, বৃক্ষরোপণ, শীতবস্ত্র বিতরণ এবং বিনামূল্যে চিকিৎসা শিবিরের আয়োজন করে থাকে। রক্তদান একটি মহৎ কাজ, কারণ একজন সুস্থ মানুষের দেওয়া এক ব্যাগ রক্তে একটি জীবন বাঁচতে পারে। সমাজসেবা শুধু টাকা দিয়ে নয়, সময়, শ্রম ও জ্ঞান দিয়েও করা যায়, যেমন নিরক্ষর মানুষকে পড়তে শেখানো, বৃদ্ধদের সঙ্গ দেওয়া কিংবা পাড়ার রাস্তা পরিষ্কার রাখা। গ্রামে ও শহরে অনেক তরুণ নিজেদের উদ্যোগে বই পড়ার আসর, বিনামূল্যে পাঠদান কেন্দ্র এবং পরিচ্ছন্নতা অভিযান পরিচালনা করছে, যা অন্যদের জন্যও অনুপ্রেরণার উৎস। ছোট ছোট উদ্যোগ থেকেই বড় পরিবর্তনের সূচনা হয়। এতে সেবাদাতার মনেও আত্মতৃপ্তি ও দায়িত্ববোধ জন্মায়। স্বেচ্ছাসেবার মাধ্যমে তরুণেরা নেতৃত্ব, দলগত কাজ ও সহমর্মিতার মতো গুণ অর্জন করে, যা তাদের ভবিষ্যৎ জীবনে খুব কাজে লাগে। তবে সেবার নামে প্রচারের লোভ বা অপব্যবহার কখনোই কাম্য নয়, বরং আন্তরিকতা ও স্বচ্ছতাই প্রকৃত সেবার পরিচয়। প্রত্যেক নাগরিক যদি নিজের সাধ্যমতো সমাজের জন্য কিছু করে, তবে একটি সুন্দর ও মানবিক সমাজ গড়ে ওঠা সম্ভব।"}, {"n": "যুবসমাজ ও কর্মসংস্থান", "x": "একটি দেশের সবচেয়ে বড় শক্তি তার তরুণ সমাজ। বাংলাদেশের জনসংখ্যার একটি বড় অংশ তরুণ, যা আমাদের জন্য এক বিরাট সুযোগ, তবে এই সুযোগকে কাজে লাগাতে হলে সবার জন্য উপযুক্ত শিক্ষা ও কাজের ব্যবস্থা থাকা দরকার। প্রতিবছর লক্ষ লক্ষ শিক্ষার্থী পড়াশোনা শেষ করে চাকরির বাজারে প্রবেশ করে, কিন্তু সরকারি ও বেসরকারি খাতে সবার জন্য পর্যাপ্ত পদ থাকে না। ফলে অনেক শিক্ষিত তরুণ বেকারত্বের হতাশায় ভোগে। এই সমস্যা সমাধানে কারিগরি ও বৃত্তিমূলক শিক্ষার প্রসার খুবই জরুরি, কারণ হাতে কলমে দক্ষতা অর্জন করলে কাজ পাওয়া সহজ হয়। কম্পিউটার চালনা, ডিজিটাল মার্কেটিং, গ্রাফিক ডিজাইন ও প্রোগ্রামিংয়ের মতো দক্ষতা কাজে লাগিয়ে অনেকে ঘরে বসেই ফ্রিল্যান্সিং করে বিদেশি ক্রেতাদের কাছ থেকে আয় করছে। সরকারি চাকরির পাশাপাশি নিজে উদ্যোক্তা হয়ে ছোট ব্যবসা শুরু করাও একটি সম্ভাবনাময় পথ। এতে নিজের কর্মসংস্থান হয় এবং অন্যদের জন্যও কাজের সুযোগ তৈরি হয়। ঋণ ও প্রশিক্ষণ পেলে গ্রামের তরুণেরাও কৃষি, মাছ চাষ ও হস্তশিল্পের মতো খাতে আধুনিক পদ্ধতিতে কাজ করে ভালো আয় করতে পারে। বিদেশে দক্ষ কর্মী হিসেবে কাজ করতে যাওয়াও অনেক তরুণের জন্য আয়ের একটি বড় পথ, তবে এজন্য ভাষা ও পেশাগত প্রশিক্ষণ আগে থেকেই নিতে হয়। তবে ভালো চাকরি পেতে হলে সৎ ও পরিশ্রমী হওয়ার পাশাপাশি যোগাযোগের দক্ষতা, নতুন ভাষা শেখা এবং সময়ের সঙ্গে নিজেকে বদলে নেওয়ার মানসিকতা থাকা প্রয়োজন। নেশা ও অসৎ সঙ্গ থেকে দূরে থেকে নিজেকে গড়ে তুললে তরুণেরাই হবে আগামী দিনের সুযোগ্য নেতৃত্ব এবং দেশের উন্নয়নের প্রধান চালিকাশক্তি।"}], "en": [{"n": "Urbanisation and City Life", "x": "Urbanisation is the process by which more and more people move from villages to cities and the built up area of towns keeps growing. In Bangladesh the urban population has risen rapidly over the last few decades. Every day many people leave their villages in search of jobs, better schools, advanced medical care and a modern way of life. Dhaka is one of the most crowded cities in the world, and millions of people live within its limits. This huge pressure has strained housing, drinking water, electricity, gas and sewerage services. Traffic jams, air pollution, noise and piles of rubbish make daily life difficult for city dwellers. Many families are forced to live in slums, where clean water and health care are very limited. Yet a city is not only a place of problems, because it is also an engine of the economy, and most factories, banks, businesses and service industries are based in urban areas. Planned urbanisation needs careful thought, wide roads, enough parks and playgrounds, reliable public transport and an effective system for managing waste. If small towns and satellite cities are developed near the villages, people can find work close to home and the burden on the capital will become lighter. Citizens also have duties, such as not throwing litter on the streets, planting trees, driving according to the rules and showing kindness to their neighbours. Modern cities around the world are now building cycle lanes, rooftop gardens and green buildings to make life easier and cleaner. When government, planners and residents work together, a city can become a safe, green and pleasant home for everyone."}, {"n": "Sea and Blue Economy", "x": "The Bay of Bengal lies to the south of Bangladesh and holds a vast treasure of resources. After the settlement of the maritime boundary disputes with Myanmar in 2012 and with India in 2014, Bangladesh gained rights over about 118 thousand square kilometres of sea area. The blue economy means using the resources of seas and oceans in a sustainable way to promote economic growth. It includes fishing, sea food farming, shipping, port management, salt production, coastal tourism and the search for minerals and energy beneath the seabed. The hilsa is our national fish, and a large share of it comes from the sea and the river mouths, while millions of fishermen depend on this trade for their living. The ports of Chattogram, Mongla and Payra handle a huge amount of imports and exports for the country. Along the coast of Cox's Bazar, salt farming and the drying of fish give work to thousands of families. However, overfishing, plastic waste, oil pollution and climate change are putting the marine life of the sea at risk. For this reason, rules such as stopping fishing during the breeding season, controlling the size of fishing nets and banning the dumping of waste at sea must be followed strictly. Mangrove forests along the coast protect people from tides and storms and also serve as breeding grounds for fish, so protecting them is just as important. Research on marine resources also needs skilled people, modern research vessels and new technology. If we move ahead with careful planning and respect for nature, the blue economy can open a new door of development for the nation in the coming years."}, {"n": "Punctuality and Discipline", "x": "Time is a resource that can never come back once it has gone. A person who understands the value of time is therefore the one who succeeds most in life. Punctuality means beginning every task at the proper time and finishing it within the given period. If a student wakes up at a fixed hour, reaches school on time and keeps a regular hour for study, there is no need for extra worry before an examination. The same is true in an office, because an employee who arrives late disturbs not only personal work but also the work of colleagues. Discipline means following rules, keeping our behaviour under control and respecting the rights of others. In a society where people stand in line, obey traffic rules and keep their promises, many troubles disappear by themselves. To use time wisely, it is a good habit to make a list of tasks each morning and to finish the most important ones first. Wasting hours on a mobile phone, leaving work undone and waiting for the last minute are the great enemies of success. Parents and teachers should teach these habits to children from an early age, since habits formed in childhood usually stay for life. In an examination hall, a person who has practised with a clock usually feels far more comfortable finishing the work within the given time, so even typing practice should be done against the clock. Many great people of the world, including scientists, writers and leaders, were known for their strict routine and their respect for time. Those who are regular and punctual become responsible citizens, and they can contribute greatly to the progress of their country."}, {"n": "Volunteering and Social Service", "x": "Volunteering means coming forward to help others in trouble without expecting anything in return. This tradition is very old in our society, because in the past, when a house caught fire or a flood caused damage in a village, the neighbours would gather by themselves to give help. The same spirit is still alive today. During floods, cyclones or fires, young volunteers rush to the spot with food, clothes and medicine. The Red Crescent Society, various student organisations and local clubs arrange blood donation camps, tree planting, distribution of winter clothes and free medical camps. Giving blood is a noble act, because one bag of blood from a healthy person can help to save a life. Social service is not only done with money, for it can also be done with time, labour and knowledge, such as teaching an illiterate person to read, keeping company with elderly people or keeping the lanes of a neighbourhood clean. The helper also gains a sense of satisfaction and responsibility from such work. Through volunteering, young people develop leadership, teamwork and kindness, which are very useful in their future careers. However, seeking fame or misusing donations in the name of service is never acceptable, and honesty and transparency are the true marks of real service. A school or a college can encourage students to join clubs, scouts and community projects, so that they learn to care for others from an early age. Even a small act, such as helping a neighbour carry water or reading a letter for an elderly person, can bring real comfort to someone in need. If every citizen does something for society according to his or her ability, a beautiful and humane society can be built."}, {"n": "Youth and Employment", "x": "The greatest strength of a country is its young people. A large part of the population of Bangladesh is young, which is a great opportunity for us, but to make use of it everyone needs proper education and work. Every year hundreds of thousands of students finish their studies and enter the job market, yet there are not enough posts in the government and private sectors for all of them. As a result many educated young people suffer from the disappointment of unemployment. To solve this problem, technical and vocational education must be expanded, because a person who learns skills by practical training can find work more easily. Using skills such as computer operation, digital marketing, graphic design and programming, many youths now work from home as freelancers and earn money from foreign clients. Besides applying for government jobs, starting a small business as an entrepreneur is another promising path. It creates work for the person and also opens opportunities for others. To get a good job, one must be honest and hardworking, and also needs communication skills, the habit of learning new languages and the willingness to change with the times. Training centres, career counselling and loans for young entrepreneurs can give real support to those who wish to stand on their own feet. Rural youths can also gain a good income from farming, fish culture and handicrafts if they receive loans and modern training. By keeping away from drugs and bad company and by building themselves with patience, the young generation can become the able leaders of tomorrow and the main driving force of national development."}]};

const T5={"bn": [{"n": "তৈরি পোশাকশিল্প ও শিল্পায়ন", "x": "তৈরি পোশাকশিল্প বাংলাদেশের অর্থনীতির সবচেয়ে বড় চালিকাশক্তি। আশির দশকে ছোট পরিসরে শুরু হওয়া এই খাত আজ দেশের রপ্তানি আয়ের সিংহভাগ জোগান দেয়। বাংলাদেশ এখন বিশ্বের অন্যতম বৃহৎ পোশাক রপ্তানিকারক দেশ, আর ইউরোপ ও আমেরিকার বড় বড় ব্র্যান্ড আমাদের কারখানা থেকে পোশাক কিনে নেয়। এই শিল্পে লক্ষ লক্ষ মানুষ কাজ করেন, যাদের বড় একটি অংশ নারী। গ্রাম থেকে আসা অনেক মেয়ে কারখানার আয়ে নিজের পরিবারের খরচ চালায় এবং ভাইবোনের পড়াশোনার দায়িত্ব নেয়। ফলে নারীর আত্মনির্ভরতা বেড়েছে এবং সমাজে তাদের মর্যাদাও বদলেছে। গাজীপুর, সাভার, নারায়ণগঞ্জ ও চট্টগ্রামে গড়ে উঠেছে বহু কারখানা। তবে এই খাতের সামনে কিছু চ্যালেঞ্জও আছে। ২০১৩ সালে সাভারের রানা প্লাজা ধসে বহু শ্রমিকের মৃত্যুর পর কারখানার ভবন ও অগ্নিনিরাপত্তা নিয়ে বড় ধরনের সংস্কার শুরু হয়েছে। এখনো ন্যায্য মজুরি, নিরাপদ কর্মপরিবেশ ও শ্রমিকের অধিকার নিশ্চিত করা জরুরি। কাঁচামাল আমদানির ওপর নির্ভরতা, গ্যাস ও বিদ্যুতের সংকট এবং বিশ্ববাজারে দামের প্রতিযোগিতাও বড় সমস্যা। সরকার রপ্তানিমুখী শিল্পের জন্য বিশেষ অর্থনৈতিক অঞ্চল গড়ে তুলেছে, যেখানে দেশি ও বিদেশি বিনিয়োগকারীরা নতুন কারখানা স্থাপনের সুযোগ পাচ্ছেন। ভবিষ্যতে টিকে থাকতে হলে শুধু সস্তা শ্রমের ওপর ভরসা না করে উন্নত প্রযুক্তি, দক্ষ জনশক্তি এবং পরিবেশবান্ধব কারখানা গড়ে তুলতে হবে। পোশাকের পাশাপাশি চামড়া, ওষুধ ও হালকা প্রকৌশল পণ্যের মতো নতুন খাতে রপ্তানি বাড়ানোও প্রয়োজন, যাতে অর্থনীতি কোনো একটি খাতের ওপর বেশি নির্ভরশীল না থাকে।"}, {"n": "সংবাদপত্র ও গণমাধ্যম", "x": "গণমাধ্যম হলো সমাজের চোখ ও কান, কারণ এর মাধ্যমে মানুষ দেশ ও বিশ্বের খবর জানতে পারে। বাংলা ভাষায় প্রথম সংবাদপত্র সমাচার দর্পণ প্রকাশিত হয় ১৮১৮ সালে, আর তখন থেকেই সংবাদপত্র মানুষের মত গঠনে বড় ভূমিকা রেখে আসছে। ভাষা আন্দোলন ও মুক্তিযুদ্ধের সময়ও পত্রপত্রিকা ও বেতার জনগণকে সাহস ও তথ্য জুগিয়েছে। ১৯৬৪ সালে ঢাকায় টেলিভিশনের সম্প্রচার শুরু হয়, পরে বেসরকারি চ্যানেল, এফএম রেডিও ও অনলাইন পোর্টাল যুক্ত হয়ে গণমাধ্যমের জগৎ অনেক বড় হয়েছে। এখন মোবাইল ফোনেই মানুষ মুহূর্তের মধ্যে সর্বশেষ খবর পেয়ে যায়। একটি স্বাধীন গণমাধ্যম সরকারের কাজের ওপর নজর রাখে, দুর্নীতি ও অনিয়ম তুলে ধরে এবং সাধারণ মানুষের কথা কর্তৃপক্ষের কাছে পৌঁছে দেয়। তাই গণতন্ত্রে গণমাধ্যমকে চতুর্থ স্তম্ভ বলা হয়। প্রতিবছর ৩ মে বিশ্ব সংবাদপত্র স্বাধীনতা দিবস পালিত হয়। তবে ডিজিটাল যুগে গুজব ও ভুয়া খবরের ছড়াছড়ি একটি গুরুতর সমস্যা হয়ে দাঁড়িয়েছে। কোনো খবর পেলেই তা বিশ্বাস বা শেয়ার না করে উৎস যাচাই করে নেওয়া প্রত্যেক পাঠকের দায়িত্ব। সাংবাদিকদেরও সত্য, নিরপেক্ষতা ও দায়িত্ববোধ মেনে চলতে হয়, কারণ একটি ভুল তথ্য অনেক মানুষের ক্ষতি করতে পারে। বর্তমানে অনেক পত্রিকা কাগজের পাশাপাশি অনলাইন সংস্করণও প্রকাশ করে, ফলে দূর দেশে থাকা প্রবাসীরাও প্রতিদিন নিজের দেশের খবর পড়তে পারেন। পাঠকের আস্থা ধরে রাখাই এখন গণমাধ্যমের সবচেয়ে বড় চ্যালেঞ্জ। শিক্ষার্থীরা নিয়মিত সংবাদপত্র পড়লে তাদের ভাষাজ্ঞান, সাধারণ জ্ঞান ও চিন্তাশক্তি বাড়ে এবং তারা সমাজ সম্পর্কে সচেতন নাগরিক হয়ে ওঠে।"}, {"n": "জনসংখ্যা ও মানবসম্পদ", "x": "বাংলাদেশের আয়তন মাত্র প্রায় ১ লক্ষ ৪৮ হাজার বর্গকিলোমিটার, অথচ এখানে প্রায় সতেরো কোটি মানুষ বাস করে। জনসংখ্যার ঘনত্বের দিক থেকে আমরা বিশ্বের অন্যতম এগিয়ে থাকা দেশগুলোর মধ্যে আছি। এত মানুষের জন্য খাদ্য, বাসস্থান, শিক্ষা, চিকিৎসা ও কাজের ব্যবস্থা করা সহজ কাজ নয়। তবে জনসংখ্যাকে শুধু বোঝা মনে করা ঠিক নয়, কারণ শিক্ষিত, সুস্থ ও দক্ষ মানুষ একটি দেশের সবচেয়ে মূল্যবান সম্পদ। একে মানবসম্পদ বলা হয়। পরিবার পরিকল্পনা কর্মসূচির ফলে গত কয়েক দশকে জন্মহার উল্লেখযোগ্যভাবে কমেছে এবং মানুষের গড় আয়ু বেড়েছে। মায়েদের স্বাস্থ্যসেবা, শিশুদের টিকাদান এবং মেয়েদের শিক্ষার প্রসার এই সাফল্যের পেছনে বড় ভূমিকা রেখেছে। স্বাস্থ্যসেবা ও পুষ্টির মান বাড়ালে মানুষের কর্মক্ষমতাও বাড়ে। এখন প্রয়োজন সবার জন্য মানসম্মত শিক্ষা ও প্রশিক্ষণ, যাতে প্রত্যেক মানুষ নিজের যোগ্যতা অনুযায়ী কাজ করে দেশের উৎপাদনে অবদান রাখতে পারে। লক্ষ লক্ষ দক্ষ ও আধা দক্ষ কর্মী বিদেশে কাজ করে যে অর্থ পাঠান, তা দেশের অর্থনীতিকে শক্তিশালী করছে। অন্যদিকে বয়স্ক মানুষের সংখ্যা ধীরে ধীরে বাড়ছে, তাই ভবিষ্যতে তাদের চিকিৎসা ও সামাজিক নিরাপত্তার দিকেও নজর দিতে হবে। গ্রাম থেকে শহরে আসা মানুষের চাপ কমাতে গ্রামে স্কুল, হাসপাতাল ও কর্মসংস্থানের সুযোগ বাড়ানো দরকার। সীমিত জমির সঠিক ব্যবহার, উন্নত কৃষি এবং ছোট পরিবারের অভ্যাসও আমাদের সম্পদের ওপর চাপ কমাতে সাহায্য করবে। সুপরিকল্পিত নীতি, সচেতনতা এবং সবার অংশগ্রহণ থাকলে বিশাল জনসংখ্যাই একদিন দেশের উন্নয়নের সবচেয়ে বড় শক্তি হয়ে উঠতে পারে।"}, {"n": "মাদকের কুফল ও সামাজিক সচেতনতা", "x": "মাদক এমন এক ভয়ংকর অভিশাপ, যা মানুষের শরীর, মন ও পরিবারকে ধীরে ধীরে ধ্বংস করে দেয়। শুরুতে কৌতূহল, বন্ধুদের চাপ বা মানসিক কষ্ট ভুলে থাকার ইচ্ছা থেকে অনেকে মাদক নিতে শুরু করে, কিন্তু কিছুদিনের মধ্যেই তা নেশায় পরিণত হয়। মাদকাসক্ত ব্যক্তির স্মৃতিশক্তি ও মনোযোগ কমে যায়, শরীর দুর্বল হয়ে পড়ে এবং লিভার, ফুসফুস ও হৃদযন্ত্রের মারাত্মক রোগ দেখা দেয়। নেশার টাকা জোগাড় করতে গিয়ে অনেকে চুরি, ছিনতাই ও অন্যান্য অপরাধে জড়িয়ে পড়ে। এতে শুধু একজন মানুষ নয়, পুরো পরিবার ও প্রতিবেশী কষ্টে পড়ে, আর সমাজে শান্তি নষ্ট হয়। বিশেষ করে তরুণদের মধ্যে এই সমস্যা বেশি দেখা যায়, যা একটি দেশের ভবিষ্যতের জন্য বড় হুমকি। মাদক প্রতিরোধে পরিবারের ভূমিকা সবচেয়ে গুরুত্বপূর্ণ, কারণ সন্তানের সঙ্গে খোলামেলা কথা বললে এবং তাদের বন্ধুদের সম্পর্কে খোঁজ রাখলে বিপদ আগেই ধরা পড়ে। বিদ্যালয়ে সচেতনতামূলক আলোচনা, খেলাধুলা, বিতর্ক ও সাংস্কৃতিক কাজে শিক্ষার্থীদের যুক্ত রাখা খুবই উপকারী। আইন প্রয়োগকারী সংস্থা মাদক চোরাচালান বন্ধে কাজ করে, আর মাদকাসক্তদের জন্য চিকিৎসা ও পুনর্বাসন কেন্দ্র রয়েছে। ধর্মীয় ও সামাজিক মূল্যবোধ শেখানো এবং পরিবারে ভালোবাসাপূর্ণ পরিবেশ বজায় রাখলে সন্তানরা সহজে বিপথে যায় না। নেশার শুরুতেই ধরা পড়লে চিকিৎসায় সুস্থ হওয়ার সম্ভাবনা অনেক বেশি থাকে। আসক্ত ব্যক্তিকে ঘৃণা না করে সহানুভূতির সঙ্গে চিকিৎসার পথে আনা উচিত। প্রতিবছর ২৬ জুন আন্তর্জাতিক মাদকবিরোধী দিবস পালিত হয়, যা আমাদের সবাইকে এই লড়াইয়ে একসঙ্গে এগিয়ে আসার কথা মনে করিয়ে দেয়।"}, {"n": "শিশুর অধিকার ও শিশুশ্রম", "x": "শিশুরা একটি দেশের আগামী দিনের নাগরিক, তাই তাদের সুস্থ ও নিরাপদ বেড়ে ওঠা নিশ্চিত করা সবার দায়িত্ব। বাংলাদেশের শিশু আইন ২০১৩ অনুযায়ী আঠারো বছরের কম বয়সী প্রত্যেক ব্যক্তিই শিশু। জাতিসংঘের শিশু অধিকার সনদ ১৯৮৯ সালে গৃহীত হয়, এবং বাংলাদেশ ১৯৯০ সালে তা অনুমোদন করে। এই সনদে প্রতিটি শিশুর বেঁচে থাকা, খাদ্য, শিক্ষা, চিকিৎসা, খেলাধুলা ও নিরাপত্তার অধিকার স্বীকার করা হয়েছে। প্রাথমিক শিক্ষা এখন আমাদের দেশে অবৈতনিক, আর বিনামূল্যে পাঠ্যবই বিতরণ ও উপবৃত্তির কারণে অনেক শিশু স্কুলে যেতে পারছে। কিন্তু দারিদ্র্যের কারণে এখনো বহু শিশুকে স্কুলে না গিয়ে ছোটবেলাতেই কাজ করতে হয়। কারখানা, দোকান, ইটভাটা ও বাসাবাড়িতে শিশুশ্রম একটি গুরুতর সমস্যা, যা তাদের শিক্ষা, স্বাস্থ্য ও স্বপ্ন কেড়ে নেয়। বাল্যবিবাহ, শিশু নির্যাতন ও অবহেলাও শিশুদের জীবনে গভীর ক্ষত তৈরি করে। এসব সমস্যা দূর করতে আইনের কঠোর প্রয়োগ, দরিদ্র পরিবারের জন্য সহায়তা এবং সবার জন্য শিক্ষার সুযোগ বাড়ানো প্রয়োজন। শিশুদের জন্ম নিবন্ধন করা এবং নিয়মিত টিকা দেওয়াও তাদের অধিকার রক্ষার প্রথম ধাপ। বাবা মা ও শিক্ষকদের উচিত শিশুদের কথা মন দিয়ে শোনা, তাদের মারধর বা ভয় না দেখিয়ে স্নেহ ও যুক্তির মাধ্যমে শেখানো। খেলার মাঠ, শিশুপার্ক ও পাঠাগারের মতো সুযোগ থাকলে শিশুরা আনন্দের সঙ্গে শিখতে পারে এবং তাদের মানসিক বিকাশ ভালো হয়। প্রতিবন্ধী শিশুদেরও সমান সুযোগ ও সম্মান পাওয়ার অধিকার আছে। প্রতিটি শিশু যদি ভালোবাসা, নিরাপত্তা ও সুযোগ পায়, তবে সে নিজের মেধা বিকশিত করে একদিন দেশের গর্ব হয়ে উঠতে পারে।"}], "en": [{"n": "Garment Industry and Industrialisation", "x": "The ready made garment industry is the biggest driving force of the economy of Bangladesh. It began on a small scale in the early eighties, and today it provides the largest share of the export income of the country. Bangladesh is now one of the largest exporters of clothing in the world, and famous brands of Europe and America buy their products from our factories. Millions of people work in this industry, and a large part of them are women. Many girls who come from villages support their families with the money they earn in the factories and also take responsibility for the education of their brothers and sisters. As a result women have become more independent, and their place in society has changed. Many factories have grown up in Gazipur, Savar, Narayanganj and Chattogram. However, the sector also faces several challenges. After the collapse of Rana Plaza at Savar in 2013, in which many workers died, big reforms began in building safety and fire safety. Fair wages, a safe working place and the rights of workers still need constant attention. Dependence on imported raw materials, shortages of gas and electricity and price competition in the world market are also serious problems. To survive in the future, the country cannot depend only on cheap labour, and it must build modern technology, skilled manpower and environment friendly factories. The government has also set up special economic zones for export oriented industries, where local and foreign investors can build new factories. It is also necessary to increase exports of leather goods, medicines and light engineering products, so that the economy does not depend too heavily on a single sector."}, {"n": "Newspapers and Mass Media", "x": "The mass media are the eyes and ears of a society, because through them people learn about the news of their country and the world. The first Bengali newspaper, Samachar Darpan, was published in 1818, and since then newspapers have played an important part in shaping public opinion. During the Language Movement and the Liberation War, newspapers and radio gave courage and information to the people. Television broadcasting began in Dhaka in 1964, and later private channels, FM radio stations and online news portals have made the world of media much larger. Today people can receive the latest news within moments on their mobile phones. A free press watches over the work of the government, exposes corruption and irregularities, and carries the voice of ordinary people to those in authority. For this reason the media is often called the fourth pillar of democracy. World Press Freedom Day is observed every year on 3 May. In the digital age, however, rumours and false news have become a serious problem. It is the duty of every reader to check the source of a report before believing it or sharing it with others. Journalists must also follow the principles of truth, fairness and responsibility, because a single wrong report can harm many people. Many newspapers now publish online editions as well, so that Bangladeshis living far away can read the news of their homeland every day. Keeping the trust of readers is the greatest challenge of the media today. Students who read a newspaper regularly improve their language, general knowledge and thinking power, and they grow up as aware citizens who understand the problems of their society."}, {"n": "Population and Human Resources", "x": "Bangladesh has an area of only about 148 thousand square kilometres, yet nearly 170 million people live here. In terms of density of population we are among the most crowded countries in the world. It is not easy to arrange food, housing, education, medical care and jobs for so many people. However, it is not right to think of the population only as a burden, because educated, healthy and skilled people are the most valuable wealth of a nation, and this wealth is called human resources. Thanks to the family planning programme, the birth rate has fallen considerably in the last few decades and the average life span of people has increased. Health care for mothers, vaccination of children and the spread of education among girls have played a big part in this success. What we need now is quality education and training for everyone, so that each person can work according to his or her ability and add to the production of the country. Many skilled and semi skilled workers go abroad and send money home, and this income strengthens the national economy. On the other hand the number of old people is slowly rising, so attention must also be given in future to their medical care and social security. To reduce the pressure of migration to the cities, more schools, hospitals and job opportunities must be created in the villages. The wise use of limited land, improved farming and the habit of keeping families small can also reduce the pressure on our resources. With wise policies, awareness and the participation of all, this huge population can one day become the greatest force for the development of the country."}, {"n": "Evils of Drugs and Social Awareness", "x": "Drug addiction is a terrible curse that slowly destroys the body, the mind and the family of a person. In the beginning some people try drugs out of curiosity, pressure from friends or a wish to forget their mental pain, but within a short time the habit turns into an addiction. An addicted person loses memory and concentration, becomes physically weak and may suffer from serious diseases of the liver, the lungs and the heart. To collect money for the habit, many addicts become involved in theft, snatching and other crimes. Not only the individual but the whole family and the neighbours suffer, and peace in society is disturbed. This problem is seen more among young people, which is a great threat to the future of a country. In preventing drug abuse the role of the family is the most important, because when parents talk openly with their children and know about their friends, danger can be noticed early. Awareness talks in schools and the involvement of students in sports, debates and cultural work are also very helpful. Law enforcement agencies work to stop the smuggling of drugs, and there are treatment and rehabilitation centres for those who are addicted. Teaching moral values and keeping a loving atmosphere at home helps children to stay away from the wrong path. If an addiction is noticed early, the chance of recovery through treatment is much higher. A person who has fallen into addiction should be brought to treatment with sympathy and not with hatred. The International Day against Drug Abuse and Illicit Trafficking is observed on 26 June every year, and it reminds all of us to stand together in this struggle."}, {"n": "Child Rights and Child Labour", "x": "Children are the citizens of tomorrow, so it is the duty of everyone to ensure that they can grow up healthy and safe. According to the Children Act of 2013 of Bangladesh, every person below the age of eighteen is a child. The United Nations Convention on the Rights of the Child was adopted in 1989, and Bangladesh approved it in 1990. This convention recognises the right of every child to life, food, education, medical care, play and protection. Primary education is now free in our country, and the distribution of free textbooks and stipends has helped many children to attend school. Yet because of poverty, a large number of children still have to work at an early age instead of going to school. Child labour in factories, shops, brick fields and private homes is a serious problem, and it takes away the education, the health and the dreams of children. Early marriage, abuse and neglect also leave deep wounds in the lives of children. To remove these problems we need strict enforcement of law, support for poor families and more opportunities for education for all. Playgrounds, parks for children and libraries help children to learn with joy and develop a healthy mind. Children with disabilities also have the right to equal opportunity and respect. Registering the birth of every child and giving regular vaccines are also the first steps in protecting their rights. Parents and teachers should listen to children carefully and teach them with affection and reason, without beating or frightening them. If every child receives love, safety and opportunity, he or she can develop talent and one day become the pride of the country."}]};
